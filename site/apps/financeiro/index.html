<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Financeiro Nervia | Ecossistema Nervia</title>
<script src="/config.js"></script>
<script src="/versoes.js"></script>
<script src="/moeda.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/fichario.css">
<style>
/* Financeiro Nervia (app "financeiro", tabelas fin_): custos recorrentes, contas a pagar, contas a receber (as cobranças do
   app Contratos, só leitura, + recebimentos avulsos) e saldo das contas. Só a equipe Nervia. A tela só lê as tabelas;
   toda gravação é por função (fin_*) e vai para a auditoria. Valores em reais pelo /moeda.js (nunca type="number"). */
[hidden]{display:none!important}
:root{--bg:#f4f7f9;--surface:#fff;--surface-2:#eaf1f4;--border:#dde6ec;--line:#dde6ec;--ink:#0f1b2d;--ink-soft:#4f5f73;--muted:#6b7a8c;
  --accent:#107d9a;--accent-soft:#e1f1f5;--ok:#1d7a46;--ok-soft:#e2f4e9;--warn:#9a5b00;--warn-soft:#fbebd2;--crit:#b3261e;--crit-soft:#f9e0de;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 48px}
.topo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.marca{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.04em}
.topo b{font-size:16px}.topo span{color:var(--muted);font-size:12.5px}
.embutido .topo{display:none}
h2{font-size:15px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 8px}
.painel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:21px;margin-top:4px}
.kpi .h{color:var(--muted);font-size:12px}
.kpi.alerta .v{color:var(--crit)}.kpi.atencao .v{color:var(--warn)}.kpi.bom .v{color:var(--ok)}
.kpi.clica{cursor:pointer}.kpi.clica:hover{border-color:var(--accent)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grade2>*{min-width:0}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font-size:12px;color:var(--ink-soft);font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=search],input[type=file],select,textarea{background:#fff;border:1px solid #c5d2db;border-radius:8px;padding:7px 9px;min-height:36px;width:100%}
input:invalid{border-color:var(--crit)}
textarea{min-height:60px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;border:1px solid transparent;font-weight:600;cursor:pointer;min-height:34px;background:var(--accent);color:#fff;white-space:nowrap}
.btn.sec{background:#fff;border-color:#c5d2db;color:var(--ink-soft)}.btn.sec:hover{background:var(--surface-2)}
.btn.perigo{background:var(--crit-soft);color:var(--crit)}
.btn.lnk{background:none;border:0;padding:2px 4px;min-height:0;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:12.5px;font-weight:600;color:var(--ok)}.msg.erro{color:var(--crit)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.tab td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.tab td.n,.tab th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.tab tr.clica{cursor:pointer}.tab tr.clica:hover td{background:var(--surface-2)}
.tab tfoot td{font-weight:700;border-top:2px solid var(--border)}
.tab tr.cancelado td{color:var(--muted);text-decoration:line-through}
.rolar{overflow:auto;max-height:70vh}.rolar thead th{position:sticky;top:0;z-index:1}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-soft)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.atencao{background:var(--warn-soft);color:var(--warn)}.pill.alerta{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.mut{color:var(--muted);font-size:12.5px}.mono{font-family:var(--mono)}
.neg{color:var(--crit)}.pos{color:var(--ok)}
.aviso{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500;margin-bottom:12px}
.info{padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink-soft);margin-bottom:12px;font-size:13px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form .dois{grid-column:span 2}.form .tudo{grid-column:1/-1}
dialog{border:0;border-radius:14px;padding:18px;width:min(860px,calc(100% - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink)}
dialog.peq{width:min(520px,calc(100% - 24px))}
dialog::backdrop{background:#0008}
.dlgtopo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.fechar{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.dados{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:13.5px;margin:6px 0 14px}.dados dt{color:var(--muted)}.dados dd{margin:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 6px 24px #0004}
@media (max-width:860px){.grade2{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .dois{grid-column:auto}.dados{grid-template-columns:1fr}}
@media print{.barra,.filtros,.acoes,button{display:none!important}body{background:#fff}.painel{border:0;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><div class="marca">FN</div><div><b>Financeiro Nervia</b><br><span>Custos, contas a pagar, contas a receber e saldo das contas</span><br><span data-versao="financeiro"></span></div></div>
  <div id="aviso" class="painel">Carregando…</div>
  <div id="app" hidden>
    <div class="barra fichario">
      <div class="orelhas">
        <button class="aba on" data-v="painel" title="Painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Painel</span></button>
        <button class="aba" data-v="pagar" title="Contas a pagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3v14M6 11l6 6 6-6"/><path d="M4 21h16"/></svg><span>A pagar</span></button>
        <button class="aba" data-v="receber" title="Contas a receber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 21V7M6 13l6-6 6 6"/><path d="M4 3h16"/></svg><span>A receber</span></button>
        <button class="aba" data-v="custos" title="Custos recorrentes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><path d="M12 8v4l3 2"/></svg><span>Custos</span></button>
        <button class="aba" data-v="contas" title="Contas e saldos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Contas</span></button>
        <button class="aba" data-v="config" title="Configuração"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Configuração</span></button>
      </div>
      <div class="ficha"><span class="mut" id="fichaTxt"></span></div>
    </div>
    <div id="conteudo"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>
<dialog id="dlg2" class="peq"></dialog>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "value") n.value = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const CFG = window.NERVIA_CONFIG || {};
const M = window.NERVIA_MOEDA;
if (window.self !== window.top) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const checar = r => { if (r.error) throw r.error; return r.data; };
async function todos(mk) { const out = []; for (let i = 0; ; i += 1000) { const d = checar(await mk().range(i, i + 999)); out.push(...d); if (d.length < 1000) return out; } }
const rpc = async (f, args) => checar(await sb.rpc(f, args));

const hoje = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const R = v => (Number(v) < 0 ? "− " : "") + "R$ " + Math.abs(Number(v || 0)).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const br = d => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
const semAc = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const erroTxt = e => { if (e && e.mostrado) e = e.erro; return (e && (e.message || e.error_description)) || String(e); };
const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function csv(nome, cab, linhas) {
  const q = v => { const s = v == null ? "" : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const url = URL.createObjectURL(new Blob(["﻿" + [cab, ...linhas].map(l => l.map(q).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const a = el("a", { href: url, download: nome }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const num = v => v == null ? "" : String(Number(v)).replace(".", ",");
const TIPO_CONTA = { banco: "Banco", cartao_pessoal: "Cartão pessoal", dinheiro: "Dinheiro / fora do banco" };
const SIT = { aberta: ["Em aberto", "info"], atrasada: ["Atrasada", "alerta"], paga: ["Paga", "ok"], recebida: ["Recebida", "ok"], cancelada: ["Cancelada", ""] };
const REC = { nenhuma: "Não se repete", mensal: "Todo mês", anual: "Todo ano" };
const pill = k => { const [t, c] = SIT[k] || [k, ""]; return el("span", { class: "pill " + c }, t); };

const S = { contas: [], cats: [], custos: [], hist: [], lanc: [], transf: [], ajustes: [], cob: [], saldos: [], movs: [], cfg: {}, cnpjs: 0, precos: [],
  view: "painel", fp: { sit: "abertas", cat: "", conta: "", q: "", de: "", ate: "" }, fr: { sit: "abertas" }, fcu: { grupo: "", ativos: true },
  fm: { conta: "", de: hoje().slice(0, 8) + "01", ate: hoje() } };

async function carregar() {
  const [contas, cats, custos, hist, lanc, transf, ajustes, cfg, saldos, movs, cnpj, precos] = await Promise.all([
    todos(() => sb.from("fin_contas").select("*").order("ordem").order("nome")),
    todos(() => sb.from("fin_categorias").select("*").order("ordem").order("nome")),
    todos(() => sb.from("fin_custos").select("*").order("grupo").order("nome")),
    todos(() => sb.from("fin_custos_hist").select("*").order("em", { ascending: false }).order("id", { ascending: false })),
    todos(() => sb.from("fin_lancamentos").select("*").order("vencimento").order("id")),
    todos(() => sb.from("fin_transferencias").select("*").order("data", { ascending: false })),
    todos(() => sb.from("fin_ajustes").select("*").order("data", { ascending: false })),
    todos(() => sb.from("fin_config").select("*")),
    rpc("fin_saldos", {}),
    todos(() => sb.from("fin_movimentos_v").select("*").order("data", { ascending: false })),
    todos(() => sb.from("nf_empresas").select("cnpj").eq("ativo", true)),
    todos(() => sb.from("preco_itens").select("*").eq("ativo", true).order("ordem"))]);
  Object.assign(S, { contas, cats, custos, hist, lanc, transf, ajustes, cfg: cfg[0] || {}, saldos, movs, cnpjs: cnpj.length, precos });
  S.cob = S.cfg.ctr_empresa_id == null ? [] : await todos(() => sb.from("ctr_cobrancas_v").select("*").eq("empresa_id", S.cfg.ctr_empresa_id).order("vencimento"));
}
const conta = id => S.contas.find(c => c.id === id) || {};
const cat = id => S.cats.find(c => c.id === id) || {};
const situacao = l => l.cancelado_em ? "cancelada" : l.pago_em ? (l.tipo === "pagar" ? "paga" : "recebida") : l.vencimento < hoje() ? "atrasada" : "aberta";
const ativoHoje = c => c.desde <= hoje() && (!c.ate || c.ate >= hoje());
const custoPlataforma = () => S.custos.filter(c => c.plataforma && ativoHoje(c)).reduce((s, c) => s + Number(c.mensal_brl), 0);
// recebimentos do Contratos em aberto (situação da view do Contratos)
const cobAberta = c => !c.pago_em;

// ---------------------------------------------------------------- navegação e utilidades
document.querySelector(".orelhas").addEventListener("click", e => { const b = e.target.closest(".aba"); if (b) ir(b.dataset.v); });
function ir(v) { S.view = v; render(); }
function render() {
  for (const b of document.querySelectorAll(".orelhas .aba")) b.classList.toggle("on", b.dataset.v === S.view);
  $("#fichaTxt").textContent = "Hoje: " + br(hoje()) + " · só a equipe Nervia";
  const c = $("#conteudo"); c.replaceChildren();
  ({ painel: vPainel, pagar: vPagar, receber: vReceber, custos: vCustos, contas: vContas, config: vConfig })[S.view](c);
}
let toastT;
function toast(txt) { const t = $("#toast"); t.textContent = txt; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5000); }
async function salvar(fn, msgEl, okTxt) {
  try { if (msgEl) { msgEl.className = "msg"; msgEl.textContent = "Gravando…"; } const r = await fn(); await carregar(); render();
    if (msgEl && msgEl.isConnected) msgEl.textContent = okTxt || "Gravado."; else toast(okTxt || "Gravado."); return r; }
  catch (e) { if (msgEl && msgEl.isConnected) { msgEl.className = "msg erro"; msgEl.textContent = erroTxt(e); } else alert(erroTxt(e)); throw { mostrado: true, erro: e }; }
}
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.mostrado) e.preventDefault(); });
function dialogo(titulo, corpo, { peq = false } = {}) {
  const d = peq ? $("#dlg2") : $("#dlg");
  d.replaceChildren(el("div", { class: "dlgtopo" }, el("h2", {}, titulo), el("button", { class: "fechar", type: "button", "aria-label": "Fechar", onclick: () => d.close() }, "×")), corpo);
  if (!d.open) d.showModal();
  return d;
}
const campo = (rot, inp, cls) => el("div", { class: "campo " + (cls || "") }, el("label", {}, rot), inp);
const sel = (opcoes, valor, attrs = {}) => { const s = el("select", attrs); for (const [v, t] of opcoes) s.append(el("option", { value: v, selected: String(v) === String(valor ?? "") }, t)); return s; };
const moeda = (valor, attrs = {}) => { const i = el("input", { type: "text", inputmode: "decimal", "data-moeda": "", value: M.fmt(valor), ...attrs }); i.addEventListener("input", () => M.conferir(i)); return i; };
const lerMoeda = (i, rot, obrig = true) => { const v = M.ler(i.value); if (v === null && !obrig) return null; if (v === null || Number.isNaN(v)) throw new Error("Confira o valor de " + rot + " (formato 1.234,56)."); return v; };
const optContas = (vazio) => [...(vazio ? [["", vazio]] : []), ...S.contas.filter(c => c.ativo).map(c => [c.id, c.nome])];
const optCats = (tipo, vazio = "— sem categoria —") => [["", vazio], ...S.cats.filter(c => c.ativo && (c.tipo === "ambos" || c.tipo === tipo)).map(c => [c.id, c.nome])];
const kpi = (rot, val, dica, cls, onclick) => el("div", { class: "kpi " + (cls || "") + (onclick ? " clica" : ""), onclick }, el("div", { class: "l" }, rot), el("div", { class: "v" }, val), dica ? el("div", { class: "h" }, dica) : null);

// ---------------------------------------------------------------- Painel
function vPainel(c) {
  const h = hoje(), ate30 = addDias(h, 30), mes = h.slice(0, 7);
  const ab = S.lanc.filter(l => !l.pago_em && !l.cancelado_em);
  const pag30 = ab.filter(l => l.tipo === "pagar" && l.vencimento >= h && l.vencimento <= ate30);
  const rec30 = ab.filter(l => l.tipo === "receber" && l.vencimento >= h && l.vencimento <= ate30);
  const cob30 = S.cob.filter(x => cobAberta(x) && x.vencimento >= h && x.vencimento <= ate30);
  const pagAtr = ab.filter(l => l.tipo === "pagar" && l.vencimento < h);
  const recAtr = ab.filter(l => l.tipo === "receber" && l.vencimento < h), cobAtr = S.cob.filter(x => cobAberta(x) && x.vencimento < h);
  const soma = (a, f = x => x.valor) => a.reduce((s, x) => s + Number(f(x)), 0);
  // resultado do mês: o que entrou e saiu de verdade (pago/recebido), sem transferências, acertos e categorias fora do resultado
  const noMes = S.movs.filter(m => m.data && m.data.startsWith(mes) && (m.tipo === "pagar" || m.tipo === "receber") && (m.categoria_id == null || cat(m.categoria_id).entra_resultado !== false));
  const ent = soma(noMes.filter(m => m.valor > 0), m => m.valor), sai = -soma(noMes.filter(m => m.valor < 0), m => m.valor);
  const plat = custoPlataforma(), porCnpj = S.cnpjs ? plat / S.cnpjs : 0;
  c.append(el("h3", {}, "Saldo das contas"),
    el("div", { class: "kpis" }, S.saldos.map(s => s.tipo === "cartao_pessoal"
      ? kpi(s.nome, R(-Math.min(0, s.saldo)), Number(s.saldo) < 0 ? "a Nervia deve ao Marco" : "nada a reembolsar", Number(s.saldo) < 0 ? "atencao" : "bom", () => { S.fm.conta = s.conta_id; ir("contas"); })
      : kpi(s.nome, R(s.saldo), s.ultimo_acerto ? "conferido com o banco em " + br(s.ultimo_acerto) : "ainda não conferido com o banco", Number(s.saldo) < 0 ? "alerta" : "", () => { S.fm.conta = s.conta_id; ir("contas"); }))),
    el("h3", {}, "Próximos 30 dias"),
    el("div", { class: "kpis" },
      kpi("A pagar", R(soma(pag30)), pag30.length + " conta(s)", "", () => { Object.assign(S.fp, { sit: "abertas" }); ir("pagar"); }),
