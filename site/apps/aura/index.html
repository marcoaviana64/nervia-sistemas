<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NVAura — gestão | Nervia</title>
<script src="/config.js"></script>
<script src="/versoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/fichario.css">
<style>
/* Gestão do NVAura (app "aura" da Área do Cliente, pedido do Marco em 25/11/2026). Só a equipe Nervia: o login é o do
   ecossistema e tudo vem pela aur_admin_painel (security definer + eh_admin). O NVAura em si (avaliar e criar o cartão)
   continua sem login e senha, em /aura/. Nem aqui aparece quem deu cada nota: a nota não guarda autor. */
:root{
  --bg:#f6f4fb;--surface:#fff;--surface-2:#f0ebfb;--border:#e2dbf2;--ink:#140d26;--ink-soft:#5a5274;--ink-faint:#8f88a8;
  --accent:#6d3cf0;--accent-2:#ff5c9a;--gold:#f2a23a;--primary:#3b1d9a;
  --ok:#1d7f46;--ok-bg:#e6f4ec;--crit:#b3261e;--crit-bg:#fbeaea;--warn:#a86400;--warn-bg:#fff3e0;--info:#5427d6;--info-bg:#efe9ff;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0818;--surface:#140d26;--surface-2:#1c1433;--border:#2c2147;--ink:#efeaff;--ink-soft:#b6abd6;--ink-faint:#857aa6;
  --accent:#a487ff;--accent-2:#ff7aae;--gold:#ffbe5c;--primary:#d6c8ff;
  --ok:#43c07e;--ok-bg:rgba(67,192,126,.14);--crit:#f07a72;--crit-bg:rgba(240,122,114,.14);--warn:#e3ad57;--warn-bg:rgba(227,173,87,.14);--info:#b9a1ff;--info-bg:rgba(164,135,255,.15);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.oculto{display:none!important}
.casca{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.topo{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.topo .marca{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6d3cf0,#ff5c9a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.topo span{color:var(--ink-soft);font-size:.8rem}
.embutido .topo{display:none}
.barra .aba .n{font-size:11.5px;opacity:.75;margin-left:4px}
.barra .dir{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
select,input{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)}
.bt{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ink-soft)}.bt.peq{padding:3px 9px;font-size:12px}.bt.perigo{color:var(--crit);border-color:var(--crit)}
.bt.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.msg{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:13px}
.msg.err{background:var(--crit-bg);color:var(--crit)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--ink-soft)}
.kpi.crit b{color:var(--crit)}.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.t-crit{background:var(--crit-bg);color:var(--crit)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-info{background:var(--info-bg);color:var(--info)}.t-mut{background:var(--surface-2);color:var(--ink-soft)}
.mut{color:var(--ink-soft);font-size:12.5px}
.vazio{color:var(--ink-soft);text-align:center;padding:26px}
.dois{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media (max-width:820px){.dois{grid-template-columns:1fr}.esc-m{display:none}}
.ft{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.pessoa{display:flex;gap:10px;align-items:center}
.est{color:var(--gold);letter-spacing:1px}
/* gráfico de colunas por dia: avaliações (roxo) e pedidos (rosa), lado a lado */
.colunas{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--border);padding-top:6px}
.colunas .d{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1px;height:100%;min-width:0;position:relative}
.colunas .d i{display:block;width:45%;border-radius:3px 3px 0 0;min-height:1px}
.colunas .d i.a{background:var(--accent)}.colunas .d i.p{background:var(--accent-2);opacity:.75}
.eixo{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:4px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barras .l{display:grid;grid-template-columns:62px minmax(0,1fr) 56px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.barras .b{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.barras .b i{display:block;height:100%;background:var(--gold);border-radius:5px}
dialog{border:0;border-radius:14px;padding:18px;max-width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);min-height:70px}
</style>
</head>
<body>
<div class="casca">
  <div class="topo"><div class="marca">AU</div><div><b>NVAura — gestão</b><br><span>Uso, avaliações, cartões e moderação · só a equipe Nervia</span><br><span data-versao="aura"></span></div></div>
  <div id="aviso">Carregando…</div>
  <div id="app" class="oculto">
    <div class="barra fichario">
      <div class="orelhas">
        <button class="aba on" data-v="geral" title="Visão geral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg><span>Visão geral</span></button>
        <button class="aba" data-v="cartoes" title="Cartões"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 16.5c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4M15 10h3M15 13.5h3"/></svg><span>Cartões</span><span class="n" id="nCa"></span></button>
        <button class="aba" data-v="alertas" title="Alertas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg><span>Alertas</span><span class="n" id="nAl"></span></button>
      </div>
      <div class="ficha"><div class="dir">
        <select id="selPer" title="Período"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option><option value="365">1 ano</option></select>
        <a class="bt" href="/aura/sobre.html" target="_blank" rel="noopener">Página do NVAura</a>
        <button class="bt" id="btAtualizar">Atualizar</button>
      </div></div>
    </div>
    <div id="msg" class="msg oculto"></div>
    <div id="tela"></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<script>
const CFG = window.NERVIA_CONFIG || {};
const EMBUTIDO = window.self !== window.top;
if (EMBUTIDO) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "America/Sao_Paulo";
const num = n => Number(n || 0).toLocaleString("pt-BR");
const fmt1 = x => x == null ? "—" : Number(x).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";
const data = v => v ? new Date(String(v).length === 10 ? v + "T12:00:00" : v).toLocaleDateString("pt-BR", { timeZone: TZ }) : "—";
const estrelas = m => m == null ? '<span class="mut">sem nota</span>' : `<span class="est">${"★".repeat(Math.round(m))}${"☆".repeat(5 - Math.round(m))}</span>`;
const iniciais = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
let P = null, VISTA = "geral", BUSCA = "", ORDEM = "total";

async function rpc(nome, args) { const { data, error } = await sb.rpc(nome, args); if (error) throw new Error(error.message); return data; }
function msg(t, ok) { const m = $("msg"); m.className = "msg " + (ok ? "ok" : "err"); m.textContent = t; m.classList.remove("oculto"); setTimeout(() => m.classList.add("oculto"), 6000); }

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("aviso").innerHTML = 'Entre na <a href="/cliente/" target="_top">Área do Cliente</a>.'; return; }
  try {
    await carregar();
    $("aviso").classList.add("oculto"); $("app").classList.remove("oculto");
    render();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar().then(render).catch(() => {}); });
  } catch (e) { $("aviso").textContent = /equipe Nervia/.test(e.message) ? "Gestão só da equipe Nervia." : "Não foi possível carregar: " + e.message; }
}
async function carregar() { P = await rpc("aur_admin_painel", { p_dias: Number($("selPer").value) }); }
function render() {
  document.querySelectorAll(".aba").forEach(b => b.classList.toggle("on", b.dataset.v === VISTA));
  $("nCa").textContent = P.pessoas.cartoes || "";
  $("nAl").textContent = (P.picos.length + P.pessoas.bloqueados) || "";
  $("tela").innerHTML = ({ geral: vGeral, cartoes: vCartoes, alertas: vAlertas })[VISTA]();
  ligar();
}

// ---------------------------------------------------------------- visão geral
function vGeral() {
  const pe = P.pessoas, av = P.avaliacoes, pd = P.pedidos;
  const maxD = Math.max(1, ...P.por_dia.map(d => Math.max(d.avaliacoes, d.pedidos)));
  const est = av.estrelas || [0, 0, 0, 0, 0], maxE = Math.max(1, ...est), totE = est.reduce((a, b) => a + b, 0);
  const top = P.cartoes.filter(c => c.total).slice(0, 10);
  return `<div class="kpis">
      <div class="kpi"><b>${num(pe.cartoes)}</b><span>pessoas com cartão</span></div>
      <div class="kpi ok"><b>${num(pe.ativos)}</b><span>ativas no período (pediram ou receberam avaliação)</span></div>
      <div class="kpi"><b>${num(pe.novos)}</b><span>cartões novos no período</span></div>
      <div class="kpi"><b>${num(av.total)}</b><span>avaliações (${num(av.periodo)} no período)</span></div>
      <div class="kpi"><b>${fmt1(av.media)}</b><span>nota média geral (das que entraram na nota)</span></div>
      <div class="kpi"><b>${num(pd.total)}</b><span>pedidos (leituras do QR) · ${pct(av.periodo, pd.periodo)} viraram avaliação no período</span></div>
      <div class="kpi"><b>${num(pe.radar_agora)}</b><span>no radar agora (${num(pe.radar_ligado)} com o radar ligado)</span></div>
      <div class="kpi ${pe.bloqueados ? "warn" : ""}"><b>${num(pe.bloqueados)}</b><span>cartões bloqueados</span></div>
    </div>
    <div class="dois">
      <div class="card"><h2>Por dia (últimos ${P.dias} dias)</h2>
        <div class="colunas" role="img" aria-label="Avaliações e pedidos por dia">${P.por_dia.map(d => `<div class="d" title="${data(d.dia)}: ${d.avaliacoes} avaliações, ${d.pedidos} pedidos, ${d.novos} cartões novos"><i class="a" style="height:${d.avaliacoes / maxD * 100}%"></i><i class="p" style="height:${d.pedidos / maxD * 100}%"></i></div>`).join("")}</div>
        <div class="eixo"><span>${data(P.de)}</span><span>${data(P.hoje)}</span></div>
        <div class="leg"><span><i style="background:var(--accent)"></i>avaliações</span><span><i style="background:var(--accent-2)"></i>pedidos (leituras do QR)</span></div></div>
      <div class="card"><h2>Notas dadas</h2><div class="barras">${[5, 4, 3, 2, 1].map(e => `<div class="l"><span>${"★".repeat(e)}</span><span class="b"><i style="width:${est[e - 1] / maxE * 100}%"></i></span><span class="num">${num(est[e - 1])}</span></div>`).join("")}</div>
        <p class="mut">${num(totE)} avaliações no total · ${num(av.esperando)} esperando o lote de 5 · ${num(pe.avaliados)} pessoas já avaliadas.</p></div>
    </div>
    <div class="card"><h2>Mais avaliados</h2>${top.length ? tabelaCartoes(top, false) : '<div class="vazio">Ninguém foi avaliado ainda.</div>'}</div>
    <p class="mut">Ninguém (nem a equipe Nervia) vê quem deu cada nota: a nota não guarda autor, hora nem aparelho. O ID AU# é só desta gestão (não é o QR nem o código do radar).</p>`;
}

// ---------------------------------------------------------------- cartões
function tabelaCartoes(lista, acoes) {
  return `<div class="tw"><table><tr><th>Pessoa</th><th class="num">Avaliações</th><th class="num">No período</th><th>Nota</th><th class="num esc-m">Pedidos</th><th class="esc-m">Desde</th>${acoes ? "<th></th>" : ""}</tr>
    ${lista.map(c => `<tr><td><div class="pessoa">${c.foto ? `<img class="ft" src="${esc(c.foto)}" alt="">` : `<span class="ft">${esc(iniciais(c.nome))}</span>`}
        <div><b>${esc(c.nome)}</b><div class="mut">${esc(c.id)}${c.radar ? " · radar ligado" : ""}</div>${c.bloqueado ? tag("bloqueado: " + c.bloqueado_motivo, "t-crit") : ""}</div></div></td>
      <td class="num"><b>${num(c.total)}</b>${c.total - c.na_nota ? `<div class="mut">${c.total - c.na_nota} no lote</div>` : ""}</td>
      <td class="num">${num(c.periodo)}</td>
      <td>${c.media != null ? `${estrelas(c.media)} <b>${fmt1(c.media)}</b>` : '<span class="mut">sem nota</span>'}</td>
      <td class="num esc-m">${num(c.pedidos)}<div class="mut">${pct(c.total, c.pedidos)}</div></td>
      <td class="esc-m">${data(c.criado_em)}${c.ultima ? `<div class="mut">última ${data(c.ultima)}</div>` : ""}</td>
      ${acoes ? `<td style="white-space:nowrap">${c.foto ? `<button class="bt peq" data-foto="${c.user_id}">Tirar foto</button> ` : ""}${c.bloqueado ? `<button class="bt peq" data-desb="${c.user_id}">Desbloquear</button>` : `<button class="bt peq perigo" data-bloq="${c.user_id}">Bloquear</button>`}</td>` : ""}</tr>`).join("")}
  </table></div>`;
}
const tag = (t, c) => `<span class="tag ${c}">${esc(t)}</span>`;
function vCartoes() {
  const b = BUSCA.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
  let l = P.cartoes.filter(c => !b || (c.nome + " " + c.id).normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().includes(b));
  const ord = { total: (x, y) => y.total - x.total, nota: (x, y) => (y.media ?? -1) - (x.media ?? -1), novos: (x, y) => String(y.criado_em).localeCompare(String(x.criado_em)), periodo: (x, y) => y.periodo - x.periodo };
  l = [...l].sort(ord[ORDEM]);
  return `<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <input id="busca" placeholder="Buscar por nome ou ID" value="${esc(BUSCA)}" style="flex:1;min-width:180px">
      <select id="ordem"><option value="total">Mais avaliados</option><option value="periodo">Mais avaliados no período</option><option value="nota">Maior nota</option><option value="novos">Mais novos</option></select>
      <button class="bt" id="btCsv">Baixar CSV</button></div>
    ${l.length ? tabelaCartoes(l, true) : '<div class="vazio">Nenhum cartão.</div>'}
    <p class="mut">Bloquear: o QR do cartão para de funcionar ("cartão indisponível"), a pessoa some do radar e vê o aviso no próprio app. Tirar foto: para foto ofensiva ou que não é a pessoa. Tudo fica na auditoria, com o motivo.</p></div>`;
}

// ---------------------------------------------------------------- alertas
function vAlertas() {
  const bl = P.cartoes.filter(c => c.bloqueado);
  return `<div class="card"><h2>Picos de avaliações (10 ou mais num dia)</h2>
      ${P.picos.length ? `<div class="tw"><table><tr><th>Dia</th><th>Cartão</th><th class="num">Avaliações no dia</th></tr>
        ${P.picos.map(p => `<tr><td>${data(p.dia)}</td><td><b>${esc(p.nome)}</b><div class="mut">${esc(p.id)}</div></td><td class="num"><b>${p.avaliacoes}</b></td></tr>`).join("")}</table></div>
        <p class="mut">Muitas avaliações num dia podem ser um evento (palestra, atendimento em massa) ou o QR repassado em grupo. Cada celular só avalia o mesmo cartão uma vez por dia.</p>`
      : '<div class="vazio">Nenhum pico no período.</div>'}</div>
    <div class="card"><h2>Cartões bloqueados</h2>${bl.length ? tabelaCartoes(bl, true) : '<div class="vazio">Nenhum cartão bloqueado.</div>'}</div>`;
}

// ---------------------------------------------------------------- ações
function pedirMotivo(titulo, botao, acao) {
  const d = $("dlg");
  d.innerHTML = `<h3 style="margin-top:0">${esc(titulo)}</h3><label class="mut" for="mot">Motivo (vai para a auditoria)</label><textarea id="mot" maxlength="300"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="bt" id="dNao">Cancelar</button><button class="bt pri" id="dSim">${esc(botao)}</button></div><div id="dM"></div>`;
  d.showModal();
  $("dNao").onclick = () => d.close();
  $("dSim").onclick = async () => {
    try { await acao($("mot").value); d.close(); await carregar(); render(); msg("Feito. Registrado na auditoria.", true); }
    catch (e) { $("dM").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
}
function ligar() {
  $("busca")?.addEventListener("input", e => { BUSCA = e.target.value; const pos = e.target.selectionStart; render(); const i = $("busca"); i.focus(); i.setSelectionRange(pos, pos); });
  if ($("ordem")) { $("ordem").value = ORDEM; $("ordem").onchange = e => { ORDEM = e.target.value; render(); }; }
  $("btCsv")?.addEventListener("click", () => {
    const l = [["id", "nome", "avaliacoes", "no_periodo", "na_nota", "media", "pedidos", "desde", "ultima", "radar", "bloqueado"]]
      .concat(P.cartoes.map(c => [c.id, c.nome, c.total, c.periodo, c.na_nota, c.media ?? "", c.pedidos, String(c.criado_em).slice(0, 10), c.ultima ?? "", c.radar ? "sim" : "não", c.bloqueado ? "sim" : "não"]));
    const csv = "﻿" + l.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "nvaura-cartoes.csv"; a.click();
  });
  document.querySelectorAll("[data-bloq]").forEach(b => b.onclick = () => pedirMotivo("Bloquear este cartão?", "Bloquear", m => rpc("aur_admin_bloquear", { p_user: b.dataset.bloq, p_bloquear: true, p_motivo: m })));
  document.querySelectorAll("[data-desb]").forEach(b => b.onclick = () => pedirMotivo("Desbloquear este cartão?", "Desbloquear", m => rpc("aur_admin_bloquear", { p_user: b.dataset.desb, p_bloquear: false, p_motivo: m })));
  document.querySelectorAll("[data-foto]").forEach(b => b.onclick = () => pedirMotivo("Tirar a foto deste cartão?", "Tirar foto", m => rpc("aur_admin_tirar_foto", { p_user: b.dataset.foto, p_motivo: m })));
}
document.querySelectorAll(".aba").forEach(b => b.addEventListener("click", () => { VISTA = b.dataset.v; render(); }));
