<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contas e Licenças Microsoft 365 | Nervia</title>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
/* Contas e Licenças Microsoft 365 (app "licencas", tabelas lic_). A equipe Nervia carrega a exportação de usuários do
   Microsoft 365 e a fatura do mês; o cliente só lê as unidades liberadas para ele. */
:root{
  --bg:#f3f6f8;--surface:#fff;--surface-2:#eaf1f4;--border:#dde6ec;--ink:#0f1b2d;--ink-soft:#4f5f73;--ink-faint:#8796a8;
  --accent:#107e99;--accent-soft:#e3f3f7;--primary:#0b2545;
  --ok:#1d7f46;--ok-bg:#e6f4ec;--crit:#b3261e;--crit-bg:#fbeaea;--warn:#a86400;--warn-bg:#fff3e0;--info:#2568a8;--info-bg:#e7f1fa;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620;--surface:#122130;--surface-2:#18293a;--border:#24394e;--ink:#eef4f8;--ink-soft:#b3c3d1;--ink-faint:#7f93a6;
  --accent:#3fc1dd;--accent-soft:rgba(63,193,221,.15);--primary:#cfe3f0;
  --ok:#43c07e;--ok-bg:rgba(67,192,126,.14);--crit:#f07a72;--crit-bg:rgba(240,122,114,.14);--warn:#e3ad57;--warn-bg:rgba(227,173,87,.14);--info:#5eabe8;--info-bg:rgba(94,171,232,.14);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.oculto{display:none!important}
.casca{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.topo{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.topo .marca{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,#107e99,#0b2545);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.topo span{color:var(--ink-soft);font-size:.8rem}
.embutido .topo{display:none}
.barra{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 8px;margin-bottom:12px}
.barra .aba{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink-soft)}
.barra .aba.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.barra .dir{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft)}
.barra .dir select{width:auto}
select,input,textarea{font:inherit;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px}
.bt{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ink-soft)}.bt.pri{background:var(--accent);border-color:var(--accent);color:#fff}.bt.perigo{color:var(--crit);border-color:var(--crit)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.msg{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:13px;white-space:pre-line}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--crit-bg);color:var(--crit)}.msg.info{background:var(--info-bg);color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--ink-soft)}.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--ink-faint)}
.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card h2 .dir{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.unids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.un{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--ok);border-radius:12px;padding:12px;cursor:pointer}
.un.crit{border-left-color:var(--crit)}.un.warn{border-left-color:var(--warn)}
.un h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.un .lin{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-top:1px dashed var(--border)}
.un .lin b{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:var(--surface-2)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.t-crit{background:var(--crit-bg);color:var(--crit)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-info{background:var(--info-bg);color:var(--info)}.t-mut{background:var(--surface-2);color:var(--ink-soft)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.mut{color:var(--ink-soft);font-size:12.5px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.grade .tudo{grid-column:1/-1}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.filtros select{width:auto}.filtros input{flex:1;min-width:160px}
.barrinha{display:inline-block;width:90px;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:6px}.barrinha i{display:block;height:100%}
.aviso{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.aviso.crit{background:var(--crit-bg);color:var(--crit)}.aviso.info{background:var(--info-bg);color:var(--info)}.aviso.warn{background:var(--warn-bg);color:var(--warn)}.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.mud h3{font-size:14px;margin:12px 0 4px}
dialog{border:0;border-radius:14px;padding:18px;max-width:720px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px}
.chk{display:inline-flex;gap:5px;align-items:center;margin:3px 10px 3px 0;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.chk input{width:auto}
.centro{padding:60px 16px;text-align:center;color:var(--ink-soft)}
@media print{.barra,.acoes,.topo,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="casca">
  <div class="topo"><div class="marca">CL</div><div><b>Contas e Licenças Microsoft 365</b><br><span>Contas, licenças em uso, mudanças e licenças pagas sem uso</span></div></div>
  <div id="aviso" class="centro">Carregando…</div>
  <div id="app" class="oculto">
    <div class="barra">
      <button class="aba on" data-v="painel">Painel</button>
      <button class="aba" data-v="contas">Contas</button>
      <button class="aba" data-v="mudancas">Mudanças</button>
      <button class="aba" data-v="admin" id="abaAdmin">Cargas e fatura</button>
      <div class="dir"><span>Exportação de</span><select id="selCarga"></select></div>
    </div>
    <div id="msg" class="msg oculto"></div>
    <div id="tela"></div>
  </div>
</div>
<dialog id="dlg"><form method="dialog" id="dlgf"></form></dialog>

<script>
const CFG = window.NERVIA_CONFIG || {};
const EMBUTIDO = window.self !== window.top;
if (EMBUTIDO) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const checar = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const TZ = "America/Sao_Paulo";
const dataBR = v => v ? (v.length === 10 ? v.split("-").reverse().join("/") : new Date(v).toLocaleDateString("pt-BR", { timeZone: TZ })) : "—";
const dataHora = v => v ? new Date(v).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const mesBR = m => { const [a, b] = String(m).slice(0, 7).split("-"); return ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][+b - 1] + "/" + a; };
const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const n = v => Number(v || 0).toLocaleString("pt-BR");
const tag = (t, c) => `<span class="tag ${c}">${esc(t)}</span>`;
function msg(tipo, texto) { const m = $("msg"); m.className = "msg " + tipo; m.textContent = texto; m.scrollIntoView({ block: "nearest" }); if (tipo === "ok") setTimeout(() => m.classList.add("oculto"), 6000); }
function limparMsg() { $("msg").className = "msg oculto"; }

let PEDIDOS = [], RESPOSTAS = [];
let ADMIN = false, UNIDADES = [], CARGAS = [], FATURAS = [], DATA = null, CUR = {}, PRV = {}, CONTAS = [], ANT = [], VISTA = "painel", SEL = null, FILTRO = { u: "", st: "", q: "" };

// ---------------------------------------------------------------- carga
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("aviso").innerHTML = 'Entre na <a href="/cliente/" target="_top">Área do Cliente</a> para ver as contas e licenças.'; return; }
  try {
    const p = checar(await sb.from("perfis").select("admin").eq("user_id", session.user.id).maybeSingle());
    ADMIN = !!(p && p.admin);
    $("abaAdmin").classList.toggle("oculto", !ADMIN);
    await carregar();
    if (!UNIDADES.length && !ADMIN) { $("aviso").textContent = "Nenhuma unidade liberada para o seu login. Fale com a Nervia."; return; }
    $("aviso").classList.add("oculto"); $("app").classList.remove("oculto");
    if (!CARGAS.length && ADMIN) VISTA = "admin";
    render();
  } catch (e) { $("aviso").textContent = "Não foi possível carregar: " + e.message; }
}
async function todas(q) {   // o Supabase devolve no máximo 1000 linhas por consulta
  const l = [];
  for (let i = 0; ; i += 1000) { const parte = checar(await q().range(i, i + 999)) || []; l.push(...parte); if (parte.length < 1000) break; }
  return l;
}
async function carregar() {
  UNIDADES = checar(await sb.from("lic_unidades").select("*").order("ordem").order("nome"));
  CARGAS = checar(await sb.from("lic_cargas").select("*").order("exportado_em", { ascending: false }).order("carregado_em", { ascending: false }));
  FATURAS = await todas(() => sb.from("lic_faturas").select("*").order("mes"));
  if (ADMIN) {   // formulário da fatura pelo link (só a equipe Nervia)
    PEDIDOS = checar(await sb.from("lic_pedidos").select("*").order("id", { ascending: false }).limit(50));
    RESPOSTAS = checar(await sb.from("lic_respostas").select("*").order("id", { ascending: false }).limit(200));
  }
  const datas = DATAS();
  if (!datas.includes(DATA)) DATA = datas[0] || null;
  await carregarContas();
  $("selCarga").innerHTML = datas.length ? datas.map(d => `<option value="${d}" ${d === DATA ? "selected" : ""}>${dataBR(d)}</option>`).join("") : "<option>nenhuma</option>";
}
// cada carga vale só para as unidades (domínios) do arquivo: cada unidade usa a carga mais recente que a tem (até a data
// escolhida no topo) e compara com a anterior que também a tem. Outro tenant carregado depois não "zera" as unidades deste.
const DATAS = () => [...new Set(CARGAS.filter(c => UNIDADES.some(u => temU(c, u.id))).map(c => c.exportado_em))];
const temU = (c, uid) => (c.unidades || []).includes(uid);
async function carregarContas() {
  CUR = {}; PRV = {};
  UNIDADES.forEach(u => {
    const i = CARGAS.findIndex(c => c.exportado_em <= DATA && temU(c, u.id)); if (i < 0) return;
    CUR[u.id] = CARGAS[i];
    const a = CARGAS.find(c => c.exportado_em < CARGAS[i].exportado_em && temU(c, u.id)); if (a) PRV[u.id] = a;
  });
  const ids = [...new Set([...Object.values(CUR), ...Object.values(PRV)].map(c => c.id))];
  const cols = "carga_id, unidade_id, login, nome, cargo, departamento, bloqueada, compartilhada, licencas, gratuitas, criada_em";
  const rs = ids.length ? await todas(() => sb.from("lic_contas").select(cols).in("carga_id", ids).order("nome").order("login")) : [];
  CONTAS = rs.filter(a => CUR[a.unidade_id] && CUR[a.unidade_id].id === a.carga_id);
  ANT = rs.filter(a => PRV[a.unidade_id] && PRV[a.unidade_id].id === a.carga_id);
}
$("selCarga").onchange = async () => { DATA = $("selCarga").value; limparMsg(); await carregarContas(); render(); };
document.querySelectorAll(".barra .aba").forEach(b => b.onclick = () => { VISTA = b.dataset.v; SEL = null; limparMsg(); render(); });

// ---------------------------------------------------------------- cálculos
const dataU = uid => CUR[uid] ? CUR[uid].exportado_em : null;   // exportação usada pela unidade
const antU = uid => PRV[uid] ? PRV[uid].exportado_em : null;     // exportação anterior da mesma unidade
const unidade = id => UNIDADES.find(u => u.id === id) || { nome: "?" };
const pagas = a => (a.licencas || []).length > 0;
const alerta = a => a.bloqueada && pagas(a);   // conta bloqueada que continua ocupando licença paga
function uso(contas) { const m = {}; contas.forEach(a => (a.licencas || []).forEach(s => m[s] = (m[s] || 0) + 1)); return m; }
function resumo(uid) {
  const cs = CONTAS.filter(a => a.unidade_id === uid), u = uso(cs);
  return { contas: cs, total: cs.length, ativas: cs.filter(a => !a.bloqueada).length, bloqueadas: cs.filter(a => a.bloqueada).length,
    sem: cs.filter(a => !pagas(a)).length, alertas: cs.filter(alerta), uso: u, emUso: Object.values(u).reduce((s, x) => s + x, 0), comp: comparar(uid, u) };
}
// fatura: por produto vale o mês mais recente até o mês da exportação (ou o mais recente, se a fatura for de depois)
function compradas(uid) {
  const d = dataU(uid) || DATA, lim = d ? d.slice(0, 7) + "-01" : "9999-12-01";
  const fs = FATURAS.filter(f => f.unidade_id === uid), ate = fs.filter(f => f.mes <= lim), base = ate.length ? ate : fs;
  const por = {};
  base.forEach(f => { if (!por[f.produto] || f.mes > por[f.produto].mes) por[f.produto] = f; });
  return por;
}
function comparar(uid, u) {
  const comp = compradas(uid), skus = [...new Set([...Object.keys(comp), ...Object.keys(u)])].sort();
  if (!Object.keys(comp).length) return null;
  const linhas = skus.map(s => { const c = comp[s], q = c ? c.quantidade : 0, emUso = u[s] || 0, vu = c ? Number(c.valor_unitario) : 0;
    return { produto: s, compradas: q, emUso, sobra: q - emUso, pct: q ? Math.round(100 * emUso / q) : null, vu, mes: c ? c.mes : null, semFatura: !c }; });
  const t = { compradas: 0, emUso: 0, valor: 0, ocioso: 0, falta: 0, ociosas: 0 };
  linhas.forEach(l => { t.compradas += l.compradas; t.emUso += l.emUso; t.valor += l.compradas * l.vu;
    if (l.sobra > 0) { t.ocioso += l.sobra * l.vu; t.ociosas += l.sobra; } else if (l.sobra < 0) t.falta += -l.sobra; });
  return { linhas, t };
}
// faturas: a quantidade comprada não deveria cair de um mês para o outro (contrato anual)
function alertasFatura(uid) {
  const fs = FATURAS.filter(f => !uid || f.unidade_id === uid), av = [];
  const grupos = {};
  fs.forEach(f => (grupos[f.unidade_id + "|" + f.produto] ||= []).push(f));
  Object.values(grupos).forEach(g => { g.sort((a, b) => a.mes < b.mes ? -1 : 1);
    for (let i = 1; i < g.length; i++) if (g[i].quantidade < g[i - 1].quantidade)
      av.push(`${unidade(g[i].unidade_id).nome} · ${g[i].produto}: comprada caiu de ${g[i - 1].quantidade} (${mesBR(g[i - 1].mes)}) para ${g[i].quantidade} (${mesBR(g[i].mes)}). O contrato é anual e não deveria diminuir: confira a fatura.`); });
  return av;
}
function mudancas(uid) {
  const novo = CONTAS.filter(a => a.unidade_id === uid), velho = ANT.filter(a => a.unidade_id === uid);
  const mv = new Map(velho.map(a => [a.login, a])), mn = new Map(novo.map(a => [a.login, a]));
  const add = novo.filter(a => !mv.has(a.login)), rem = velho.filter(a => !mn.has(a.login)), st = [], lic = [];
  novo.forEach(a => { const o = mv.get(a.login); if (!o) return;
    if (o.bloqueada !== a.bloqueada) st.push({ a, de: o.bloqueada ? "Bloqueada" : "Ativa", para: a.bloqueada ? "Bloqueada" : "Ativa" });
    const so = new Set(o.licencas || []), sn = new Set(a.licencas || []);
    const mais = [...sn].filter(x => !so.has(x)), menos = [...so].filter(x => !sn.has(x));
    if (mais.length || menos.length) lic.push({ a, mais, menos }); });
  return { add, rem, st, lic, total: add.length + rem.length + st.length + lic.length, antes: velho.length, depois: novo.length };
}

// ---------------------------------------------------------------- telas
function render() {
  document.querySelectorAll(".barra .aba").forEach(b => b.classList.toggle("on", b.dataset.v === VISTA));
  $("selCarga").parentElement.classList.toggle("oculto", VISTA === "admin");
  if (VISTA !== "admin" && !CARGAS.length) { $("tela").innerHTML = `<div class="card"><p class="mut">${ADMIN ? "Nenhuma exportação carregada ainda. Use a aba Cargas e fatura." : "A Nervia ainda não carregou os dados."}</p></div>`; return; }
  $("tela").innerHTML = SEL ? vUnidade(SEL) : ({ painel: vPainel, contas: vContas, mudancas: vMudancas, admin: vAdmin }[VISTA] || vPainel)();
  if (VISTA === "admin" && !SEL) carregarAcessos();
}
function origem(uid) {
  const fim = " Licenças gratuitas e de avaliação (Free, Trial) não entram na conta.</p>";
  if (uid) { const d = dataU(uid), a = antU(uid);
    return d ? `<p class="mut">Exportação do Microsoft 365 de <b>${dataBR(d)}</b>${a ? `, comparada com a de ${dataBR(a)}` : ""}.` + fim : `<p class="mut">Nenhuma exportação desta unidade até ${dataBR(DATA)}.` + fim; }
  const us = UNIDADES.filter(u => CUR[u.id]), ds = [...new Set(us.map(u => dataU(u.id)))], as = [...new Set(us.map(u => antU(u.id)))];
  if (ds.length <= 1 && as.length <= 1) return `<p class="mut">Exportação do Microsoft 365 de <b>${dataBR(ds[0] || DATA)}</b>${as[0] ? `, comparada com a de ${dataBR(as[0])}` : ""}.` + fim;
  return `<p class="mut">Cada unidade mostra a exportação mais recente do seu domínio até <b>${dataBR(DATA)}</b> (arquivos de tenants diferentes podem ter datas diferentes): ${us.map(u => `${esc(u.nome)} ${dataBR(dataU(u.id))}`).join(" · ")}.` + fim;
}
function kpis(rs) {
  const s = k => rs.reduce((t, r) => t + (typeof r[k] === "number" ? r[k] : r[k].length), 0);
  const comp = rs.map(r => r.comp).filter(Boolean), val = comp.reduce((t, c) => t + c.t.valor, 0), oc = comp.reduce((t, c) => t + c.t.ocioso, 0), ociosas = comp.reduce((t, c) => t + c.t.ociosas, 0);
  const al = s("alertas");
  return `<div class="kpis">
    <div class="kpi"><small>Contas</small><b>${n(s("total"))}</b><span>${n(s("ativas"))} ativas · ${n(s("bloqueadas"))} bloqueadas</span></div>
    <div class="kpi"><small>Licenças pagas em uso</small><b>${n(s("emUso"))}</b><span>${n(s("sem"))} contas sem licença paga</span></div>
    <div class="kpi ${al ? "crit" : "ok"}"><small>Bloqueadas com licença</small><b>${n(al)}</b><span>${al ? "licença paga sem uso: revisar" : "nenhuma"}</span></div>
    ${comp.length ? `<div class="kpi"><small>Pago por mês (fatura)</small><b>${brl(val)}</b><span>licenças compradas</span></div>
    <div class="kpi ${oc > 0 ? "warn" : "ok"}"><small>Sem uso por mês</small><b>${brl(oc)}</b><span>${n(ociosas)} licença(s) comprada(s) sem conta</span></div>` : ""}</div>`;
}
function vPainel() {

// ---- leitura do CSV do Microsoft 365 (no navegador)
function lerCsv(txt) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  txt = txt.replace(/^﻿/, "");
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (aspas) { if (c === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; linha.push(campo); campo = ""; if (linha.some(x => x !== "")) linhas.push(linha); linha = []; }
    else campo += c;
  }
  linha.push(campo); if (linha.some(x => x !== "")) linhas.push(linha);
  return linhas;
}
const OBRIG = ["Display name", "User principal name", "Block credential", "Licenses"];
function separarContas(txt) {
  const ls = lerCsv(txt); if (!ls.length) throw new Error("Arquivo vazio.");
  const cab = ls[0].map(h => h.trim()), ix = h => cab.indexOf(h);
  const falta = OBRIG.filter(h => ix(h) < 0);
  if (falta.length) throw new Error(`Este não parece ser o CSV de usuários do Microsoft 365: faltam as colunas ${falta.join(", ")}. Exporte em Usuários → Usuários ativos → Exportar usuários.`);
  const v = (l, h) => ix(h) >= 0 ? (l[ix(h)] || "").trim() : "";
  const us = UNIDADES.filter(u => u.ativo), contas = [], por = {}; let convidados = 0, fora = 0;
  for (const l of ls.slice(1)) {
    const login = v(l, "User principal name");
    if (!login) continue;
    if (login.includes("#EXT#")) { convidados++; continue; }   // convidado B2B: não é uma conta da unidade
    // só a parte depois do @ (o domínio): "recepcao.parksul@iguardei.com.br" é do domínio iguardei, não do Park Sul;
    // primeiro o domínio do login, depois os dos endereços de proxy
    const doms = [login, ...v(l, "Proxy addresses").split("+")].map(e => (e.split("@")[1] || "").toLowerCase().trim()).filter(Boolean);
    let u = null; for (const d of doms) { u = us.find(x => d.includes(x.dominio)); if (u) break; }
    if (!u) { fora++; continue; }
    const lic = v(l, "Licenses"), partes = !lic || lic === "Unlicensed" ? [] : lic.split("+").map(s => s.trim()).filter(Boolean);
    const nome = v(l, "Display name"), criada = v(l, "When created");
    contas.push({ unidade_id: u.id, login: login.toLowerCase(), nome, cargo: v(l, "Title"), departamento: v(l, "Department"),
      bloqueada: v(l, "Block credential").toLowerCase() === "true", compartilhada: /shared/i.test(nome),
      licencas: partes.filter(p => !/free|trial/i.test(p)), gratuitas: partes.filter(p => /free|trial/i.test(p)),
      criada_em: /^\d{4}-\d{2}-\d{2}/.test(criada) ? criada.replace(" ", "T").replace(/Z?$/, "Z") : null });
    por[u.id] = (por[u.id] || 0) + 1;
  }
  return { contas, por, convidados, fora, linhas: ls.length - 1 };
}
function dataDoNome(nome) { const m = /(\d{2})_(\d{2})_(\d{4})/.exec(nome); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; }
function vPrevia() {
  const p = PREVIA; if (!p) return "";
  const noArq = new Set(p.r.contas.map(a => a.unidade_id)), data = $("cDataCsv")?.value || p.data;

    <div class="tw"><table><tr><th>Unidade</th><th class="num">Contas</th><th class="num">Bloqueadas</th><th class="num">Licenças pagas</th></tr>${UNIDADES.filter(u => p.r.contas.some(a => a.unidade_id === u.id)).map(u => { const cs = p.r.contas.filter(a => a.unidade_id === u.id);
      return `<tr><td>${esc(u.nome)}</td><td class="num">${cs.length}</td><td class="num">${cs.filter(a => a.bloqueada).length}</td><td class="num">${cs.reduce((t, a) => t + a.licencas.length, 0)}</td></tr>`; }).join("")}</table></div>

    ${existe ? `<div class="aviso warn">Já existe uma carga de ${dataBR(existe.exportado_em)} para: ${esc(choque.map(u => u.nome).join(", "))}. Marque "substituir" para trocar só estas unidades; as outras unidades (de outros arquivos) ficam como estão.</div>` : ""}
    <div class="acoes"><button class="bt pri" data-acao="gravarCarga" ${p.r.contas.length ? "" : "disabled"}>Gravar carga</button><button class="bt" data-acao="cancelarPrevia">Cancelar</button></div>`;
}

// ---- fatura (mesmas regras do script antigo atualizar_painel.py)
const sem = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
function unidadeDoLocal(local) {
  const s = sem(local); if (!s) return null;
  return UNIDADES.find(u => (u.apelidos || []).some(a => sem(a) === s)) || UNIDADES.find(u => u.dominio.includes(s) || s.includes(u.dominio)) || null;
}
function produtoDaFatura(raw) {   // nome na fatura (com erros comuns de digitação) → nome igual ao do Microsoft 365
  const s = raw.toLowerCase().replace(/bussiness/g, "business").replace(/\s+/g, " ").trim();
  if (s.includes("power bi")) return "Power BI Pro";
  if (s.includes("exchange")) return s.replace(/ /g, "").includes("plan2") ? "Exchange Online (Plan 2)" : "Exchange Online (Plan 1)";
  if (s.includes("apps for business") || s.includes("app for business")) return "Microsoft 365 Apps for business";
  if (s.includes("business basic")) return s.includes("no teams") ? "Microsoft 365 Business Basic (no Teams)" : "Microsoft 365 Business Basic";
  if (s.includes("business standard")) return "Microsoft 365 Business Standard";
  if (s.includes("business premium")) return "Microsoft 365 Business Premium";
  return null;
}
function lerFatura(txt) {
  const itens = [], avisos = [];
  txt.replace(/^﻿/, "").split(/\r?\n/).forEach((linha, i) => {
    const c = linha.split(",").map(x => x.trim()); if (!c.some(Boolean) || c[0].toLowerCase() === "local") return;
    if (c.length < 3) return avisos.push(`Linha ${i + 1}: colunas insuficientes (${linha})`);
    const u = unidadeDoLocal(c[0]); if (!u) return avisos.push(`Linha ${i + 1}: unidade "${c[0]}" não reconhecida`);
    const p = produtoDaFatura(c[2]); if (!p) return avisos.push(`Linha ${i + 1}: licença "${c[2]}" não reconhecida (${u.nome})`);
    const q = parseInt(c[1], 10); if (!(q >= 0) || String(q) !== c[1].replace(/^0+(?=\d)/, "")) return avisos.push(`Linha ${i + 1}: quantidade inválida "${c[1]}"`);
    const vr = c.slice(3).join(",").replace(/R\$/g, "").trim(), vu = vr ? Number(vr.replace(/\./g, "").replace(",", ".")) : 0;
    if (isNaN(vu)) return avisos.push(`Linha ${i + 1}: valor inválido "${vr}"`);
    itens.push({ unidade_id: u.id, produto: p, quantidade: q, valor_unitario: vu });
  });
  return { itens, avisos };
}

    ${existe ? `<label class="chk" style="margin-top:8px"><input type="checkbox" id="fSubst"> substituir a fatura de ${mesBR(p.mes + "-01")} já carregada de ${esc(choque.map(u => u.nome).join(", "))} (as outras unidades do mês ficam como estão)</label>` : ""}

    const p = PREVIA_FAT, r = await sb.rpc("lic_salvar_fatura", { p_mes: p.mes + "-01", p_itens: p.itens, p_substituir: !!($("fSubst") && $("fSubst").checked) });
    if (r.error) return msg("err", r.error.message);
    PREVIA_FAT = null; await carregar(); render(); msg("ok", `Fatura de ${mesBR(p.mes + "-01")} gravada: ${r.data} item(ns).`);
  }
  else if (a === "verFatura") { const fs = FATURAS.filter(f => f.mes === id);
    abrir(`<h3>Fatura de ${mesBR(id)}</h3><div class="tw"><table><tr><th>Unidade</th><th>Licença</th><th class="num">Qtd.</th><th class="num">Valor unit.</th></tr>${fs.map(f => `<tr><td>${esc(unidade(f.unidade_id).nome)}</td><td>${esc(f.produto)}</td><td class="num">${f.quantidade}</td><td class="num">${brl(f.valor_unitario)}</td></tr>`).join("")}</table></div>`, null); }
  else if (a === "excluirFatura") abrir(`<h3>Excluir a fatura de ${mesBR(id)}?</h3><p class="mut">Fica registrado na auditoria.</p>`, () => gravar(sb.rpc("lic_excluir_fatura", { p_mes: id }), "Fatura excluída."), "Excluir");
  else if (a === "criarLink") {
    const un = [...document.querySelectorAll(".pUn:checked")].map(x => x.value);
    const r = await sb.rpc("lic_pedido_criar", { p_mes: $("pMes").value + "-01", p_prazo: $("pPrazo").value, p_unidades: un, p_contato: $("pContato").value, p_telefone: $("pTel").value, p_email: $("pEmail").value });
    if (r.error) return msg("err", r.error.message);
    await carregar(); render(); msg("ok", "Link gerado. Agora mande pelo WhatsApp ou e-mail.");
  }
  else if (["whatsLink", "emailLink", "copiarLink"].includes(a)) {
    const p = PEDIDOS.find(x => String(x.id) === id), txt = textoLink(p);
    if (a === "whatsLink") window.open(`https://wa.me/${telWhats(p.telefone)}?text=${encodeURIComponent(txt)}`, "_blank", "noopener");
    else if (a === "emailLink") window.open(`mailto:${encodeURIComponent(p.email)}?subject=${encodeURIComponent("Licenças Microsoft 365 de " + mesBR(p.mes))}&body=${encodeURIComponent(txt)}`, "_blank");
    else { try { await navigator.clipboard.writeText(linkForm(p)); msg("ok", "Link copiado."); } catch { abrir(`<h3>Link do formulário</h3><input readonly value="${esc(linkForm(p))}" onfocus="this.select()">`, null); } }
  }
  else if (a === "prazoLink") { const p = PEDIDOS.find(x => String(x.id) === id);
    abrir(`<h3>Mudar o prazo</h3><label>Responder até</label><input name="prazo" type="date" required value="${p.prazo}" min="${hojeISO()}"><p class="mut">O link é o mesmo; avise a pessoa do novo prazo.</p>`,
      f => gravar(sb.rpc("lic_pedido_prazo", { p_id: p.id, p_prazo: f.get("prazo") }), "Prazo alterado.")); }
  else if (a === "cancelarLink") abrir(`<h3>Cancelar o link?</h3><p class="mut">O link para de funcionar na hora. Respostas já recebidas continuam aqui.</p>`,
    () => gravar(sb.rpc("lic_pedido_cancelar", { p_id: Number(id) }), "Link cancelado."), "Cancelar link");
  else if (a === "conferir") dConferir(RESPOSTAS.find(x => String(x.id) === id));
  else if (a === "novaUnidade") dUnidade();
  else if (a === "editUnidade") dUnidade(UNIDADES.find(u => u.id === id));
  else if (a === "acessos") { await carregarAcessos(); dAcessos(UNIDADES.find(u => u.id === id)); }
});
sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") location.reload(); });
iniciar();
</script>
</body>
</html>
