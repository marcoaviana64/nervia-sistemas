<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NVPlayer — uso | Nervia</title>
<script src="/config.js"></script>
<script src="/versoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/fichario.css">
<style>
/* Painel de uso do NVPlayer (app "nvplayer", tabelas nv_; pedido do Marco em 19/11/2026). Só a equipe Nervia (RLS).
   O app da TV manda um resumo a cada 30 min (rpc nv_sinal); esta tela só lê. Nada aqui se atualiza sozinho em tempo
   real, para não gastar tráfego: recarrega ao abrir, ao voltar para a aba e no botão Atualizar. */
:root{
  --bg:#f3f6f8;--surface:#fff;--surface-2:#eaf1f4;--border:#dde6ec;--ink:#0f1b2d;--ink-soft:#4f5f73;--ink-faint:#8796a8;
  --accent:#2563eb;--accent-soft:#e6eefc;--primary:#0b2545;
  --ok:#1d7f46;--ok-bg:#e6f4ec;--crit:#b3261e;--crit-bg:#fbeaea;--warn:#a86400;--warn-bg:#fff3e0;--info:#2568a8;--info-bg:#e7f1fa;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620;--surface:#122130;--surface-2:#18293a;--border:#24394e;--ink:#eef4f8;--ink-soft:#b3c3d1;--ink-faint:#7f93a6;
  --accent:#6ea0ff;--accent-soft:rgba(110,160,255,.15);--primary:#cfe3f0;
  --ok:#43c07e;--ok-bg:rgba(67,192,126,.14);--crit:#f07a72;--crit-bg:rgba(240,122,114,.14);--warn:#e3ad57;--warn-bg:rgba(227,173,87,.14);--info:#5eabe8;--info-bg:rgba(94,171,232,.14);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.oculto{display:none!important}
.casca{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.topo{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.topo .marca{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,#2563eb,#0b2545);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.topo span{color:var(--ink-soft);font-size:.8rem}
.embutido .topo{display:none}
.barra .aba .n{font-size:11.5px;opacity:.75;margin-left:4px}
.barra .dir{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft)}
.barra .dir select{width:auto}
select,input{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)}
.bt{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ink-soft)}.bt.peq{padding:3px 9px;font-size:12px}.bt.perigo{color:var(--crit);border-color:var(--crit)}
.msg{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:13px}
.msg.err{background:var(--crit-bg);color:var(--crit)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:var(--ink-soft)}
.kpi.crit b{color:var(--crit)}.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.t-crit{background:var(--crit-bg);color:var(--crit)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-info{background:var(--info-bg);color:var(--info)}.t-mut{background:var(--surface-2);color:var(--ink-soft)}
.mut{color:var(--ink-soft);font-size:12.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.vazio{color:var(--ink-soft);text-align:center;padding:26px}
.barrinha{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.dois{grid-template-columns:1fr}.esc-m{display:none}}
</style>
</head>
<body>
<div class="casca">
  <div class="topo"><div class="marca">NV</div><div><b>NVPlayer — uso</b><br><span>Aparelhos, listas e o que está sendo assistido (resumo a cada 30 min)</span><br><span data-versao="nvplayer"></span></div></div>
  <div id="aviso">Carregando…</div>
  <div id="app" class="oculto">
    <div class="barra fichario">
      <div class="orelhas">
        <button class="aba on" data-v="aparelhos" title="Aparelhos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg><span>Aparelhos</span><span class="n" id="nAp"></span></button>
        <button class="aba" data-v="mais" title="Mais assistidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg><span>Mais assistidos</span></button>
        <button class="aba" data-v="problemas" title="Problemas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg><span>Problemas</span><span class="n" id="nPb"></span></button>
        <button class="aba" data-v="servidores" title="Servidores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.5M7 16.5h.5"/></svg><span>Servidores</span></button>
      </div>
      <div class="ficha"><div class="dir">
        <select id="selPer" title="Período"><option value="1">Hoje</option><option value="7" selected>7 dias</option><option value="30">30 dias</option><option value="90">90 dias</option></select>
        <select id="selAp" title="Aparelho"><option value="">Todos os aparelhos</option></select>
        <button class="bt" id="btAtualizar">Atualizar</button>
      </div></div>
    </div>
    <div id="msg" class="msg oculto"></div>
    <div id="tela"></div>
  </div>
</div>
<script>
const CFG = window.NERVIA_CONFIG || {};
const EMBUTIDO = window.self !== window.top;
if (EMBUTIDO) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const checar = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const TZ = "America/Sao_Paulo";
const tag = (t, c) => `<span class="tag ${c}">${esc(t)}</span>`;
const dataHora = v => v ? new Date(v).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const data = v => v ? new Date(v).toLocaleDateString("pt-BR", { timeZone: TZ }) : "—";
const minTxt = m => { m = Math.max(0, Math.round(m)); return m < 1 ? "agora" : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.floor(m / 60)} h` : `há ${Math.floor(m / 1440)} d`; };
const desde = v => v ? minTxt((Date.now() - new Date(v)) / 6e4) : "";
const horas = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min`; };
const hojeBR = () => new Date().toLocaleDateString("en-CA", { timeZone: TZ });
const diaMenos = n => { const d = new Date(hojeBR() + "T12:00:00"); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
const TIPO = { vivo: "Canal", filme: "Filme", serie: "Série" };
// O app manda a cada 30 min: sem resumo há mais de 40 min = app fechado ou aparelho desligado
const ATIVO_MIN = 40;

let APS = [], USO = [], SERVS = [], VISTA = "aparelhos", VERSAO = null;

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("aviso").innerHTML = 'Entre na <a href="/cliente/" target="_top">Área do Cliente</a>.'; return; }
  try {
    const p = checar(await sb.from("perfis").select("admin").eq("user_id", session.user.id).maybeSingle());
    if (!p || !p.admin) { $("aviso").textContent = "Painel só da equipe Nervia."; return; }
    await carregar();
    $("aviso").classList.add("oculto"); $("app").classList.remove("oculto");
    render();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar().then(render).catch(() => {}); });
  } catch (e) { $("aviso").textContent = "Não foi possível carregar: " + e.message; }
}

async function carregar() {
  APS = checar(await sb.from("nv_aparelhos").select("*").order("ultimo_sinal", { ascending: false }));
  SERVS = checar(await sb.from("nv_servidores").select("*").order("ordem"));
  const de = diaMenos(Number($("selPer").value) - 1);
  USO = [];
  for (let i = 0; ; i += 1000) {
    const r = checar(await sb.from("nv_assistido").select("*").gte("dia", de).order("dia").range(i, i + 999));
    USO.push(...r);
    if (r.length < 1000) break;
  }
  if (VERSAO == null) { try { const j = await (await fetch("/nvplayer.json", { cache: "no-store" })).json(); VERSAO = j.versao || {}; } catch { VERSAO = {}; } }
  const sel = $("selAp"), v = sel.value;
  sel.innerHTML = '<option value="">Todos os aparelhos</option>' + APS.map(a => `<option value="${a.id}">${esc(nomeAp(a))}</option>`).join("");
  sel.value = APS.some(a => a.id === v) ? v : "";
}

const nomeAp = a => a.apelido || [a.modelo, a.lista_usuario && "· " + a.lista_usuario].filter(Boolean).join(" ") || "Aparelho " + a.id.slice(0, 6);
const ativo = a => (Date.now() - new Date(a.ultimo_sinal)) / 6e4 <= ATIVO_MIN;
const usoFiltrado = () => { const ap = $("selAp").value; return ap ? USO.filter(u => u.aparelho_id === ap) : USO; };
function validade(a) {
  if (!a.lista_validade) return a.lista_tipo === "m3u" ? '<span class="mut">link M3U (sem validade)</span>' : "—";
  const d = (new Date(a.lista_validade) - Date.now()) / 864e5;
  const t = data(a.lista_validade);
  return d < 0 ? tag("venceu " + t, "t-crit") : d <= 3 ? tag("vence " + t, "t-crit") : d <= 10 ? tag("vence " + t, "t-warn") : `${t}<div class="mut">em ${Math.floor(d)} dias</div>`;
}

function render() {
  document.querySelectorAll(".aba").forEach(b => b.classList.toggle("on", b.dataset.v === VISTA));
  $("nAp").textContent = APS.length || "";
  const pb = APS.filter(a => (a.problemas || []).length).length; $("nPb").textContent = pb || "";
  $("tela").innerHTML = ({ aparelhos: vAparelhos, mais: vMais, problemas: vProblemas, servidores: vServidores })[VISTA]();
}

// ---------------------------------------------------------------- Aparelhos
function vAparelhos() {
  if (!APS.length) return '<div class="card vazio">Nenhum aparelho mandou resumo ainda. Os aparelhos aparecem aqui quando abrirem o NVPlayer 2.12 ou mais novo.</div>';
  const at = APS.filter(ativo), vendo = at.filter(a => a.assistindo);
  const vencendo = APS.filter(a => a.lista_validade && (new Date(a.lista_validade) - Date.now()) / 864e5 <= 10);
  const velhos = APS.filter(a => VERSAO && VERSAO.codigo && a.versao_codigo && a.versao_codigo < VERSAO.codigo);
  const bloq = APS.filter(a => a.rede_bloqueio).length;
  const total = usoFiltrado().reduce((s, u) => s + u.segundos, 0);
  return `<div class="kpis">
      <div class="kpi"><b>${APS.length}</b><span>aparelhos</span></div>
      <div class="kpi ${at.length ? "ok" : ""}"><b>${at.length}</b><span>com o app aberto (últimos ${ATIVO_MIN} min)</span></div>
      <div class="kpi"><b>${vendo.length}</b><span>assistindo agora</span></div>
      <div class="kpi"><b>${horas(total)}</b><span>assistidas no período</span></div>
      <div class="kpi ${vencendo.length ? "warn" : ""}"><b>${vencendo.length}</b><span>listas vencendo em 10 dias</span></div>
      <div class="kpi ${bloq ? "crit" : ""}"><b>${bloq}</b><span>com possível bloqueio de IPTV (saindo pelo DNS alternativo)</span></div>
      <div class="kpi ${velhos.length ? "warn" : ""}"><b>${velhos.length}</b><span>com o app desatualizado${VERSAO && VERSAO.nome ? " (atual " + esc(VERSAO.nome) + ")" : ""}</span></div>
    </div>
    <div class="card"><h2>Aparelhos</h2><div class="tw"><table>
      <tr><th>Aparelho</th><th>Agora</th><th>Lista</th><th>Validade</th><th class="esc-m">App</th><th class="num">No período</th><th></th></tr>
      ${APS.map(a => {
        const seg = USO.filter(u => u.aparelho_id === a.id).reduce((s, u) => s + u.segundos, 0);
        const agora = !ativo(a) ? `<span class="dot" style="background:var(--ink-faint)"></span>fechado<div class="mut">último resumo ${desde(a.ultimo_sinal)}</div>`
          : a.assistindo ? `<span class="dot" style="background:var(--ok)"></span><b>${esc(a.assistindo)}</b><div class="mut">${esc(TIPO[a.assistindo_tipo] || "")}${a.assistindo_grupo ? " · " + esc(a.assistindo_grupo) : ""}${a.assistindo_desde ? " · desde " + dataHora(a.assistindo_desde).slice(-5) : ""}</div>`
          : `<span class="dot" style="background:var(--warn)"></span>app aberto, sem vídeo`;
        const desat = VERSAO && VERSAO.codigo && a.versao_codigo && a.versao_codigo < VERSAO.codigo;
        return `<tr><td><b>${esc(nomeAp(a))}</b><div class="mut">${esc(a.modelo || "")}${a.android ? " · Android " + esc(a.android) : ""}</div>
            <div class="mut">${a.ip ? "IP " + esc(a.ip) : ""}${a.pais ? " · " + esc(a.pais) : ""} · desde ${data(a.primeiro_sinal)}</div></td>
          <td>${agora}</td>
          <td>${esc(a.lista_usuario || "—")}<div class="mut">${esc(a.lista_servidor || "")}${a.lista_tipo ? " · " + (a.lista_tipo === "xtream" ? "login e senha" : "link M3U") : ""}</div>
            <div class="mut">${a.canais != null ? `${a.canais.toLocaleString("pt-BR")} canais · ${(a.filmes || 0).toLocaleString("pt-BR")} filmes · ${(a.series || 0).toLocaleString("pt-BR")} séries` : ""}</div>
            ${a.lista_telas ? `<div class="mut">telas: ${esc(a.lista_telas_uso || "?")} em uso de ${esc(a.lista_telas)}</div>` : ""}
            ${a.lista_status && !/^active$/i.test(a.lista_status) ? tag(a.lista_status, "t-crit") : ""}
            ${a.rede_dns ? (a.rede_bloqueio
              ? `<div class="mut">${tag("⚠ possível bloqueio de IPTV", "t-crit")} saindo pelo ${esc(a.rede_dns)}${a.rede_servidor_ip ? " · " + esc(a.rede_servidor_ip) : ""}</div>`
              : `<div class="mut">saída: ${esc(a.rede_dns)}${a.rede_servidor_ip ? " · " + esc(a.rede_servidor_ip) : ""}</div>`) : ""}</td>
          <td>${validade(a)}</td>
          <td class="esc-m">${esc(a.versao_app || "—")} ${desat ? tag("desatualizado", "t-warn") : ""}</td>
          <td class="num">${horas(seg)}</td>
          <td style="white-space:nowrap"><button class="bt peq" data-ren="${a.id}">Apelido</button> <button class="bt peq perigo" data-exc="${a.id}">Excluir</button></td></tr>`;
      }).join("")}
    </table></div>
    <p class="mut">O app manda um resumo ao abrir, a cada 30 minutos e ao fechar: "Agora" pode estar até 30 min atrasado. Sem resumo há mais de ${ATIVO_MIN} min = app fechado ou aparelho desligado. Nenhuma senha de lista chega aqui.</p>
    <p class="mut">Em "Lista", a saída mostra por onde o aparelho achou o servidor: <b>saída: DNS do local</b> = tudo certo, sai pelo país certo. <b>⚠ possível bloqueio de IPTV</b> = a internet daquele local bloqueou o endereço do IPTV, então o app usou o DNS alternativo (Google/Cloudflare), que pode cair em outro país e o provedor bloquear por "país não permitido" — a solução é liberar o acesso no painel do provedor ou trocar o DNS do roteador daquele local.</p></div>`;
}

// ---------------------------------------------------------------- Mais assistidos
function ranking(lista, tipo) {
  const m = new Map();
  lista.filter(u => u.tipo === tipo).forEach(u => {
    const r = m.get(u.nome) || { nome: u.nome, grupo: u.grupo, s: 0, vezes: 0, aps: new Set() };
    r.s += u.segundos; r.vezes += u.vezes; r.aps.add(u.aparelho_id); m.set(u.nome, r);
  });
  return [...m.values()].sort((a, b) => b.s - a.s);
}
function tabelaRank(t, lista) {
  if (!lista.length) return `<div class="card"><h2>${t}</h2><div class="vazio">Nada no período.</div></div>`;
  const max = lista[0].s || 1;
  return `<div class="card"><h2>${t}</h2><div class="tw"><table><tr><th>#</th><th>Nome</th><th>Tempo</th><th class="num">Vezes</th><th class="num">Aparelhos</th></tr>
    ${lista.slice(0, 20).map((r, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(r.nome)}</b>${r.grupo ? `<div class="mut">${esc(r.grupo)}</div>` : ""}</td>
      <td style="min-width:150px"><div class="barrinha" style="width:${Math.max(2, r.s / max * 100)}%"></div><span class="mut">${horas(r.s)}</span></td>
      <td class="num">${r.vezes}</td><td class="num">${r.aps.size}</td></tr>`).join("")}</table></div></div>`;
}
function vMais() {
  const u = usoFiltrado();
  const porDia = new Map(); u.forEach(x => porDia.set(x.dia, (porDia.get(x.dia) || 0) + x.segundos));
  const dias = [...porDia.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1), maxD = Math.max(1, ...dias.map(d => d[1]));
  const grupos = new Map(); u.filter(x => x.tipo === "vivo").forEach(x => grupos.set(x.grupo || "—", (grupos.get(x.grupo || "—") || 0) + x.segundos));
  const gr = [...grupos.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10), maxG = Math.max(1, ...gr.map(g => g[1]));
  return tabelaRank("Canais mais assistidos", ranking(u, "vivo")) +
    `<div class="dois">${tabelaRank("Filmes", ranking(u, "filme"))}${tabelaRank("Séries", ranking(u, "serie"))}</div>
    <div class="dois"><div class="card"><h2>Horas por dia</h2>${dias.length ? `<table>${dias.map(([d, s]) => `<tr><td style="width:90px">${d.split("-").reverse().slice(0, 2).join("/")}</td>
        <td><div class="barrinha" style="width:${Math.max(2, s / maxD * 100)}%"></div></td><td class="num">${horas(s)}</td></tr>`).join("")}</table>` : '<div class="vazio">Nada no período.</div>'}</div>
      <div class="card"><h2>Grupos de canais</h2>${gr.length ? `<table>${gr.map(([g, s]) => `<tr><td>${esc(g)}</td>
        <td style="width:45%"><div class="barrinha" style="width:${Math.max(2, s / maxG * 100)}%"></div></td><td class="num">${horas(s)}</td></tr>`).join("")}</table>` : '<div class="vazio">Nada no período.</div>'}</div></div>`;
}

// ---------------------------------------------------------------- Problemas
function vProblemas() {
  const com = APS.filter(a => (a.problemas || []).length);
  if (!com.length) return '<div class="card vazio">Nenhum problema de vídeo registrado nos aparelhos.</div>';
  return com.map(a => `<div class="card"><h2>${esc(nomeAp(a))} <span class="mut">· resumo ${desde(a.ultimo_sinal)}</span></h2>
    <table>${a.problemas.map(p => `<tr><td>${esc(p)}</td></tr>`).join("")}</table></div>`).join("") +
    '<p class="mut">Os últimos problemas que cada aparelho registrou (a mesma lista de Ajustes no app): imagem parada e reconectada sozinha, canal que não abriu… O mesmo canal sempre = problema na lista; vários canais no mesmo horário = internet do local.</p>';
}

// ---------------------------------------------------------------- Servidores
function vServidores() {
  const linhas = SERVS.length ? SERVS.map((x, i) => `<tr><td class="num">${i + 1}</td>
      <td><input data-srv="${i}" value="${esc(x.endereco)}" style="width:100%"></td>
      <td style="white-space:nowrap">
        <button class="bt peq" data-mv="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="bt peq" data-mv="${i}" data-dir="1" ${i === SERVS.length - 1 ? "disabled" : ""}>↓</button>
        <button class="bt peq perigo" data-del="${i}">Remover</button></td></tr>`).join("")
    : '<tr><td colspan="3" class="vazio">Nenhum servidor. Adicione pelo menos um.</td></tr>';
  return `<div class="card"><h2>Endereços do servidor</h2>
    <p class="mut">O app usa o <b>primeiro endereço que fizer login</b>, na ordem abaixo. O 1º vem preenchido ao configurar uma TV nova. Troque aqui quando o provedor mudar o endereço — os aparelhos pegam sozinhos (a TV já ligada troca quando o endereço salvo parar de responder).</p>
    <div class="tw"><table><tr><th>#</th><th>Endereço (com http:// e porta, se houver)</th><th></th></tr>${linhas}</table></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="bt" id="btAddSrv">+ Adicionar endereço</button>
      <button class="bt pri" id="btSalvarSrv" style="background:var(--accent);border-color:var(--accent);color:#fff">Salvar</button>
    </div>
    <p class="mut" style="margin-top:8px">A versão nova do app continua sendo publicada pela Nervia (não é editada aqui).</p></div>`;
}
function lerServsTela() { return [...document.querySelectorAll("[data-srv]")].map(i => i.value.trim()).filter(Boolean); }

// ---------------------------------------------------------------- ações
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.v) { VISTA = b.dataset.v; render(); }
    else if (b.id === "btAtualizar") { await carregar(); render(); }
    else if (b.id === "btAddSrv") { SERVS = lerServsTela().map((e, i) => ({ ordem: i + 1, endereco: e })); SERVS.push({ ordem: SERVS.length + 1, endereco: "http://" }); render(); setTimeout(() => { const c = document.querySelectorAll("[data-srv]"); c[c.length - 1]?.focus(); }, 0); }
    else if (b.dataset.mv != null) { const i = +b.dataset.mv, j = i + +b.dataset.dir; const l = lerServsTela(); [l[i], l[j]] = [l[j], l[i]]; SERVS = l.map((e, k) => ({ ordem: k + 1, endereco: e })); render(); }
    else if (b.dataset.del != null) { const l = lerServsTela(); l.splice(+b.dataset.del, 1); SERVS = l.map((e, k) => ({ ordem: k + 1, endereco: e })); render(); }
    else if (b.id === "btSalvarSrv") {
      const lista = lerServsTela();
      if (!lista.length) { const m = $("msg"); m.className = "msg err"; m.textContent = "Informe ao menos um endereço de servidor."; return; }
      checar(await sb.rpc("nv_servidores_salvar", { p_lista: lista }));
      await carregar(); render();
      const m = $("msg"); m.className = "msg ok"; m.textContent = "Servidores salvos. Os aparelhos vão pegar a lista nova."; m.classList.remove("oculto"); setTimeout(() => m.classList.add("oculto"), 6000);
    }
    else if (b.dataset.ren) {
      const a = APS.find(x => x.id === b.dataset.ren);
      const n = prompt("Apelido do aparelho (ex.: TV da sala do Marco):", a.apelido || "");
      if (n == null) return;
      checar(await sb.rpc("nv_aparelho_apelido", { p_id: a.id, p_apelido: n }));
      await carregar(); render();
    } else if (b.dataset.exc) {
      const a = APS.find(x => x.id === b.dataset.exc);
      if (!confirm(`Excluir "${nomeAp(a)}" e todo o histórico dele? Se o app continuar aberto nesse aparelho, ele volta a aparecer no próximo resumo.`)) return;
      checar(await sb.rpc("nv_aparelho_excluir", { p_id: a.id }));
      await carregar(); render();
    }
  } catch (err) { const m = $("msg"); m.className = "msg err"; m.textContent = err.message; }
});
$("selPer").addEventListener("change", () => carregar().then(render).catch(err => { const m = $("msg"); m.className = "msg err"; m.textContent = err.message; }));
$("selAp").addEventListener("change", render);
iniciar();
</script>
</body>
</html>
