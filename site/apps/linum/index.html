<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sistema Linum | Nervia</title>
<script src="/config.js"></script>
<script src="/versoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
/* Sistema Linum (app "linum", tabelas lin_): o sistema da LINUM Roupas de Linho trazido do Lovable para a Plataforma.
   Produtos, estoque das lojas, vendas (boleta) e clientes. Dono: tudo; Estoque: cadastra e movimenta sem custo;
   Vendedora: consulta o estoque e registra as vendas da loja dela. */
:root{
  --bg:#f3f6f8;--surface:#fff;--surface-2:#eaf1f4;--border:#dde6ec;--ink:#0f1b2d;--ink-soft:#4f5f73;--ink-faint:#8796a8;
  --accent:#107e99;--accent-soft:#e3f3f7;--primary:#0b2545;
  --ok:#1d7f46;--ok-bg:#e6f4ec;--ok-bd:#bfe3cc;--crit:#b3261e;--crit-bg:#fbeaea;--crit-bd:#f1c9c6;--info:#2568a8;--info-bg:#e7f1fa;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620;--surface:#122130;--surface-2:#18293a;--border:#24394e;--ink:#eef4f8;--ink-soft:#b3c3d1;--ink-faint:#7f93a6;
  --accent:#3fc1dd;--accent-soft:rgba(63,193,221,.15);--primary:#cfe3f0;
  --ok:#43c07e;--ok-bg:rgba(67,192,126,.14);--ok-bd:rgba(67,192,126,.35);--crit:#f07a72;--crit-bg:rgba(240,122,114,.14);--crit-bd:rgba(240,122,114,.35);
  --info:#5eabe8;--info-bg:rgba(94,171,232,.14);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.oculto{display:none!important}
.casca{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.topo{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.topo .marca{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,#107e99,#0b2545);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.topo span{color:var(--ink-soft);font-size:.8rem}
.embutido .topo{display:none}
.barra{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 8px;margin-bottom:12px}
.barra .aba{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink-soft)}
.barra .aba.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.barra .dir{margin-left:auto;font-size:12px;color:var(--ink-soft);padding-right:4px}
select,input{font:inherit;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px}
.bt{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ink-soft)}.bt.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.bt:disabled{opacity:.5;cursor:not-allowed}
.msg{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:13px;white-space:pre-line}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--crit-bg);color:var(--crit)}.msg.info{background:var(--info-bg);color:var(--info)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.filtros input{flex:1 1 240px}.filtros select{width:auto;flex:0 1 auto;max-width:100%}
.pilula{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer}
.pilula.on{background:var(--primary);border-color:var(--primary);color:var(--bg);font-weight:600}
.resumo{font-size:12.5px;color:var(--ink-soft);margin:4px 2px 12px}
.prod{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.prod .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prod h2{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .preco{color:var(--accent);font-weight:700;white-space:nowrap}
.prod .info{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft);margin-top:2px}
.selo{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--primary);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
.chip{min-width:86px;border-radius:9px;border:1px solid var(--ok-bd);background:var(--ok-bg);color:var(--ok);padding:7px 10px;text-align:center;font:inherit;line-height:1.25}
.chip.zero{border-color:var(--crit-bd);background:var(--crit-bg);color:var(--crit)}
button.chip{cursor:pointer}button.chip:hover{filter:brightness(.96)}
.chip b{display:block;font-size:12.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{display:block;font-size:11.5px;opacity:.85}
.chip strong{display:block;font-size:12.5px;margin-top:1px}
.vazio{padding:50px 16px;text-align:center;color:var(--ink-soft)}
.centro{padding:60px 16px;text-align:center;color:var(--ink-soft)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 6px}
.mut{color:var(--ink-soft);font-size:12.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td select{min-width:130px}
dialog{border:0;border-radius:14px;padding:18px;max-width:520px;width:calc(100% - 24px);max-height:92vh;overflow-y:auto;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 4px;font-size:17px}
.campo{margin-top:12px}
.opcoes{display:flex;flex-wrap:wrap;gap:6px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:flex-end}
.hist{margin-top:16px;border-top:1px solid var(--border);padding-top:10px}
.hist h4{margin:0 0 6px;font-size:13px}
.hist li{font-size:12.5px;color:var(--ink-soft);margin:3px 0}
.hist ul{margin:0;padding-left:18px}
.cabtela{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.cabtela h2{margin:0;font-size:18px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);margin-left:6px;vertical-align:middle}
.vtag{display:inline-block;font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:7px;margin:2px 4px 2px 0}
.vtag.off{opacity:.5;text-decoration:line-through}
.prod .rodape{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.lnk.perigo{color:var(--crit)}
.chk{display:inline-flex;gap:6px;align-items:center}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.caixa{border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:12px}
.caixa h4{margin:0 0 4px;font-size:13px}
.vlin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--border);font-size:13px}
.vlin:first-of-type{border-top:0}
.vlin .acs{display:flex;gap:12px}
.vlin input{width:110px}
.grade3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
dialog.largo{max-width:860px}
tr.cancelada td{color:var(--ink-faint);text-decoration:line-through}tr.cancelada td:last-child{text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--ink-soft)}.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--ink-faint)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:640px){.grade3{grid-template-columns:1fr}}
@media (max-width:520px){.grade2{grid-template-columns:1fr}}
@media (max-width:520px){.duas{grid-template-columns:1fr}.prod h2{white-space:normal}}
@media print{.barra,.filtros,.topo,.noprint{display:none!important}body{background:#fff}.prod{break-inside:avoid}}
</style>
</head>
<body>
<div class="casca">
  <div class="topo"><div class="marca">LI</div><div><b>Sistema Linum</b><br><span>Produtos, estoque, vendas e clientes das lojas</span><br><span data-versao="linum"></span></div></div>
  <div id="aviso" class="centro">Carregando…</div>
  <div id="app" class="oculto">
    <div class="barra">
      <button class="aba oculto" data-v="produtos" id="abaProdutos">Produtos</button>
      <button class="aba on" data-v="estoque">Estoque</button>
      <button class="aba oculto" data-v="vendas" id="abaVendas">Vendas</button>
      <button class="aba oculto" data-v="clientes" id="abaClientes">Clientes</button>
      <button class="aba oculto" data-v="equipe" id="abaEquipe">Equipe</button>
      <div class="dir" id="quem"></div>
    </div>
    <div id="msg" class="msg oculto"></div>
    <div id="tela"></div>
  </div>
</div>
<dialog id="dlg"><form method="dialog" id="dlgf"></form></dialog>
<dialog id="dlg2"><form method="dialog" id="dlg2f"></form></dialog>
<script>
const CFG = window.NERVIA_CONFIG || {};
const EMBUTIDO = window.self !== window.top;
if (EMBUTIDO) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const checar = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const TZ = "America/Sao_Paulo";
const hoje = () => new Date().toLocaleDateString("en-CA", { timeZone: TZ });
const dataBR = v => v ? String(v).slice(0, 10).split("-").reverse().join("/") : "—";
const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const n = v => Number(v || 0).toLocaleString("pt-BR");
function msg(tipo, texto) { const m = $("msg"); m.className = "msg " + tipo; m.textContent = texto; m.scrollIntoView({ block: "nearest" }); if (tipo === "ok") setTimeout(() => m.classList.add("oculto"), 5000); }
function limparMsg() { $("msg").className = "msg oculto"; }

let MINHA_LOJA = null, ADMIN = false, PAPEL = null, LOJAS = [], PRODUTOS = [], QTD = new Map(), VISTA = "estoque", EQUIPE = [];
const F = { q: "", loja: "", cat: "", cor: "", tam: "", zerados: true };
const dono = () => PAPEL === "dono";
const controla = () => PAPEL === "dono" || PAPEL === "estoque";   // Estoque: cadastra e movimenta, mas nunca vê custo
let MINHA_COMISSAO = 0;
const vende = () => !!PAPEL;   // Vendas e Clientes: qualquer pessoa da equipe da Linum vende, em qualquer loja
const chave = (v, l) => v + ":" + l;
const qtd = (v, l) => QTD.get(chave(v, l)) || 0;
const loja = id => LOJAS.find(l => l.id === id) || { nome: "?" };

// tamanhos na ordem das araras; o resto em ordem alfabética/numérica (como no sistema antigo)
const ORDEM_TAM = ["PP", "P", "M", "G", "GG", "XG", "XGG", "U", "UNICO", "ÚNICO"];
function ordemTam(a, b) {
  const ia = ORDEM_TAM.indexOf(String(a).trim().toUpperCase()), ib = ORDEM_TAM.indexOf(String(b).trim().toUpperCase());
  if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  return String(a).localeCompare(String(b), "pt-BR", { numeric: true });
}
const ordemVar = (a, b) => ordemTam(a.tamanho || "", b.tamanho || "") || (a.cor || "").localeCompare(b.cor || "", "pt-BR") || (a.edicao || "").localeCompare(b.edicao || "", "pt-BR");
const nomeVar = v => [v.cor || "—", v.tamanho, v.edicao].filter(Boolean).join(" ");

// ---------------------------------------------------------------- carga
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("aviso").innerHTML = 'Entre na <a href="/cliente/" target="_top">Área do Cliente</a> para ver o estoque.'; return; }
  try {
    const p = checar(await sb.from("perfis").select("admin").eq("user_id", session.user.id).maybeSingle());
    ADMIN = !!(p && p.admin);
    await carregar();
    $("abaEquipe").classList.toggle("oculto", !ADMIN);
    $("abaProdutos").classList.toggle("oculto", !controla());
    $("abaVendas").classList.toggle("oculto", !vende()); $("abaClientes").classList.toggle("oculto", !vende());
    $("quem").textContent = ADMIN ? "Equipe Nervia (Dono)" : dono() ? "Dono" : controla() ? "Estoque · sem custos" : "Vendedora" + (MINHA_LOJA ? " · " + loja(MINHA_LOJA).nome : "");
    $("aviso").classList.add("oculto"); $("app").classList.remove("oculto");
    render();
  } catch (e) { $("aviso").textContent = e.message.includes("não tem acesso") ? e.message : "Não foi possível carregar: " + e.message; }
}
async function carregar() {
  const d = checar(await sb.rpc("lin_estoque_ler"));
  PAPEL = d.papel; LOJAS = d.lojas || []; PRODUTOS = d.produtos || []; MINHA_LOJA = d.minha_loja || null; MINHA_COMISSAO = Number(d.comissao_pct || 0);
  QTD = new Map((d.estoque || []).map(([v, l, q]) => [chave(v, l), q]));
}
document.querySelectorAll(".barra .aba").forEach(b => b.onclick = () => { VISTA = b.dataset.v; limparMsg(); render(); });
function render() {
  document.querySelectorAll(".barra .aba").forEach(b => b.classList.toggle("on", b.dataset.v === VISTA));
  if (VISTA === "equipe" && ADMIN) return telaEquipe();
  if (VISTA === "produtos" && controla()) return telaProdutos();
  if (VISTA === "vendas" && vende()) return telaVendas();
  if (VISTA === "clientes" && vende()) return telaClientes();
  telaEstoque();
}

// ---------------------------------------------------------------- estoque
function telaEstoque() {
  const unicos = l => [...new Set(l.filter(Boolean))];
  const cats = unicos(PRODUTOS.map(p => p.categoria)).sort((a, b) => a.localeCompare(b, "pt-BR"));
  const vs = PRODUTOS.flatMap(p => p.variantes);
  const cores = unicos(vs.map(v => v.cor)).sort((a, b) => a.localeCompare(b, "pt-BR"));
  const tams = unicos(vs.map(v => v.tamanho)).sort(ordemTam);
  const opc = (l, sel, rot) => `<option value="">${rot}</option>` + l.map(x => `<option value="${esc(x)}" ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
  $("tela").innerHTML = `
    <div class="filtros">
      <input id="fq" type="search" placeholder="Buscar por nome ou referência" value="${esc(F.q)}">
      <select id="floja" aria-label="Loja"><option value="">Todas as lojas</option>${LOJAS.map(l => `<option value="${l.id}" ${l.id === F.loja ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}</select>
      <select id="fcat" aria-label="Categoria">${opc(cats, F.cat, "Categoria")}</select>
      <select id="fcor" aria-label="Cor">${opc(cores, F.cor, "Cor")}</select>
      <select id="ftam" aria-label="Tamanho">${opc(tams, F.tam, "Tamanho")}</select>
      <button class="pilula ${F.zerados ? "on" : ""}" id="fzero" type="button" title="Esconde as variações sem peça na loja">${F.zerados ? "Ocultar zerados: ativo" : "Ocultar zerados: inativo"}</button>
    </div>
    <div class="resumo" id="resumo"></div>
    <div id="lista"></div>`;
  $("fq").oninput = e => { F.q = e.target.value; lista(); };
  [["floja", "loja"], ["fcat", "cat"], ["fcor", "cor"], ["ftam", "tam"]].forEach(([id, k]) => $(id).onchange = e => { F[k] = e.target.value; lista(); });
  $("fzero").onclick = () => { F.zerados = !F.zerados; telaEstoque(); };
  lista();
}
function lista() {
  const termo = F.q.trim().toLowerCase();
  const lojas = F.loja ? LOJAS.filter(l => l.id === F.loja) : LOJAS;
  const cartoes = []; let pecas = 0;
  const prods = new Set();
  for (const p of PRODUTOS) {
    if (termo && !p.descricao.toLowerCase().includes(termo) && !p.referencia.toLowerCase().includes(termo)) continue;
    if (F.cat && p.categoria !== F.cat) continue;
    const vars = p.variantes.filter(v => (!F.cor || v.cor === F.cor) && (!F.tam || v.tamanho === F.tam)).sort(ordemVar);
    if (!vars.length) continue;
    for (const l of lojas) {
      const vis = F.zerados ? vars.filter(v => qtd(v.id, l.id) > 0) : vars;
      if (!vis.length) continue;
      vis.forEach(v => pecas += qtd(v.id, l.id));
      prods.add(p.id);
      cartoes.push(cartao(p, l, vis));
    }
  }
  $("resumo").textContent = cartoes.length ? `${n(prods.size)} produto(s) · ${n(pecas)} peça(s)${F.loja ? " em " + loja(F.loja).nome : ""}` : "";
  $("lista").innerHTML = cartoes.length ? cartoes.join("") : `<div class="vazio">${PRODUTOS.length
    ? "Nenhum produto com esses filtros." + (F.zerados ? " Desligue “Ocultar zerados” para ver as variações sem peça." : "")
    : (controla() ? "Nenhum produto cadastrado ainda. Cadastre as peças na aba Produtos." : "Nenhum produto cadastrado ainda.")}</div>`;
  document.querySelectorAll("#lista button.chip").forEach(b => b.onclick = () => movimentar(b.dataset.p, b.dataset.v, b.dataset.l));
}
function cartao(p, l, vars) {
  let ant = null;
  const chips = vars.map(v => {
    const q = qtd(v.id, l.id), sep = ant !== null && ant !== (v.tamanho || "").trim() ? '<span class="sep"></span>' : "";
    ant = (v.tamanho || "").trim();
    // peça especial (edição: pintura, bordado...) pode ter preço próprio; mostra só quando difere do preço da peça
    const preco = v.preco_venda != null && Number(v.preco_venda) !== Number(p.preco_venda) ? `<small>${brl(v.preco_venda)}</small>` : "";
    const corpo = `<b title="${esc(v.cor)}">${esc(v.cor || "—")}</b><small>${esc([v.tamanho, v.edicao].filter(Boolean).join(" · "))}</small>${preco}<strong>${n(q)} un.</strong>`;
    return sep + (controla()
      ? `<button type="button" class="chip ${q > 0 ? "" : "zero"}" data-p="${p.id}" data-v="${v.id}" data-l="${l.id}" title="Movimentar">${corpo}</button>`
      : `<div class="chip ${q > 0 ? "" : "zero"}">${corpo}</div>`);
  }).join("");
  return `<div class="prod">
    <div class="cab"><h2 title="${esc(p.descricao)}">${esc(p.descricao)}</h2><span class="preco">${p.preco_venda != null ? brl(p.preco_venda) : "Preço não cadastrado"}</span></div>
    <div class="info"><span>Ref: ${esc(p.referencia || "—")}</span><span>·</span><span>Peça: ${esc(p.categoria || "—")}</span><span class="selo">${esc(l.nome)}</span></div>
    <div class="chips">${chips}</div></div>`;
}

// ---------------------------------------------------------------- movimentar (Dono)
const TIPOS = { entrada: "Entrada", saida: "Saída", transferencia: "Transferência", ajuste: "Ajuste" };
async function movimentar(pid, vid, lid) {
  const p = PRODUTOS.find(x => x.id === pid), v = p.variantes.find(x => x.id === vid);
  const M = { tipo: "entrada", origem: lid, destino: (LOJAS.find(l => l.id !== lid) || {}).id || "", quantidade: "1", data: hoje(), obs: "" };
  let hist = null;
  const f = $("dlgf");
  const desenhar = erro => {
    const ehT = M.tipo === "transferencia", ehA = M.tipo === "ajuste";
    const bot = (grupo, val, rot, on) => `<button type="button" class="pilula ${on ? "on" : ""}" data-g="${grupo}" data-x="${esc(val)}">${esc(rot)}</button>`;
    f.innerHTML = `<h3>${esc(p.descricao)} — ${esc(nomeVar(v))}</h3><div class="mut">Ref: ${esc(p.referencia)}</div>
      <div class="campo"><div class="opcoes">${Object.entries(TIPOS).map(([k, r]) => bot("tipo", k, r, M.tipo === k)).join("")}</div></div>
      <div class="campo"><label>${ehT ? "Loja de origem" : "Loja"}</label><div class="opcoes">${LOJAS.map(l => bot("origem", l.id, `${l.nome} (${qtd(vid, l.id)})`, M.origem === l.id)).join("")}</div></div>
      ${ehT ? `<div class="campo"><label>Loja de destino</label><div class="opcoes">${LOJAS.filter(l => l.id !== M.origem).map(l => bot("destino", l.id, l.nome, M.destino === l.id)).join("")}</div></div>` : ""}
      <div class="campo duas">
        <div><label for="mq">${ehA ? "Nova quantidade" : "Quantidade"}</label><input id="mq" type="number" inputmode="numeric" min="${ehA ? 0 : 1}" step="1" value="${esc(M.quantidade)}"></div>
        <div><label for="md">Data</label><input id="md" type="date" value="${esc(M.data)}"></div>
      </div>
      <div class="campo"><label for="mo">Observação</label><input id="mo" maxlength="300" value="${esc(M.obs)}" placeholder="${ehA ? "Ex.: contagem do estoque" : "Ex.: chegada de peças, beneficiamento, perda"}"></div>
      ${erro ? `<div class="msg err">${esc(erro)}</div>` : ""}
      <div class="acoes"><button type="button" class="bt" id="mx">Cancelar</button><button type="button" class="bt pri" id="ms">Salvar movimentação</button></div>
      <div class="hist"><h4>Últimas movimentações desta variação</h4>${hist === null ? '<div class="mut">Carregando…</div>' : hist}</div>`;
    f.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      guardar(); M[b.dataset.g] = b.dataset.x;
      if (M.tipo === "transferencia" && (M.destino === M.origem || !M.destino)) M.destino = (LOJAS.find(l => l.id !== M.origem) || {}).id || "";
      if (b.dataset.g === "tipo" || b.dataset.g === "origem") M.quantidade = M.tipo === "ajuste" ? String(qtd(vid, M.origem)) : (M.quantidade === "0" ? "1" : M.quantidade);
      desenhar();
    });
    $("mx").onclick = () => $("dlg").close();
    $("ms").onclick = salvar;
  };
  const guardar = () => { M.quantidade = $("mq").value; M.data = $("md").value; M.obs = $("mo").value; };
  const salvar = async () => {
    guardar();
    const q = Number(M.quantidade);
    if (!Number.isInteger(q) || q < (M.tipo === "ajuste" ? 0 : 1)) return desenhar(M.tipo === "ajuste" ? "Informe a nova quantidade (0 ou mais)." : "Informe uma quantidade inteira maior que zero.");
    if (!M.data) return desenhar("Informe a data.");
    $("ms").disabled = true; $("ms").textContent = "Salvando…";
    try {
      const base = { p_variante: vid, p_quantidade: q, p_data: M.data, p_observacao: M.obs.trim() };
      if (M.tipo === "transferencia") checar(await sb.rpc("lin_transferir", { ...base, p_origem: M.origem, p_destino: M.destino }));
      else if (M.tipo === "ajuste") checar(await sb.rpc("lin_ajustar", { ...base, p_loja: M.origem }));
      else checar(await sb.rpc("lin_movimentar", { ...base, p_loja: M.origem, p_tipo: M.tipo }));
      $("dlg").close();
      await carregar(); lista();
      msg("ok", `Estoque atualizado: ${TIPOS[M.tipo].toLowerCase()} de ${p.descricao} ${nomeVar(v)}.`);
    } catch (e) { desenhar(e.message); }
  };
  desenhar();
  $("dlg").showModal();
  try {
    const ms = checar(await sb.from("lin_movimentos").select("tipo, quantidade, antes, depois, loja_id, loja_destino_id, data, observacao, criado_nome")
      .eq("variante_id", vid).order("criado_em", { ascending: false }).limit(8));
    hist = ms.length ? "<ul>" + ms.map(m => `<li><b>${dataBR(m.data)}</b> · ${esc(m.tipo === "venda" ? "Venda" : TIPOS[m.tipo] || m.tipo)} ${m.tipo === "ajuste" ? `${m.antes} → ${m.depois}` : n(m.quantidade)} · ${esc(loja(m.loja_id).nome)}${m.loja_destino_id ? " → " + esc(loja(m.loja_destino_id).nome) : ""}${m.observacao ? " · " + esc(m.observacao) : ""}${m.criado_nome ? " · " + esc(m.criado_nome) : ""}</li>`).join("") + "</ul>"
      : '<div class="mut">Nenhuma movimentação ainda.</div>';
  } catch (e) { hist = `<div class="mut">Não foi possível ler o histórico: ${esc(e.message)}</div>`; }
  if ($("dlg").open && $("mq")) { guardar(); desenhar(); }
}

// ---------------------------------------------------------------- produtos (Dono)
let PRODS = [], VARS = [];
const FP = { q: "", cat: "", cor: "", tam: "", forn: "" };
async function todas(q) {   // o Supabase devolve no máximo 1000 linhas por consulta
  const l = [];
  for (let i = 0; ; i += 1000) { const parte = checar(await q().range(i, i + 999)) || []; l.push(...parte); if (parte.length < 1000) break; }
  return l;
}
async function carregarProdutos() {
  if (!dono()) {   // Estoque: o mesmo cadastro, sem as colunas de custo (as tabelas com custo só o Dono lê)
    const c = checar(await sb.rpc("lin_catalogo"));
    PRODS = c.produtos || []; VARS = c.variantes || [];
    return;
  }
  PRODS = await todas(() => sb.from("lin_produtos").select("*").order("descricao").order("referencia"));
  VARS = await todas(() => sb.from("lin_variantes").select("*").order("criado_em"));
}
const varsDe = pid => VARS.filter(v => v.produto_id === pid).sort(ordemVar);
// número digitado do jeito brasileiro: "1.234,50" ou "189,9" ou "189.90"
const numBR = t => { t = String(t || "").trim(); if (!t) return ""; if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); return t; };
const moeda = v => v == null || v === "" ? "" : Number(v).toFixed(2).replace(".", ",");
const decBR = v => v == null || v === "" ? "" : String(v).replace(".", ",");
const listaV = t => [...new Set(String(t || "").split(",").map(x => x.trim()).filter(Boolean))];
async function telaProdutos() {
  $("tela").innerHTML = '<div class="card">Carregando…</div>';
  try { await carregarProdutos(); } catch (e) { $("tela").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  const unicos = l => [...new Set(l.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));
  const opc = (l, sel, rot) => `<option value="">${rot}</option>` + l.map(x => `<option value="${esc(x)}" ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
  $("tela").innerHTML = `
    <div class="cabtela"><h2>Produtos <span class="mut" id="ptotal"></span></h2><button class="bt pri" id="pnovo">+ Novo produto</button></div>
    <div class="filtros">
      <input id="pq" type="search" placeholder="Buscar por nome, referência ou código de barras" value="${esc(FP.q)}">
      <select id="pcat" aria-label="Categoria">${opc(unicos(PRODS.map(p => p.categoria)), FP.cat, "Categoria")}</select>
      <select id="pcor" aria-label="Cor">${opc(unicos(VARS.map(v => v.cor)), FP.cor, "Cor")}</select>
      <select id="ptam" aria-label="Tamanho">${[`<option value="">Tamanho</option>`, ...[...new Set(VARS.map(v => v.tamanho))].sort(ordemTam).map(x => `<option value="${esc(x)}" ${x === FP.tam ? "selected" : ""}>${esc(x)}</option>`)].join("")}</select>
      <select id="pforn" aria-label="Fornecedor">${opc(unicos(PRODS.map(p => p.fornecedor)), FP.forn, "Fornecedor")}</select>
    </div>
    <div id="plista"></div>`;
  $("pnovo").onclick = () => editarProduto(null);
  $("pq").oninput = e => { FP.q = e.target.value; listaProdutos(); };
  [["pcat", "cat"], ["pcor", "cor"], ["ptam", "tam"], ["pforn", "forn"]].forEach(([id, k]) => $(id).onchange = e => { FP[k] = e.target.value; listaProdutos(); });
  listaProdutos();
}
function listaProdutos() {
  const termo = FP.q.trim().toLowerCase();
  const l = PRODS.filter(p => {
    const vs = varsDe(p.id);
    if (termo && ![p.descricao, p.referencia, p.codigo_barras, ...vs.map(v => v.codigo_barras)].some(x => String(x || "").toLowerCase().includes(termo))) return false;
    if (FP.cat && p.categoria !== FP.cat) return false;
    if (FP.forn && p.fornecedor !== FP.forn) return false;
    if (FP.cor && !vs.some(v => v.cor === FP.cor)) return false;
    if (FP.tam && !vs.some(v => v.tamanho === FP.tam)) return false;
    return true;
  });
  $("ptotal").textContent = `· ${n(PRODS.length)} ${PRODS.length === 1 ? "peça cadastrada" : "peças cadastradas"}`;
  $("plista").innerHTML = l.length ? l.slice(0, 300).map(p => {
    const vs = varsDe(p.id);
    return `<div class="prod">
      <div class="cab"><h2 title="${esc(p.descricao)}">${esc(p.descricao)}${p.ativo ? "" : '<span class="tag">inativo</span>'}</h2>
        <span class="preco">${brl(p.preco_venda)}</span></div>
      <div class="info"><span>${esc([p.referencia, p.categoria, p.fornecedor].filter(Boolean).join(" · "))}</span>
        ${p.codigo_barras ? `<span>· cód. ${esc(p.codigo_barras)}</span>` : ""}${p.preco_custo != null ? `<span>· custo ${brl(p.preco_custo)}</span>` : ""}</div>
      <div style="margin-top:8px">${vs.length ? vs.map(v => `<span class="vtag ${v.ativo ? "" : "off"}" title="${v.ativo ? "" : "inativa"}">${esc(nomeVar(v))}${v.preco_venda != null ? " · " + brl(v.preco_venda) : ""}</span>`).join("") : '<span class="mut">Sem cores e tamanhos ainda.</span>'}</div>
      <div class="rodape"><button class="lnk" data-ed="${p.id}">Editar peça</button><button class="lnk perigo" data-ex="${p.id}">Excluir peça</button></div></div>`;
  }).join("") + (l.length > 300 ? `<div class="mut">Mostrando 300 de ${n(l.length)}. Use a busca para achar os outros.</div>` : "")
    : `<div class="vazio">${PRODS.length ? "Nenhum produto com esses filtros." : "Catálogo vazio. Cadastre a primeira peça em “+ Novo produto”."}</div>`;
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => editarProduto(b.dataset.ed));
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = async () => {
    const p = PRODS.find(x => x.id === b.dataset.ex);
    if (!confirm(`Excluir "${p.descricao}" definitivamente? Só é possível se a peça não tiver nenhuma movimentação nem estoque.`)) return;
    try { checar(await sb.rpc("lin_produto_excluir", { p_produto: p.id })); msg("ok", "Peça excluída."); await atualizarTudo(); }
    catch (e) { msg("err", e.message); }
  });
}
async function atualizarTudo() { await carregar(); if (VISTA === "produtos") await telaProdutos(); }

function editarProduto(pid) {
  const f = $("dlgf");
  let p = pid ? PRODS.find(x => x.id === pid) : null;
  let F2 = p ? { referencia: p.referencia, descricao: p.descricao, categoria: p.categoria || "", colecao: p.colecao || "", fornecedor: p.fornecedor || "",
                 tecido: p.tecido || "", preco_custo: moeda(p.preco_custo), preco_venda: p.preco_venda ? moeda(p.preco_venda) : "", consumo_metros: decBR(p.consumo_metros), ativo: p.ativo }
             : { referencia: "", descricao: "", categoria: "", colecao: "", fornecedor: "", tecido: "", preco_custo: "", preco_venda: "", consumo_metros: "", ativo: true };
  let novas = { cores: "", tamanhos: "" }, esp = { cor: "", tamanho: "", edicao: "", preco_venda: "", preco_custo: "" }, editando = null;

    f.querySelectorAll("[data-k]").forEach(i => F2[i.dataset.k] = i.type === "checkbox" ? i.checked : i.value);
    f.querySelectorAll("[data-n]").forEach(i => novas[i.dataset.n] = i.value);
    f.querySelectorAll("[data-e]").forEach(i => esp[i.dataset.e] = i.value);
  };
  const desenhar = (erro, ok) => {
    const vs = p ? varsDe(p.id) : [];
    f.innerHTML = `<h3>${p ? "Editar produto" : "Novo produto"}</h3>
      <div class="campo grade2">${campo("referencia", "Código / Referência")}${campo("categoria", "Categoria")}</div>
      <div class="campo">${campo("descricao", "Descrição (nome da peça)")}</div>
      <div class="campo grade2">${campo("colecao", "Coleção")}${campo("fornecedor", "Fornecedor")}</div>
      <div class="campo">${campo("tecido", "Tecido")}</div>
      <div class="campo grade2">${dono() ? campo("preco_custo", "Preço de custo (R$)", 'inputmode="decimal"') : ""}${campo("preco_venda", "Preço de venda (R$)", 'inputmode="decimal"')}</div>
      <div class="campo">${campo("consumo_metros", "Consumo previsto de tecido (metros por peça)", 'inputmode="decimal"')}</div>
      <div class="campo"><label>Código de barras</label><input readonly value="${esc(p && p.codigo_barras ? p.codigo_barras : "Gerado automaticamente ao salvar")}"></div>
      <div class="campo"><label class="chk" style="text-transform:none;font-size:13px;color:var(--ink)"><input type="checkbox" data-k="ativo" ${F2.ativo ? "checked" : ""} style="width:auto"> Ativo (aparece no estoque)</label></div>
      <div class="caixa"><h4>Cores e tamanhos</h4><div class="mut">Separe por vírgula. Cada cor × tamanho vira uma variação com estoque próprio; as que já existem não se repetem.</div>
        <div class="campo grade2"><div><label for="nv_c">Cores</label><input id="nv_c" data-n="cores" value="${esc(novas.cores)}" placeholder="Ex.: Areia, Preto"></div>
          <div><label for="nv_t">Tamanhos</label><input id="nv_t" data-n="tamanhos" value="${esc(novas.tamanhos)}" placeholder="Ex.: P, M, G"></div></div>
        ${vs.length ? `<div class="campo">${vs.map(v => editando === v.id
          ? `<div class="vlin"><b>${esc(v.cor)} · ${esc(v.tamanho)}</b>
              <span><label>Edição</label><input data-x="edicao" value="${esc(v.edicao)}" placeholder="peça comum"></span>
              <span><label>Venda (R$)</label><input data-x="preco_venda" inputmode="decimal" value="${esc(moeda(v.preco_venda))}" placeholder="do produto"></span>
              ${dono() ? `<span><label>Custo (R$)</label><input data-x="preco_custo" inputmode="decimal" value="${esc(moeda(v.preco_custo))}" placeholder="do produto"></span>` : ""}
              <span class="acs"><button type="button" class="lnk" data-vsalvar="${v.id}">Salvar</button><button type="button" class="lnk" data-vcancel="1">Cancelar</button></span></div>`
          : `<div class="vlin"><span>${esc(nomeVar(v))}${v.preco_venda != null ? " · " + brl(v.preco_venda) : ""}${v.codigo_barras ? ` <span class="mut">cód. ${esc(v.codigo_barras)}</span>` : ""}${v.ativo ? "" : '<span class="tag">inativa</span>'}</span>
              <span class="acs"><button type="button" class="lnk" data-veditar="${v.id}">Preço/edição</button><button type="button" class="lnk" data-vativo="${v.id}">${v.ativo ? "Desativar" : "Reativar"}</button><button type="button" class="lnk perigo" data-vexcluir="${v.id}">Excluir</button></span></div>`).join("")}</div>` : ""}
      </div>
      ${p ? `<div class="caixa"><h4>Nova peça especial</h4><div class="mut">Peça única (bordada, pintura artística…) com preço e código de barras próprios. Pode repetir cor e tamanho de outra variação. Preço vazio = preço do produto.</div>
        <div class="campo grade2"><div><label>Cor</label><input data-e="cor" value="${esc(esp.cor)}"></div><div><label>Tamanho</label><input data-e="tamanho" value="${esc(esp.tamanho)}"></div></div>
        <div class="campo"><label>Edição</label><input data-e="edicao" value="${esc(esp.edicao)}" placeholder="Ex.: Bordada à mão"></div>
        <div class="campo grade2"><div><label>Preço de venda (R$)</label><input data-e="preco_venda" inputmode="decimal" value="${esc(esp.preco_venda)}"></div>${dono() ? `<div><label>Preço de custo (R$)</label><input data-e="preco_custo" inputmode="decimal" value="${esc(esp.preco_custo)}"></div>` : ""}</div>
        <div class="acoes" style="margin-top:8px"><button type="button" class="bt" id="espadd">Acrescentar peça especial</button></div></div>` : ""}
      ${erro ? `<div class="msg err">${esc(erro)}</div>` : ""}${ok ? `<div class="msg ok">${esc(ok)}</div>` : ""}
      <div class="acoes"><button type="button" class="bt" id="pfx">Fechar</button><button type="button" class="bt pri" id="pfs">Salvar produto</button></div>
      ${p ? '<div class="mut" style="margin-top:8px">Para lançar as quantidades: aba Estoque, desligue “Ocultar zerados” e clique no quadrado vermelho da variação (Entrada).</div>' : ""}`;
    $("pfx").onclick = () => $("dlg").close();
    $("pfs").onclick = salvar;
    const acao = async (fn, okmsg) => { ler(); try { await fn(); await recarregar(); desenhar(null, okmsg); } catch (e) { desenhar(e.message); } };
    f.querySelectorAll("[data-veditar]").forEach(b => b.onclick = () => { ler(); editando = b.dataset.veditar; desenhar(); });
    f.querySelectorAll("[data-vcancel]").forEach(b => b.onclick = () => { ler(); editando = null; desenhar(); });
    f.querySelectorAll("[data-vsalvar]").forEach(b => b.onclick = () => {
      const x = k => f.querySelector(`[data-x="${k}"]`).value;
      acao(async () => { checar(await sb.rpc("lin_variante_salvar", { p: { id: b.dataset.vsalvar, edicao: x("edicao"), preco_venda: numBR(x("preco_venda")), preco_custo: dono() ? numBR(x("preco_custo")) : "" } })); editando = null; }, "Variação atualizada.");
    });
    f.querySelectorAll("[data-vativo]").forEach(b => b.onclick = () => {
      const v = VARS.find(x => x.id === b.dataset.vativo);
      acao(async () => checar(await sb.rpc("lin_variante_ativar", { p_variante: v.id, p_ativo: !v.ativo })), v.ativo ? "Variação desativada: não aparece mais no estoque." : "Variação reativada.");
    });
    f.querySelectorAll("[data-vexcluir]").forEach(b => b.onclick = () => {
      const v = VARS.find(x => x.id === b.dataset.vexcluir);
      if (!confirm(`Excluir ${nomeVar(v)} definitivamente?`)) return;
      acao(async () => checar(await sb.rpc("lin_variante_excluir", { p_variante: v.id })), "Cor/tamanho excluída.");
    });
    if ($("espadd")) $("espadd").onclick = () => acao(async () => {
      checar(await sb.rpc("lin_variante_salvar", { p: { produto_id: p.id, cor: esp.cor, tamanho: esp.tamanho, edicao: esp.edicao, preco_venda: numBR(esp.preco_venda), preco_custo: numBR(esp.preco_custo) } }));
      esp = { cor: "", tamanho: "", edicao: "", preco_venda: "", preco_custo: "" };
    }, "Peça especial acrescentada.");
  };
  const recarregar = async () => { await carregarProdutos(); if (p) p = PRODS.find(x => x.id === p.id); carregar().catch(() => {}); };
  const salvar = async () => {
    ler();
    const cores = listaV(novas.cores), tams = listaV(novas.tamanhos);
    if ((cores.length > 0) !== (tams.length > 0)) return desenhar("Para criar variações, informe as cores e os tamanhos.");
    $("pfs").disabled = true; $("pfs").textContent = "Salvando…";
    try {
      const novo = !p;
      const id = checar(await sb.rpc("lin_produto_salvar", { p: { id: p ? p.id : null, referencia: F2.referencia, descricao: F2.descricao, categoria: F2.categoria,
        colecao: F2.colecao, fornecedor: F2.fornecedor, tecido: F2.tecido, preco_custo: numBR(F2.preco_custo), preco_venda: numBR(F2.preco_venda),
        consumo_metros: numBR(F2.consumo_metros), ativo: !!F2.ativo } }));
      let criadas = 0;
      if (cores.length) criadas = checar(await sb.rpc("lin_variantes_criar", { p_produto: id, p_cores: cores, p_tamanhos: tams }));
      novas = { cores: "", tamanhos: "" };
      await carregarProdutos(); p = PRODS.find(x => x.id === id); carregar().catch(() => {});
      desenhar(null, (novo ? "Produto cadastrado" : "Produto atualizado") + (cores.length ? `; ${criadas} variação(ões) nova(s)` : "") + ".");
    } catch (e) { desenhar(e.message); }
  };
  desenhar();
  $("dlg").showModal();
}

// ---------------------------------------------------------------- vendas e clientes (Dono e Vendedora; boleta de venda)
const FORMAS = { credito: "Cartão de crédito", debito: "Débito", pix: "Pix", dinheiro: "Dinheiro", cheque: "Cheque", outro: "Outro" };
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
let VENDAS = [], ITENS = [], CLIENTES = [], VENDEDORAS = [];
const FV = { de: "", ate: "", loja: "", vend: "" };
const FC = { q: "", niver: false };
const soDig = t => String(t || "").replace(/\D/g, "");
const fone = t => { const d = soDig(t); return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d; };
const niver = c => c.aniversario_dia ? `${String(c.aniversario_dia).padStart(2, "0")}/${MESES[c.aniversario_mes - 1]}` : "";
const numV = t => { const x = numBR(t); return x === "" ? 0 : Number(x); };
const r2 = x => Math.round(x * 100) / 100;
const cliente = id => CLIENTES.find(c => c.id === id);
const pagTxt = v => (v.pagamentos || []).map(p => FORMAS[p.forma] + (p.forma === "credito" && p.parcelas > 1 ? ` ${p.parcelas}x` : "")).join(" + ") || "—";

async function carregarClientes() {
  CLIENTES = await todas(() => sb.from("lin_clientes").select("*").order("nome"));
}
async function carregarVendedoras() {
  if (!VENDEDORAS.length) VENDEDORAS = checar(await sb.rpc("lin_vendedoras")) || [];
}
async function carregarVendas() {
  let q = () => { let x = sb.from("lin_vendas").select("*").gte("data", FV.de).lte("data", FV.ate).order("data", { ascending: false }).order("id", { ascending: false });
    if (FV.loja) x = x.eq("loja_id", FV.loja); if (FV.vend) x = x.eq("vendedora_id", FV.vend); return x; };
  VENDAS = await todas(q);
  ITENS = [];
  for (let i = 0; i < VENDAS.length; i += 200) {
    const ids = VENDAS.slice(i, i + 200).map(v => v.id);
    ITENS.push(...await todas(() => sb.from("lin_venda_itens").select("*").in("venda_id", ids).order("id")));
  }
}
function periodoPadrao() {
  if (FV.de) return;
  const h = hoje(); FV.ate = h; FV.de = h.slice(0, 8) + "01";
}

async function telaVendas() {
  periodoPadrao();
  $("tela").innerHTML = '<div class="card">Carregando…</div>';
  try { await Promise.all([carregarVendas(), carregarClientes(), carregarVendedoras()]); }
  catch (e) { $("tela").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  const ok = VENDAS.filter(v => !v.cancelada_em);
  const pecas = ITENS.filter(i => ok.some(v => v.id === i.venda_id)).reduce((s, i) => s + i.quantidade, 0);
  const total = ok.reduce((s, v) => s + Number(v.valor_total), 0);
  const grupo = (chave, nome) => { const m = {}; ok.forEach(v => { const k = chave(v); m[k] = m[k] || { nome: nome(v), n: 0, t: 0, c: 0 }; m[k].n++; m[k].t += Number(v.valor_total); m[k].c += Number(v.comissao_valor || 0); });
    return Object.values(m).sort((a, b) => b.t - a.t); };
  $("tela").innerHTML = `
    <div class="cabtela"><h2>Vendas</h2><button class="bt pri" id="vnova">+ Nova venda</button></div>
    <div class="filtros">
      <label class="chk">De <input type="date" id="fvde" value="${esc(FV.de)}" style="width:auto"></label>
      <label class="chk">Até <input type="date" id="fvate" value="${esc(FV.ate)}" style="width:auto"></label>
      ${dono() ? `<select id="fvloja" aria-label="Loja"><option value="">Todas as lojas</option>${LOJAS.map(l => `<option value="${l.id}" ${l.id === FV.loja ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}</select>
      <select id="fvvend" aria-label="Vendedora"><option value="">Todas as vendedoras</option>${VENDEDORAS.map(u => `<option value="${u.user_id}" ${u.user_id === FV.vend ? "selected" : ""}>${esc(u.nome)}</option>`).join("")}</select>` : ""}
    </div>
    <div class="kpis">
      <div class="kpi"><small>Vendas</small><b>${n(ok.length)}</b><span>${VENDAS.length - ok.length ? n(VENDAS.length - ok.length) + " cancelada(s)" : "no período"}</span></div>
      <div class="kpi"><small>Peças</small><b>${n(pecas)}</b></div>
      <div class="kpi"><small>Total vendido</small><b>${brl(total)}</b></div>
      <div class="kpi"><small>Ticket médio</small><b>${brl(ok.length ? total / ok.length : 0)}</b></div>
      <div class="kpi"><small>${dono() ? "Comissões" : "Sua comissão"}</small><b>${brl(ok.reduce((s, v) => s + Number(v.comissao_valor || 0), 0))}</b><span>${dono() ? "das vendas do período" : MINHA_COMISSAO ? decBR(MINHA_COMISSAO) + "% sobre o valor pago" : "sem comissão"}</span></div>
    </div>
    ${dono() && ok.length ? `<div class="grade2" style="margin-bottom:12px">
      <div class="card"><h2>Por loja</h2>${grupo(v => v.loja_id, v => loja(v.loja_id).nome).map(g => `<div class="vlin"><span>${esc(g.nome)} · ${n(g.n)} venda(s)</span><b>${brl(g.t)}</b></div>`).join("")}</div>
      <div class="card"><h2>Por vendedora</h2>${grupo(v => v.vendedora_id, v => v.vendedora_nome).map(g => `<div class="vlin"><span>${esc(g.nome)} · ${n(g.n)} venda(s)${g.c ? ` · comissão ${brl(g.c)}` : ""}</span><b>${brl(g.t)}</b></div>`).join("")}</div></div>` : ""}
    <div class="card"><div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Loja</th><th>Vendedora</th><th>Cliente</th><th>Peças</th><th>Pagamento</th><th class="num">Total</th></tr></thead><tbody>
      ${VENDAS.length ? VENDAS.map(v => { const its = ITENS.filter(i => i.venda_id === v.id), c = cliente(v.cliente_id);
        return `<tr class="vrow ${v.cancelada_em ? "cancelada" : ""}" data-v="${v.id}" style="cursor:pointer"><td>${v.id}</td><td>${dataBR(v.data)}</td><td>${esc(loja(v.loja_id).nome)}</td>
          <td>${esc(v.vendedora_nome)}</td><td>${c ? esc(c.nome) : '<span class="mut">—</span>'}</td>
          <td>${esc(its.map(i => `${i.quantidade > 1 ? i.quantidade + "× " : ""}${i.referencia} ${i.cor} ${i.tamanho}`).join(", "))}</td>
          <td>${esc(pagTxt(v))}</td><td class="num">${v.cancelada_em ? '<span class="tag">cancelada</span> ' : ""}${brl(v.valor_total)}</td></tr>`; }).join("")
      : '<tr><td colspan="8" class="mut">Nenhuma venda no período.</td></tr>'}
    </tbody></table></div></div>`;
  $("vnova").onclick = () => novaVenda();
  $("fvde").onchange = e => { FV.de = e.target.value || FV.de; telaVendas(); };
  $("fvate").onchange = e => { FV.ate = e.target.value || FV.ate; telaVendas(); };
  if ($("fvloja")) { $("fvloja").onchange = e => { FV.loja = e.target.value; telaVendas(); }; $("fvvend").onchange = e => { FV.vend = e.target.value; telaVendas(); }; }
  document.querySelectorAll(".vrow").forEach(r => r.onclick = () => verVenda(Number(r.dataset.v)));
}

function verVenda(id) {
  $("dlg").classList.add("largo");
  const v = VENDAS.find(x => x.id === id), its = ITENS.filter(i => i.venda_id === id), c = cliente(v.cliente_id), f = $("dlgf");
  f.innerHTML = `<h3>Venda nº ${v.id}${v.cancelada_em ? ' <span class="tag">cancelada</span>' : ""}</h3>
    <div class="mut">${dataBR(v.data)} · ${esc(loja(v.loja_id).nome)} · vendedora ${esc(v.vendedora_nome)}</div>
    <div class="campo"><b>Cliente:</b> ${c ? `${esc(c.nome)}${c.telefone ? " · " + esc(fone(c.telefone)) : ""}` : '<span class="mut">não informado</span>'}</div>
    <div class="campo tw"><table><thead><tr><th>Peça</th><th class="num">Qtd</th><th class="num">Tabela</th><th class="num">Desc.</th><th class="num">Valor</th><th class="num">Total</th></tr></thead><tbody>
      ${its.map(i => `<tr><td><b>${esc(i.referencia)}</b> ${esc(i.descricao)}<br><span class="mut">${esc([i.cor, i.tamanho, i.edicao].filter(Boolean).join(" · "))}</span></td>
        <td class="num">${n(i.quantidade)}</td><td class="num">${brl(i.preco_tabela)}</td><td class="num">${Number(i.desconto_pct) ? decBR(Number(i.desconto_pct)) + "%" : "—"}</td>
        <td class="num">${brl(i.valor_unitario)}</td><td class="num">${brl(i.valor_total)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="campo">
      <div class="vlin"><span>Valor de tabela</span><span>${brl(v.valor_bruto)}</span></div>
      <div class="vlin"><span>Peças com desconto</span><span>${brl(v.valor_itens)}</span></div>
      ${Number(v.desconto) ? `<div class="vlin"><span>Desconto geral</span><span>− ${brl(v.desconto)}</span></div>` : ""}
      <div class="vlin"><b>Valor pago</b><b>${brl(v.valor_total)}</b></div>
      ${(v.pagamentos || []).map(p => `<div class="vlin"><span>${esc(FORMAS[p.forma])}${p.forma === "credito" ? ` em ${p.parcelas}x` : ""}</span><span>${brl(p.valor)}</span></div>`).join("")}
      <div class="vlin"><span>Comissão de ${esc(v.vendedora_nome)}</span><span>${Number(v.comissao_pct) ? `${decBR(Number(v.comissao_pct))}% = ${brl(v.comissao_valor)}` : "sem comissão"}</span></div>
    </div>
    ${v.observacao ? `<div class="campo"><b>Observações:</b> ${esc(v.observacao)}</div>` : ""}
    <div class="mut campo">Registrada por ${esc(v.criado_nome)} em ${new Date(v.criado_em).toLocaleString("pt-BR", { timeZone: TZ })}</div>
    ${v.cancelada_em ? `<div class="msg err">Cancelada por ${esc(v.cancelada_nome || "")} em ${new Date(v.cancelada_em).toLocaleString("pt-BR", { timeZone: TZ })}: ${esc(v.motivo_cancelamento)}</div>` : ""}
    <div id="verr"></div>
    <div class="acoes">${dono() && !v.cancelada_em ? '<button type="button" class="bt" id="vcanc" style="color:var(--crit);border-color:var(--crit)">Cancelar venda</button>' : ""}<button type="button" class="bt pri" id="vfechar">Fechar</button></div>`;
  $("vfechar").onclick = () => $("dlg").close();
  if ($("vcanc")) $("vcanc").onclick = async () => {
    const motivo = prompt("Motivo do cancelamento (as peças voltam para o estoque da loja):");
    if (motivo === null) return;
    try { checar(await sb.rpc("lin_venda_cancelar", { p_venda: v.id, p_motivo: motivo })); $("dlg").close(); await carregar(); await telaVendas(); msg("ok", `Venda nº ${v.id} cancelada; as peças voltaram para o estoque.`); }
    catch (e) { $("verr").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  $("dlg").showModal();
}

// ---------------------------------------------------------------- nova venda (formulário no formato da boleta)
// quem vende escolhe a loja de cada venda (vendedora deslocada); vem marcada a loja principal da pessoa
async function novaVenda() {
  $("dlg").classList.add("largo");
  const { data: { session } } = await sb.auth.getSession();
  const eu = session.user.id;
  const NV = { data: hoje(), loja: (dono() && FV.loja) || MINHA_LOJA || (LOJAS[0] || {}).id, vend: eu, cliente: null, itens: [], desconto: "", obs: "",
               pags: [{ forma: "credito", valor: "", parcelas: "1", auto: true }] };
  const f = $("dlgf");
  const soma = () => r2(NV.itens.reduce((s, i) => s + numV(i.vu) * (Number(i.q) || 0), 0));
  const totalV = () => r2(soma() - numV(NV.desconto));
  const disp = vid => qtd(vid, NV.loja);
  f.innerHTML = `<h3>Nova venda</h3>
    <div class="campo grade3">
      <div><label for="nvdata">Data</label><input type="date" id="nvdata" value="${NV.data}" max="${hoje()}"></div>
      <div><label for="nvloja">Loja</label><select id="nvloja">${LOJAS.map(l => `<option value="${l.id}" ${l.id === NV.loja ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}</select></div>
      <div><label for="nvvend">Vendedora</label>${dono() ? `<select id="nvvend">${VENDEDORAS.map(u => `<option value="${u.user_id}" ${u.user_id === eu ? "selected" : ""}>${esc(u.nome)}</option>`).join("")}${VENDEDORAS.some(u => u.user_id === eu) ? "" : `<option value="${eu}" selected>Eu (equipe Nervia)</option>`}</select>` : `<input readonly value="${esc((VENDEDORAS.find(u => u.user_id === eu) || {}).nome || "Eu")}">`}</div>
    </div>
    <div class="caixa"><h4>Cliente</h4><div id="nvcli"></div></div>
    <div class="caixa"><h4>Peças</h4>
      <input id="nvpq" type="search" placeholder="Referência, nome ou código de barras da etiqueta" autocomplete="off">
      <div id="nvres"></div><div id="nvitens" class="campo"></div></div>
    <div class="caixa"><h4>Pagamento</h4>
      <div class="vlin"><span>Peças</span><b id="nvsoma"></b></div>
      <div class="vlin"><span>Desconto geral (R$)</span><input id="nvdesc" inputmode="decimal" placeholder="0,00" style="width:110px"></div>
      <div class="vlin"><b>Total a pagar</b><b id="nvtotal"></b></div>
      <div id="nvpags" class="campo"></div>
      <div class="acoes" style="justify-content:space-between;margin-top:6px"><button type="button" class="lnk" id="nvmaispag">+ outra forma de pagamento</button><span id="nvfalta" class="mut"></span></div>
    </div>
    <div class="campo"><label for="nvobs">Observações</label><input id="nvobs" maxlength="500" placeholder="Ex.: Niver 21/07, troca combinada, ajuste na barra"></div>
    <div id="nverr"></div>
    <div class="acoes"><button type="button" class="bt" id="nvx">Cancelar</button><button type="button" class="bt pri" id="nvok">Registrar venda</button></div>`;

  const totais = () => {
    const t = totalV();
    if (NV.pags.length === 1 && NV.pags[0].auto) { NV.pags[0].valor = t > 0 ? moeda(t) : ""; const i = f.querySelector('[data-pg="0"][data-k="valor"]'); if (i) i.value = NV.pags[0].valor; }
    $("nvsoma").textContent = brl(soma()); $("nvtotal").textContent = brl(t);
    const falta = r2(t - NV.pags.reduce((s, p) => s + numV(p.valor), 0));
    $("nvfalta").textContent = Math.abs(falta) < 0.01 ? "" : falta > 0 ? `Falta ${brl(falta)}` : `Passou ${brl(-falta)}`;
    f.querySelectorAll("[data-it-total]").forEach(el => { const it = NV.itens[el.dataset.itTotal]; el.textContent = brl(numV(it.vu) * (Number(it.q) || 0)); });
  };
  const desenharCliente = () => {
    const c = NV.cliente;
    $("nvcli").innerHTML = c ? `<div class="vlin"><span><b>${esc(c.nome)}</b>${c.telefone ? " · " + esc(fone(c.telefone)) : ""}${niver(c) ? " · aniversário " + niver(c) : ""}</span>
        <span class="acs"><button type="button" class="lnk" id="nvcedit">Editar</button><button type="button" class="lnk" id="nvctroca">Trocar</button></span></div>`
      : `<input id="nvcq" type="search" placeholder="Nome, telefone ou CPF (deixe vazio se não quiser identificar)" autocomplete="off"><div id="nvcres"></div>`;
    if (c) {
      $("nvctroca").onclick = () => { NV.cliente = null; desenharCliente(); $("nvcq").focus(); };
      $("nvcedit").onclick = () => editarCliente(c, novo => { NV.cliente = novo; desenharCliente(); });
      return;
    }
    const busca = () => {
      const t = $("nvcq").value.trim(), d = soDig(t), tl = t.toLowerCase();
      const l = t.length < 2 ? [] : CLIENTES.filter(x => x.nome.toLowerCase().includes(tl) || (d.length >= 4 && (x.telefone.includes(d) || (x.cpf || "").includes(d)))).slice(0, 6);
      $("nvcres").innerHTML = (l.map(x => `<div class="vlin"><span><b>${esc(x.nome)}</b>${x.telefone ? " · " + esc(fone(x.telefone)) : ""}</span><button type="button" class="lnk" data-cli="${x.id}">Escolher</button></div>`).join("")
        + (t.length >= 2 ? `<div class="vlin"><span class="mut">${l.length ? "Não é nenhum desses?" : "Cliente não encontrado."}</span><button type="button" class="lnk" id="nvcnovo">+ Novo cliente</button></div>` : ""));
      $("nvcres").querySelectorAll("[data-cli]").forEach(b => b.onclick = () => { NV.cliente = cliente(b.dataset.cli); desenharCliente(); });
      if ($("nvcnovo")) $("nvcnovo").onclick = () => editarCliente({ nome: d.length >= 8 ? "" : t, telefone: d.length >= 8 ? d : "" }, novo => { NV.cliente = novo; desenharCliente(); });
    };
    $("nvcq").oninput = busca;
  };
  const desenharItens = () => {
    $("nvitens").innerHTML = NV.itens.length ? `<div class="tw"><table><thead><tr><th>Peça</th><th class="num">Qtd</th><th class="num">Tabela</th><th class="num">Desc. %</th><th class="num">Valor</th><th class="num">Total</th><th></th></tr></thead><tbody>
      ${NV.itens.map((it, i) => `<tr><td><b>${esc(it.ref)}</b> ${esc(it.desc)}<br><span class="mut">${esc(it.var)} · ${n(disp(it.vid))} na loja</span></td>
        <td class="num"><input data-i="${i}" data-k="q" type="number" min="1" max="${disp(it.vid)}" value="${it.q}" style="width:60px"></td>
        <td class="num">${brl(it.tab)}</td>
        <td class="num"><input data-i="${i}" data-k="pct" inputmode="decimal" value="${esc(it.pct)}" placeholder="0" style="width:64px"></td>
        <td class="num"><input data-i="${i}" data-k="vu" inputmode="decimal" value="${esc(it.vu)}" style="width:90px"></td>
        <td class="num" data-it-total="${i}"></td><td><button type="button" class="lnk perigo" data-rm="${i}" title="Tirar">×</button></td></tr>`).join("")}
      </tbody></table></div>` : '<div class="mut">Procure a peça acima pela referência, pelo nome ou pelo código de barras.</div>';
    $("nvitens").querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => {
      const it = NV.itens[inp.dataset.i], k = inp.dataset.k; it[k] = inp.value;
      if (k === "pct") { it.vu = moeda(r2(it.tab * (1 - Math.min(Math.max(numV(it.pct), 0), 100) / 100))); $("nvitens").querySelector(`[data-i="${inp.dataset.i}"][data-k="vu"]`).value = it.vu; }
      if (k === "vu") { it.pct = it.tab > 0 && numV(it.vu) < it.tab ? decBR(r2((1 - numV(it.vu) / it.tab) * 100)) : ""; $("nvitens").querySelector(`[data-i="${inp.dataset.i}"][data-k="pct"]`).value = it.pct; }
      totais();
    });
    $("nvitens").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { NV.itens.splice(Number(b.dataset.rm), 1); desenharItens(); });
    totais();
  };
  const addItem = (p, v) => {
    const ja = NV.itens.find(i => i.vid === v.id);
    if (ja) { ja.q = String(Math.min((Number(ja.q) || 0) + 1, disp(v.id))); }
    else { const tab = Number(v.preco_venda != null ? v.preco_venda : p.preco_venda) || 0;
      NV.itens.push({ vid: v.id, ref: p.referencia, desc: p.descricao, var: nomeVar(v), tab, q: "1", pct: "", vu: moeda(tab) }); }
    $("nvpq").value = ""; $("nvres").innerHTML = ""; desenharItens(); $("nvpq").focus();
  };
  const buscaPeca = () => {
    const t = $("nvpq").value.trim().toLowerCase();
    if (t.length < 2) { $("nvres").innerHTML = ""; return []; }
    const r = [];
    for (const p of PRODUTOS) {
      const casaP = p.referencia.toLowerCase().includes(t) || p.descricao.toLowerCase().includes(t) || (p.codigo_barras || "") === t;
      for (const v of p.variantes) if ((casaP || (v.codigo_barras || "") === t) && disp(v.id) > 0) r.push([p, v]);
      if (r.length > 40) break;
    }
    $("nvres").innerHTML = r.length ? r.slice(0, 40).map(([p, v], i) => `<div class="vlin"><span><b>${esc(p.referencia)}</b> ${esc(p.descricao)} — ${esc(nomeVar(v))} · ${brl(v.preco_venda != null ? v.preco_venda : p.preco_venda)} · ${n(disp(v.id))} na loja</span>
        <button type="button" class="lnk" data-add="${i}">Adicionar</button></div>`).join("") : `<div class="mut">Nenhuma peça com estoque em ${esc(loja(NV.loja).nome)} para “${esc(t)}”.</div>`;
    $("nvres").querySelectorAll("[data-add]").forEach(b => b.onclick = () => addItem(...r[b.dataset.add]));
    return r;
  };
  $("nvpq").oninput = buscaPeca;
  $("nvpq").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const r = buscaPeca(); if (r.length === 1) addItem(...r[0]); } };
  const desenharPags = () => {
    $("nvpags").innerHTML = NV.pags.map((p, i) => `<div class="vlin">
      <select data-pg="${i}" data-k="forma" style="width:auto">${Object.entries(FORMAS).map(([k, r]) => `<option value="${k}" ${k === p.forma ? "selected" : ""}>${r}</option>`).join("")}</select>
      ${p.forma === "credito" ? `<select data-pg="${i}" data-k="parcelas" style="width:auto">${Array.from({ length: 12 }, (_, x) => x + 1).map(x => `<option value="${x}" ${String(x) === String(p.parcelas) ? "selected" : ""}>${x}x</option>`).join("")}</select>` : "<span></span>"}
      <input data-pg="${i}" data-k="valor" inputmode="decimal" value="${esc(p.valor)}" placeholder="0,00" style="width:110px">
      ${NV.pags.length > 1 ? `<button type="button" class="lnk perigo" data-pgrm="${i}">×</button>` : ""}</div>`).join("");
    $("nvpags").querySelectorAll("[data-pg]").forEach(el => el[el.tagName === "SELECT" ? "onchange" : "oninput"] = () => {
      const p = NV.pags[el.dataset.pg]; p[el.dataset.k] = el.value; if (el.dataset.k === "valor") p.auto = false;
      if (el.dataset.k === "forma") desenharPags(); else totais();
    });
    $("nvpags").querySelectorAll("[data-pgrm]").forEach(b => b.onclick = () => { NV.pags.splice(Number(b.dataset.pgrm), 1); desenharPags(); });
    totais();
  };
  $("nvmaispag").onclick = () => { NV.pags.forEach(p => p.auto = false); const falta = r2(totalV() - NV.pags.reduce((s, p) => s + numV(p.valor), 0));
    NV.pags.push({ forma: "pix", valor: falta > 0 ? moeda(falta) : "", parcelas: "1" }); desenharPags(); };
  $("nvdata").onchange = e => NV.data = e.target.value;
  if ($("nvloja")) $("nvloja").onchange = e => { NV.loja = e.target.value; NV.itens = []; desenharItens(); };
  if ($("nvvend")) $("nvvend").onchange = e => NV.vend = e.target.value;
  $("nvdesc").oninput = e => { NV.desconto = e.target.value; totais(); };
  $("nvobs").oninput = e => NV.obs = e.target.value;
  $("nvx").onclick = () => $("dlg").close();
  $("nvok").onclick = async () => {
    const erro = t => { $("nverr").innerHTML = `<div class="msg err">${esc(t)}</div>`; $("nverr").scrollIntoView({ block: "nearest" }); };
    if (!NV.itens.length) return erro("Acrescente ao menos uma peça.");
    for (const it of NV.itens) { if (!(Number(it.q) >= 1)) return erro(`Quantidade inválida em ${it.ref}.`); if (Number(it.q) > disp(it.vid)) return erro(`${it.ref} ${it.var}: a loja tem só ${disp(it.vid)}.`); }
    const pags = NV.pags.filter(p => numV(p.valor) > 0);
    $("nvok").disabled = true; $("nvok").textContent = "Registrando…";
    try {
      const id = checar(await sb.rpc("lin_venda_registrar", { p: { loja_id: NV.loja, vendedora_id: NV.vend, cliente_id: NV.cliente ? NV.cliente.id : null, data: NV.data,
        desconto: numBR(NV.desconto) || 0, observacao: NV.obs.trim(),
        itens: NV.itens.map(i => ({ variante_id: i.vid, quantidade: Number(i.q), valor_unitario: numBR(i.vu) || 0, desconto_pct: numBR(i.pct) || 0 })),
        pagamentos: pags.map(p => ({ forma: p.forma, valor: numBR(p.valor), parcelas: Number(p.parcelas) || 1 })) } }));
      $("dlg").close(); await carregar();
      if (VISTA === "vendas") await telaVendas();
      msg("ok", `Venda nº ${id} registrada; o estoque de ${loja(NV.loja).nome} foi atualizado.`);
    } catch (e) { erro(e.message); $("nvok").disabled = false; $("nvok").textContent = "Registrar venda"; }
  };
  desenharCliente(); desenharItens(); desenharPags();
  $("dlg").showModal();
}

// ---------------------------------------------------------------- clientes
function editarCliente(c, depois) {
  const f = $("dlg2f"), C = Object.assign({ nome: "", telefone: "", cpf: "", email: "", endereco: "", aniversario_dia: "", aniversario_mes: "", observacoes: "" }, c || {});
  f.innerHTML = `<h3>${C.id ? "Editar cliente" : "Novo cliente"}</h3>
    <div class="campo"><label for="cl_nome">Nome</label><input id="cl_nome" value="${esc(C.nome)}"></div>
    <div class="campo grade2"><div><label for="cl_tel">Telefone (com DDD)</label><input id="cl_tel" inputmode="tel" value="${esc(fone(C.telefone))}" placeholder="(21) 99999-9999"></div>
      <div><label for="cl_cpf">CPF</label><input id="cl_cpf" inputmode="numeric" value="${esc(C.cpf || "")}" placeholder="opcional"></div></div>
    <div class="campo grade2"><div><label for="cl_email">E-mail</label><input id="cl_email" type="email" value="${esc(C.email)}"></div>
      <div><label>Aniversário</label><div style="display:flex;gap:6px"><select id="cl_dia" aria-label="Dia"><option value="">Dia</option>${Array.from({ length: 31 }, (_, x) => x + 1).map(x => `<option ${String(x) === String(C.aniversario_dia) ? "selected" : ""}>${x}</option>`).join("")}</select>
        <select id="cl_mes" aria-label="Mês"><option value="">Mês</option>${MESES.map((m, x) => `<option value="${x + 1}" ${String(x + 1) === String(C.aniversario_mes) ? "selected" : ""}>${m}</option>`).join("")}</select></div></div></div>
    <div class="campo"><label for="cl_end">Endereço</label><input id="cl_end" value="${esc(C.endereco)}"></div>
    <div class="campo"><label for="cl_obs">Observações</label><input id="cl_obs" value="${esc(C.observacoes)}" placeholder="Preferências, medidas, como gosta de ser atendida…"></div>
    <div id="clerr"></div>
    <div class="acoes"><button type="button" class="bt" id="clx">Cancelar</button><button type="button" class="bt pri" id="clok">Salvar cliente</button></div>`;
  $("clx").onclick = () => $("dlg2").close();
  $("clok").onclick = async () => {
    try {
      const id = checar(await sb.rpc("lin_cliente_salvar", { p: { id: C.id || null, nome: $("cl_nome").value, telefone: $("cl_tel").value, cpf: $("cl_cpf").value,
        email: $("cl_email").value, endereco: $("cl_end").value, aniversario_dia: $("cl_dia").value, aniversario_mes: $("cl_mes").value, observacoes: $("cl_obs").value } }));
      await carregarClientes(); $("dlg2").close();
      if (depois) depois(cliente(id));
    } catch (e) { $("clerr").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  $("dlg2").showModal(); $("cl_nome").focus();
}

async function telaClientes() {
  $("tela").innerHTML = '<div class="card">Carregando…</div>';
  try {
    await carregarClientes();
    VENDAS = await todas(() => sb.from("lin_vendas").select("id, cliente_id, data, valor_total, cancelada_em, loja_id").not("cliente_id", "is", null).is("cancelada_em", null));
  } catch (e) { $("tela").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("tela").innerHTML = `
    <div class="cabtela"><h2>Clientes <span class="mut">· ${n(CLIENTES.length)} cadastrado(s)</span></h2><button class="bt pri" id="cnovo">+ Novo cliente</button></div>
    <div class="filtros"><input id="cq" type="search" placeholder="Nome, telefone ou CPF" value="${esc(FC.q)}">
      <button type="button" class="pilula ${FC.niver ? "on" : ""}" id="cniver">Aniversariantes de ${MESES[new Date().getMonth()]}</button></div>
    <div class="card"><div class="tw"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Aniversário</th><th class="num">Compras</th><th class="num">Total</th><th>Última compra</th></tr></thead><tbody id="clista"></tbody></table></div>
    ${dono() ? "" : '<div class="mut" style="margin-top:6px">Compras e total contam só as vendas que você registrou.</div>'}</div>`;
  $("cnovo").onclick = () => editarCliente(null, () => telaClientes());
  $("cq").oninput = e => { FC.q = e.target.value; listaClientes(); };
  $("cniver").onclick = () => { FC.niver = !FC.niver; telaClientes(); };
  listaClientes();
}
function listaClientes() {
  const t = FC.q.trim().toLowerCase(), d = soDig(t), mes = new Date().getMonth() + 1;
  const l = CLIENTES.filter(c => (!t || c.nome.toLowerCase().includes(t) || (d.length >= 4 && (c.telefone.includes(d) || (c.cpf || "").includes(d))))
    && (!FC.niver || c.aniversario_mes === mes)).sort((a, b) => FC.niver ? a.aniversario_dia - b.aniversario_dia : a.nome.localeCompare(b.nome, "pt-BR"));
  $("clista").innerHTML = l.length ? l.slice(0, 500).map(c => {
    const vs = VENDAS.filter(v => v.cliente_id === c.id), tot = vs.reduce((s, v) => s + Number(v.valor_total), 0), ult = vs.map(v => v.data).sort().pop();
    return `<tr class="crow" data-c="${c.id}" style="cursor:pointer"><td><b>${esc(c.nome)}</b>${c.observacoes ? `<br><span class="mut">${esc(c.observacoes)}</span>` : ""}</td>
      <td>${c.telefone ? `<a href="https://wa.me/55${esc(c.telefone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(fone(c.telefone))}</a>` : "—"}</td>
      <td>${niver(c) || "—"}</td><td class="num">${n(vs.length)}</td><td class="num">${vs.length ? brl(tot) : "—"}</td><td>${ult ? dataBR(ult) : "—"}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="mut">${CLIENTES.length ? "Nenhum cliente com esse filtro." : "Nenhum cliente ainda. Eles entram aqui ao registrar a venda ou em “+ Novo cliente”."}</td></tr>`;
  document.querySelectorAll(".crow").forEach(r => r.onclick = () => editarCliente(cliente(r.dataset.c), () => telaClientes()));
}

// ---------------------------------------------------------------- equipe (só a equipe Nervia)
async function telaEquipe() {
  $("tela").innerHTML = '<div class="card">Carregando…</div>';
  try { EQUIPE = checar(await sb.rpc("lin_equipe")) || []; } catch (e) { $("tela").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  const opLoja = sel => `<option value="">—</option>` + LOJAS.map(l => `<option value="${l.id}" ${l.id === sel ? "selected" : ""}>${esc(l.nome)}</option>`).join("");
  $("tela").innerHTML = `<div class="card"><h2>Equipe da Linum</h2>
    <p class="mut">Aparecem aqui os logins com o app <b>Sistema Linum</b> liberado na Área do Cliente (Administração → Logins). Dono: tudo, inclusive preço de custo. Estoque: cadastra peças, altera o preço de venda e movimenta o estoque, sem ver nem alterar custo. Vendedora: consulta o estoque, sem preço de custo. <b>Todos vendem</b>, em qualquer loja (a loja principal vem marcada na venda), e cada um vê só as próprias vendas; o Dono vê as de todos. <b>Comissão (%)</b>: sobre o valor pago de cada venda da pessoa; 0 = sem comissão. Mudar o % não altera as vendas já feitas. Todas as ações ficam na auditoria. Sem papel: o login não entra no app.</p>
    ${EQUIPE.length ? `<div class="tw"><table><thead><tr><th>Login</th><th>Papel</th><th>Loja principal</th><th>Comissão (%)</th><th></th></tr></thead><tbody>
      ${EQUIPE.map((u, i) => `<tr><td><b>${esc(u.nome || u.email)}</b><br><span class="mut">${esc(u.email)}</span></td>
        <td><select data-i="${i}" class="eq-papel"><option value="">Sem papel</option><option value="dono" ${u.papel === "dono" ? "selected" : ""}>Dono</option><option value="estoque" ${u.papel === "estoque" ? "selected" : ""}>Estoque</option><option value="vendedora" ${u.papel === "vendedora" ? "selected" : ""}>Vendedora</option></select></td>
        <td><select data-i="${i}" class="eq-loja">${opLoja(u.loja_id)}</select></td>
        <td><input data-i="${i}" class="eq-comissao" inputmode="decimal" value="${esc(u.comissao_pct != null ? decBR(Number(u.comissao_pct)) : "0")}" style="width:80px" aria-label="Comissão em %"></td>
        <td><button class="bt pri eq-salvar" data-i="${i}">Salvar</button></td></tr>`).join("")}
      </tbody></table></div>` : '<div class="vazio">Nenhum login com o app liberado ainda.</div>'}</div>`;
  document.querySelectorAll(".eq-salvar").forEach(b => b.onclick = async () => {
    const i = b.dataset.i, u = EQUIPE[i];
    const papel = document.querySelector(`.eq-papel[data-i="${i}"]`).value, lj = document.querySelector(`.eq-loja[data-i="${i}"]`).value || null;
    const cm = numBR(document.querySelector(`.eq-comissao[data-i="${i}"]`).value) || 0;
    b.disabled = true;
    try { checar(await sb.rpc("lin_membro_salvar", { p_user: u.user_id, p_papel: papel, p_loja: lj, p_comissao: Number(cm) })); msg("ok", `Papel de ${u.nome || u.email} salvo.`); await telaEquipe(); }
    catch (e) { msg("err", e.message); b.disabled = false; }
  });
}

$("dlg").addEventListener("close", () => $("dlg").classList.remove("largo"));
$("dlg").addEventListener("close", () => { if (VISTA === "produtos" && $("plista")) listaProdutos(); });
iniciar();
</script>
