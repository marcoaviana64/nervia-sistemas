    </div>
    <div class="caixa"><h4>Peça que a cliente devolve</h4>
      <div class="opcoes"><button type="button" class="pilula on" data-modo="venda">Venda do sistema</button><button type="button" class="pilula" data-modo="avulsa">Compra antiga (sem venda no sistema)</button></div>
      <div id="trdevbox" class="campo"></div><div id="trdev" class="campo"></div></div>
    <div class="caixa"><h4>Cliente</h4><div id="trcli"></div></div>
    <div class="caixa"><h4>Peça que a cliente leva</h4>
      <input id="trpq" type="search" placeholder="Referência, nome ou código de barras (só peças com estoque na loja da troca)" autocomplete="off">
      <div id="trres"></div><div id="trnovas" class="campo"></div></div>
    <div class="caixa"><h4>Diferença</h4>
      <div class="vlin"><span>Devolvido</span><b id="trvdev"></b></div>
      <div class="vlin"><span>Peças levadas</span><b id="trvnov"></b></div>
      <div class="vlin"><b id="trdiftxt"></b><b id="trdif"></b></div>
      <div id="trpag"></div></div>
    <div class="campo"><label for="trobs">Observações</label><input id="trobs" maxlength="500" placeholder="Ex.: tamanho não serviu"></div>
    <div id="trerr"></div>
    <div class="acoes"><button type="button" class="bt" id="trx">Cancelar</button><button type="button" class="bt pri" id="trok">Registrar troca</button></div>`;

  const totais = () => {
    const d = somaDev(), nv = somaNov(), dif = r2(nv - d);
    $("trvdev").textContent = brl(d); $("trvnov").textContent = brl(nv);
    $("trdiftxt").textContent = dif > 0 ? "A cliente paga" : dif < 0 ? "A loja devolve" : "Sem diferença";
    $("trdif").textContent = brl(Math.abs(dif));
    const modo = dif > 0 ? "pag" : dif < 0 ? "dev" : "";   // só redesenha quando muda de "paga" para "devolve"
    if (modo === TR.pagModo) return;
    TR.pagModo = modo;
    if (modo === "pag") {
      $("trpag").innerHTML = `<div class="vlin"><span>Forma de pagamento</span><span style="display:flex;gap:6px"><select id="trforma" style="width:auto">${Object.entries(FORMAS).map(([k, r]) => `<option value="${k}" ${k === TR.forma ? "selected" : ""}>${r}</option>`).join("")}</select>
        <select id="trparc" style="width:auto">${Array.from({ length: 12 }, (_, x) => x + 1).map(x => `<option value="${x}" ${String(x) === TR.parcelas ? "selected" : ""}>${x}x</option>`).join("")}</select></span></div>`;
      $("trparc").style.display = TR.forma === "credito" ? "" : "none";
      $("trforma").onchange = e => { TR.forma = e.target.value; $("trparc").style.display = TR.forma === "credito" ? "" : "none"; };
      $("trparc").onchange = e => TR.parcelas = e.target.value;
    } else if (modo === "dev") {
      $("trpag").innerHTML = `<div class="vlin"><span>Como a diferença volta para a cliente</span><select id="trdevforma" style="width:auto"><option value="">Escolha…</option>${Object.entries(DEVOLUCAO).map(([k, r]) => `<option value="${k}" ${k === TR.devForma ? "selected" : ""}>${r}</option>`).join("")}</select></div>`;
      $("trdevforma").onchange = e => TR.devForma = e.target.value;
    } else $("trpag").innerHTML = "";
  };
  const linhas = (lista, el, tipo) => {
    $(el).innerHTML = lista.length ? `<div class="tw"><table><thead><tr><th>Peça</th><th class="num">Qtd</th><th class="num">Valor</th><th class="num">Total</th><th></th></tr></thead><tbody>
      ${lista.map((it, i) => `<tr><td><b>${esc(it.ref)}</b> ${esc(it.desc)}<br><span class="mut">${esc(it.var)}${it.max != null ? ` · até ${it.max}` : tipo === "nova" ? ` · ${n(disp(it.vid))} na loja` : ""}</span></td>
        <td class="num"><input data-l="${tipo}" data-i="${i}" data-k="q" type="number" min="1" ${it.max != null ? `max="${it.max}"` : ""} value="${it.q}" style="width:60px"></td>
        <td class="num">${it.fixo ? brl(numV(it.vu)) : `<input data-l="${tipo}" data-i="${i}" data-k="vu" inputmode="decimal" value="${esc(it.vu)}" style="width:90px">`}</td>
        <td class="num" data-tot="${tipo}${i}">${brl(numV(it.vu) * (Number(it.q) || 0))}</td>
        <td><button type="button" class="lnk perigo" data-rm="${tipo}" data-i="${i}">×</button></td></tr>`).join("")}</tbody></table></div>` : "";
    $(el).querySelectorAll("input[data-l]").forEach(inp => inp.oninput = () => {
      const it = (tipo === "dev" ? TR.dev : TR.novas)[inp.dataset.i]; it[inp.dataset.k] = inp.value;
      $(el).querySelector(`[data-tot="${tipo}${inp.dataset.i}"]`).textContent = brl(numV(it.vu) * (Number(it.q) || 0)); totais();
    });
    $(el).querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { (tipo === "dev" ? TR.dev : TR.novas).splice(Number(b.dataset.i), 1); desenhar(); });
  };
  const desenharDevBox = () => {
    f.querySelectorAll("[data-modo]").forEach(b => b.classList.toggle("on", b.dataset.modo === TR.modo));
    if (TR.modo === "venda") {
      $("trdevbox").innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap"><input id="trvnum" inputmode="numeric" placeholder="Número da venda (na boleta / lista de vendas)" style="flex:1;min-width:200px" value="${TR.venda ? TR.venda.venda : ""}">
        <button type="button" class="bt" id="trvbusca">Buscar venda</button></div>
        ${TR.venda ? `<div class="mut" style="margin-top:6px">Venda nº ${TR.venda.venda} de ${dataBR(TR.venda.data)} · ${esc(loja(TR.venda.loja_id).nome)} · ${esc(TR.venda.vendedora)}</div>
          ${TR.venda.itens.map((i, x) => `<div class="vlin"><span><b>${esc(i.referencia)}</b> ${esc(i.descricao)} — ${esc([i.cor, i.tamanho, i.edicao].filter(Boolean).join(" "))} · pago ${brl(i.valor_unitario)} · ${i.trocavel > 0 ? `pode trocar ${i.trocavel}` : "já trocada"}</span>
            ${i.trocavel > 0 ? `<button type="button" class="lnk" data-devv="${x}">Devolver</button>` : ""}</div>`).join("")}` : ""}`;
      $("trvbusca").onclick = async () => {
        try { TR.venda = checar(await sb.rpc("lin_venda_trocavel", { p_venda: Number(soDig($("trvnum").value)) })); TR.dev = [];
          if (!TR.cliente && TR.venda.cliente_id) { if (!cliente(TR.venda.cliente_id)) await carregarClientes(); TR.cliente = cliente(TR.venda.cliente_id) || null; }
          $("trerr").innerHTML = ""; desenhar(); }
        catch (e) { $("trerr").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
      };
      $("trvnum").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("trvbusca").click(); } };
      f.querySelectorAll("[data-devv]").forEach(b => b.onclick = () => {
        const i = TR.venda.itens[b.dataset.devv];
        if (!TR.dev.some(d => d.vid === i.variante_id)) TR.dev.push({ vid: i.variante_id, ref: i.referencia, desc: i.descricao, var: [i.cor, i.tamanho, i.edicao].filter(Boolean).join(" "),
          q: "1", vu: moeda(i.valor_unitario), fixo: true, max: i.trocavel });
        desenhar();
      });
    } else {
      $("trdevbox").innerHTML = `<input id="trdq" type="search" placeholder="Referência, nome ou código de barras da peça devolvida" autocomplete="off"><div id="trdres"></div>`;
      $("trdq").oninput = () => {
        const r = busca($("trdq").value, false);
        $("trdres").innerHTML = r.slice(0, 30).map(([p, v], i) => `<div class="vlin"><span><b>${esc(p.referencia)}</b> ${esc(p.descricao)} — ${esc(nomeVar(v))} · tabela ${brl(precoTab(p, v))}</span><button type="button" class="lnk" data-dadd="${i}">Devolver</button></div>`).join("")
          || ($("trdq").value.trim().length >= 2 ? '<div class="mut">Nenhuma peça encontrada.</div>' : "");
        $("trdres").querySelectorAll("[data-dadd]").forEach(b => b.onclick = () => { const [p, v] = r[b.dataset.dadd];
          TR.dev.push({ vid: v.id, ref: p.referencia, desc: p.descricao, var: nomeVar(v), q: "1", vu: moeda(precoTab(p, v)) }); $("trdq").value = ""; desenhar(); });
      };
    }
  };
  const desenharCliente = () => {
    const c = TR.cliente;
    $("trcli").innerHTML = c ? `<div class="vlin"><span><b>${esc(c.nome)}</b>${c.telefone ? " · " + esc(fone(c.telefone)) : ""}</span><button type="button" class="lnk" id="trctroca">Trocar</button></div>`
      : `<input id="trcq" type="search" placeholder="Nome e/ou telefone (pode digitar junto) ou CPF (opcional)" autocomplete="off"><div id="trcres"></div>`;
    if (c) { $("trctroca").onclick = () => { TR.cliente = null; desenharCliente(); }; return; }
    $("trcq").oninput = () => {
      const t = $("trcq").value.trim();
      const l = t.length < 2 ? [] : buscarClientes(t, 6);
      $("trcres").innerHTML = l.map(x => `<div class="vlin"><span><b>${esc(x.nome)}</b>${x.telefone ? " · " + esc(fone(x.telefone)) : ""}</span><button type="button" class="lnk" data-cli="${x.id}">Escolher</button></div>`).join("")
        + (t.length >= 2 ? `<div class="vlin"><span class="mut">${l.length ? "Não é nenhum desses?" : "Cliente não encontrado."}</span><button type="button" class="lnk" id="trcnovo">+ Novo cliente</button></div>` : "");
      $("trcres").querySelectorAll("[data-cli]").forEach(b => b.onclick = () => { TR.cliente = cliente(b.dataset.cli); desenharCliente(); });
      if ($("trcnovo")) $("trcnovo").onclick = () => editarCliente(clienteDigitado(t), novo => { TR.cliente = novo; desenharCliente(); });
    };
  };
  const desenhar = () => { desenharDevBox(); linhas(TR.dev, "trdev", "dev"); linhas(TR.novas, "trnovas", "nova"); desenharCliente(); totais(); };
  f.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { if (TR.modo === b.dataset.modo) return; TR.modo = b.dataset.modo; TR.dev = []; TR.venda = null; desenhar(); });
  $("trpq").oninput = () => {
    const r = busca($("trpq").value, true);
    $("trres").innerHTML = r.slice(0, 30).map(([p, v], i) => `<div class="vlin"><span><b>${esc(p.referencia)}</b> ${esc(p.descricao)} — ${esc(nomeVar(v))} · ${brl(precoTab(p, v))} · ${n(disp(v.id))} na loja</span><button type="button" class="lnk" data-nadd="${i}">Levar</button></div>`).join("")
      || ($("trpq").value.trim().length >= 2 ? `<div class="mut">Nenhuma peça com estoque em ${esc(loja(TR.loja).nome)}.</div>` : "");
    $("trres").querySelectorAll("[data-nadd]").forEach(b => b.onclick = () => { const [p, v] = r[b.dataset.nadd];
      TR.novas.push({ vid: v.id, ref: p.referencia, desc: p.descricao, var: nomeVar(v), q: "1", vu: moeda(precoTab(p, v)) }); $("trpq").value = ""; $("trres").innerHTML = ""; desenhar(); });
  };
  $("trdata").onchange = e => TR.data = e.target.value;
  $("trloja").onchange = e => { TR.loja = e.target.value; TR.novas = []; desenhar(); };
  if ($("trat")) $("trat").onchange = e => TR.at = e.target.value;
  $("trobs").oninput = e => TR.obs = e.target.value;
  $("trx").onclick = () => $("dlg").close();
  $("trok").onclick = async () => {
    const erro = t => { $("trerr").innerHTML = `<div class="msg err">${esc(t)}</div>`; $("trerr").scrollIntoView({ block: "nearest" }); };
    if (!TR.dev.length) return erro("Informe a peça que a cliente devolve.");
    if (!TR.novas.length) return erro("Informe a peça que a cliente leva.");
    const dif = r2(somaNov() - somaDev());
    $("trok").disabled = true; $("trok").textContent = "Registrando…";
    try {
      const id = checar(await sb.rpc("lin_troca_registrar", { p: { loja_id: TR.loja, atendente_id: TR.at, cliente_id: TR.cliente ? TR.cliente.id : null,
        venda_id: TR.modo === "venda" && TR.venda ? TR.venda.venda : null, data: TR.data, observacao: TR.obs.trim(), devolucao_forma: dif < 0 ? TR.devForma : null,
        devolvidas: TR.dev.map(i => ({ variante_id: i.vid, quantidade: Number(i.q), valor_unitario: numBR(i.vu) || 0 })),
        novas: TR.novas.map(i => ({ variante_id: i.vid, quantidade: Number(i.q), valor_unitario: numBR(i.vu) || 0 })),
        pagamentos: dif > 0 ? [{ forma: TR.forma, valor: dif, parcelas: Number(TR.parcelas) || 1 }] : [] } }));
      $("dlg").close(); await carregar();
      if (VISTA === "vendas") await telaVendas();
      msg("ok", `Troca T${id} registrada; o estoque de ${loja(TR.loja).nome} foi atualizado.`);
    } catch (e) { erro(e.message); $("trok").disabled = false; $("trok").textContent = "Registrar troca"; }
  };
  desenhar();
  $("dlg").showModal();
}

// ---------------------------------------------------------------- clientes e acompanhamento (CRM)
const CANAIS = { whatsapp: "WhatsApp", ligacao: "Ligação", instagram: "Instagram", loja: "Na loja", email: "E-mail", outro: "Outro" };
const RESULTADOS = { sem_resposta: "Não respondeu", conversou: "Conversou", vai_a_loja: "Vai à loja", veio_a_loja: "Veio à loja", comprou: "Comprou", sem_interesse: "Sem interesse agora", outro: "Outro" };
const ORIGENS = ["Instagram", "Indicação", "Passou na loja", "WhatsApp", "Evento", "Site", "Outro"];
const somaDias = (d, k) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + k); return x.toISOString().slice(0, 10); };
const quando = v => v ? new Date(v).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const proxTxt = c => !c.proximo_contato ? "—" : c.proximo_contato < hoje() ? `<b style="color:var(--crit)">${dataBR(c.proximo_contato)} · atrasado</b>`
  : c.proximo_contato === hoje() ? `<b style="color:var(--accent)">hoje</b>` : dataBR(c.proximo_contato);
const sitTag = c => c.situacao === "possivel" ? '<span class="tag possivel">possível cliente</span>' : "";
const comprasDe = id => { const vs = VENDAS.filter(v => v.cliente_id === id); return { n: vs.length, tot: vs.reduce((s, v) => s + Number(v.valor_total), 0), ult: vs.map(v => v.data).sort().pop() }; };

// crm = true na aba Clientes: mostra e grava situação, como conheceu, interesses, responsável e próximo contato
// (o cadastro rápido da venda não manda esses campos e não mexe neles)
function editarCliente(c, depois, crm = false) {
  const f = $("dlg2f"), eu = EU, C = Object.assign({ nome: "", telefone: "", cpf: "", email: "", endereco: "", aniversario_dia: "", aniversario_mes: "", observacoes: "",
    situacao: crm ? "possivel" : "cliente", origem: "", interesses: "", responsavel_id: eu, responsavel_nome: "", proximo_contato: "" }, c || {});
  const resp = VENDEDORAS.some(u => u.user_id === C.responsavel_id) ? "" : `<option value="${C.responsavel_id || ""}" selected>${esc(C.responsavel_nome || (C.responsavel_id === eu ? "Eu" : "—"))}</option>`;
  f.innerHTML = `<h3>${C.id ? "Editar cliente" : "Novo cliente"}</h3>
    ${crm ? `<div class="campo"><label>Situação</label><div class="filtros" style="margin:0">
      <button type="button" class="pilula ${C.situacao === "possivel" ? "on" : ""}" data-sit="possivel">Possível cliente (ainda não comprou)</button>
      <button type="button" class="pilula ${C.situacao === "cliente" ? "on" : ""}" data-sit="cliente">Cliente</button></div></div>` : ""}
    <div class="campo"><label for="cl_nome">Nome</label><input id="cl_nome" value="${esc(C.nome)}"></div>
    <div class="campo grade2"><div><label for="cl_tel">Telefone (com DDD)</label><input id="cl_tel" inputmode="tel" value="${esc(fone(C.telefone))}" placeholder="(21) 99999-9999"></div>
      <div><label for="cl_cpf">CPF</label><input id="cl_cpf" inputmode="numeric" value="${esc(C.cpf || "")}" placeholder="opcional"></div></div>
    <div class="campo grade2"><div><label for="cl_email">E-mail</label><input id="cl_email" type="email" value="${esc(C.email)}"></div>
      <div><label>Aniversário</label><div style="display:flex;gap:6px"><select id="cl_dia" aria-label="Dia"><option value="">Dia</option>${Array.from({ length: 31 }, (_, x) => x + 1).map(x => `<option ${String(x) === String(C.aniversario_dia) ? "selected" : ""}>${x}</option>`).join("")}</select>
        <select id="cl_mes" aria-label="Mês"><option value="">Mês</option>${MESES.map((m, x) => `<option value="${x + 1}" ${String(x + 1) === String(C.aniversario_mes) ? "selected" : ""}>${m}</option>`).join("")}</select></div></div></div>
    <div class="campo"><label for="cl_end">Endereço</label><input id="cl_end" value="${esc(C.endereco)}"></div>
    <div class="campo"><label for="cl_obs">Observações</label><input id="cl_obs" value="${esc(C.observacoes)}" placeholder="Preferências, medidas, como gosta de ser atendida…"></div>
    ${crm ? `<div class="campo grade2"><div><label for="cl_origem">Como conheceu a Linum</label><select id="cl_origem"><option value="">—</option>${ORIGENS.concat(C.origem && !ORIGENS.includes(C.origem) ? [C.origem] : []).map(o => `<option ${o === C.origem ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>
      <div><label for="cl_resp">Quem acompanha</label><select id="cl_resp">${resp}${VENDEDORAS.map(u => `<option value="${u.user_id}" ${u.user_id === C.responsavel_id ? "selected" : ""}>${esc(u.nome)}</option>`).join("")}</select></div></div>
    <div class="campo"><label for="cl_int">Interesses</label><input id="cl_int" value="${esc(C.interesses)}" placeholder="Peças, cores, tamanhos, ocasiões… (ex.: vestidos longos, tamanho M, festa em dezembro)"></div>
    <div class="campo"><label for="cl_prox">Próximo contato</label><input id="cl_prox" type="date" value="${esc(C.proximo_contato || "")}" style="width:auto"></div>` : ""}
    <div id="clerr"></div>
    <div class="acoes"><button type="button" class="bt" id="clx">Cancelar</button><button type="button" class="bt pri" id="clok">Salvar cliente</button></div>`;
  let sit = C.situacao;
  f.querySelectorAll("[data-sit]").forEach(b => b.onclick = () => { sit = b.dataset.sit; f.querySelectorAll("[data-sit]").forEach(x => x.classList.toggle("on", x === b)); });
  $("clx").onclick = () => $("dlg2").close();
  let mesmoAssim = false;
  $("clok").onclick = async () => {
    // cliente novo com o mesmo nome ou telefone de alguém já cadastrado: pergunta antes de criar outro
    const tel = soDig($("cl_tel").value), nm = semAc($("cl_nome").value);
    const parecidos = C.id || mesmoAssim ? [] : CLIENTES.filter(x => (nm.length >= 2 && semAc(x.nome) === nm) || (tel.length >= 8 && x.telefone === tel));
    if (parecidos.length) {
      $("clerr").innerHTML = `<div class="msg info" id="clparecido"><b>Já existe cliente com esse ${parecidos.some(x => tel.length >= 8 && x.telefone === tel) ? "telefone" : "nome"}. É ela?</b>
        ${parecidos.slice(0, 5).map(x => `<div class="vlin"><span><b>${esc(x.nome)}</b>${x.telefone ? " · " + esc(fone(x.telefone)) : ""}${niver(x) ? " · aniversário " + niver(x) : ""}${x.observacoes ? ` · <span class="mut">${esc(x.observacoes)}</span>` : ""}</span>
          <button type="button" class="lnk" data-mesma="${x.id}">É ela: usar este cadastro</button></div>`).join("")}
        <div class="vlin"><span class="mut">Se for outra pessoa, o cadastro novo é criado.</span><button type="button" class="lnk" id="cloutra">É outra pessoa: salvar</button></div></div>`;
      $("clerr").querySelectorAll("[data-mesma]").forEach(b => b.onclick = () => { $("dlg2").close(); if (depois) depois(cliente(b.dataset.mesma)); });
      $("cloutra").onclick = () => { mesmoAssim = true; $("clok").click(); };
      return;
    }
    const p = { id: C.id || null, nome: $("cl_nome").value, telefone: $("cl_tel").value, cpf: $("cl_cpf").value,
      email: $("cl_email").value, endereco: $("cl_end").value, aniversario_dia: $("cl_dia").value, aniversario_mes: $("cl_mes").value, observacoes: $("cl_obs").value };
    if (crm) Object.assign(p, { situacao: sit, origem: $("cl_origem").value, interesses: $("cl_int").value, responsavel_id: $("cl_resp").value, proximo_contato: $("cl_prox").value });
    try {
      const id = checar(await sb.rpc("lin_cliente_salvar", { p }));
      await carregarClientes(); $("dlg2").close();
      if (depois) depois(cliente(id));
    } catch (e) { $("clerr").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  $("dlg2").showModal(); $("cl_nome").focus();
}

// valor da venda no histórico: só para o Dono (o texto gravado não tem o valor; a vendedora não vê o das colegas)
const valorVenda = x => { if (!x.venda_id || x.resultado !== "comprou" || !dono()) return ""; const v = VENDAS.find(y => y.id === x.venda_id);
  return v ? ` <b>· ${brl(v.valor_total)}</b>` : ""; };
// ficha do cliente: dados, compras, histórico de contatos e "Registrar contato"
async function fichaCliente(id) {
  const f = $("dlgf"), c = cliente(id); if (!c) return;
  $("dlg").classList.add("largo");
  let contatos = [];
  try { contatos = await todas(() => sb.from("lin_contatos").select("*").eq("cliente_id", id).order("em", { ascending: false }).order("id", { ascending: false })); }
  catch (e) { msg("err", e.message); return; }
  const cp = comprasDe(id), eu = EU, meuNome = (VENDEDORAS.find(u => u.user_id === eu) || {}).nome || "";
  const wa = c.telefone ? `https://wa.me/55${c.telefone}?text=${encodeURIComponent(`Olá, ${c.nome.split(" ")[0]}! Aqui é ${meuNome ? meuNome.split(" ")[0] + ", " : ""}da Linum. `)}` : "";
  const dados = [c.telefone && fone(c.telefone), c.email, niver(c) && "aniversário " + niver(c), c.origem && "conheceu por " + c.origem].filter(Boolean).map(esc).join(" · ");
  f.innerHTML = `<h3>${esc(c.nome)} ${sitTag(c) || '<span class="tag">cliente</span>'}</h3>
    <div class="mut">${dados || "Sem telefone nem e-mail"}</div>
    ${c.interesses ? `<div style="margin-top:6px"><b>Interesses:</b> ${esc(c.interesses)}</div>` : ""}

function kpisClientes() {

function listaClientes() {
  const t = FC.q.trim(), mes = new Date().getMonth() + 1, h = hoje(), eu = EU;

      <td class="num">${n(cp.n)}${cp.ult ? `<br><span class="mut">últ. ${dataBR(cp.ult)}</span>` : ""}</td><td class="num">${cp.n ? brl(cp.tot) : "—"}</td></tr>`;
  }).join("") : `<tr><td colspan="7" class="mut">${CLIENTES.length ? "Nenhum cliente com esse filtro." : "Nenhum cliente ainda. Eles entram aqui ao registrar a venda ou em “+ Novo cliente”."}</td></tr>`;
  document.querySelectorAll(".crow").forEach(r => r.onclick = () => fichaCliente(r.dataset.c));

// ---------------------------------------------------------------- ranking das vendedoras (mês e ano; todos veem, valores só o Dono e a própria)
const FRK = { tipo: "mes", mes: "", ano: "" };

const estrelas = x => x == null ? "" : `<span class="estrelas" aria-hidden="true">${"★".repeat(Math.round(x))}${"☆".repeat(5 - Math.round(x))}</span>`;
async function telaRanking() {
  FRK.mes = FRK.mes || hoje().slice(0, 7); FRK.ano = FRK.ano || hoje().slice(0, 4);
  const mes = FRK.tipo === "mes";
  const de = mes ? FRK.mes + "-01" : FRK.ano + "-01-01", ate = mes ? new Date(Date.UTC(+FRK.mes.slice(0, 4), +FRK.mes.slice(5, 7), 0)).toISOString().slice(0, 10) : FRK.ano + "-12-31";

  $("tela").innerHTML = `
    <div class="cabtela"><h2>Ranking ${mes ? "do mês" : "do ano"} · ${esc(titulo)}</h2></div>
    <div class="filtros">
      <button type="button" class="pilula ${mes ? "on" : ""}" id="rkmes">Mês</button><button type="button" class="pilula ${mes ? "" : "on"}" id="rkano">Ano</button>
      <button type="button" class="pilula" id="rkant" aria-label="Anterior">‹</button><button type="button" class="pilula" id="rkprox" aria-label="Próximo" ${atual ? "disabled" : ""}>›</button>
    </div>
    <div class="card destaque" id="rklider">${lideres.length ? `<small>${atual ? "Liderando até agora" : mes ? "Vendedora do mês" : "Vendedora do ano"}</small>
      <b>${lideres.map(p => esc(p.nome)).join(" e ")}</b> <span>nota ${notaTxt(lideres[0].final)} ${estrelas(lideres[0].final)}</span>`
      : '<span class="mut">Ninguém da equipe tem vendas, registros ou nota da Dona neste período.</span>'}</div>
    <div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Vendedora</th><th class="num">Nota final</th><th class="num">Vendas</th><th class="num">Cliente na venda</th><th class="num">Acompanhamento</th><th class="num">Nota da Dona</th>${r.dono && mes ? "<th></th>" : ""}</tr></thead><tbody id="rktab">
      ${ps.map(p => `<tr class="rkrow ${p.eu ? "eu" : ""}"><td class="num">${p.posicao ? p.posicao + "º" : "—"}</td><td><b>${esc(p.nome)}</b>${p.eu ? ' <span class="tag">você</span>' : ""}${det(p)}</td>
        <td class="num"><b>${notaTxt(p.final)}</b>${p.final != null && p.criterios < 4 ? `<br><span class="mut">${p.criterios} de 4 critérios</span>` : ""}</td>
        <td class="num">${notaTxt(p.vendas)}</td><td class="num">${notaTxt(p.clientes)}</td><td class="num">${notaTxt(p.crm)}</td><td class="num">${notaTxt(p.dona)}</td>
        ${r.dono && mes ? `<td><button type="button" class="lnk" data-nota="${p.user_id}">${p.dona == null ? "Dar nota" : "Trocar nota"}</button></td>` : ""}</tr>`).join("")
      || '<tr><td colspan="8" class="mut">Ninguém da equipe para classificar (só entra quem tem papel no app e não é Dono).</td></tr>'}

    </div>
    <div class="card"><h2>Por pessoa</h2><div class="tw"><table id="cmtab"><thead><tr><th>Quem vendeu</th><th class="num">Vendas</th><th class="num">Valor pago</th><th>Comissão (%)</th><th class="num">Comissão</th></tr></thead><tbody>
      ${doMesL.length ? doMesL.map(p => `<tr class="cmrow" data-p="${p.id}" style="cursor:pointer"><td><b>${esc(p.nome)}</b></td><td class="num">${n(p.vendas.length)}</td><td class="num">${brl(p.t)}</td><td>${esc(pct(p))}</td><td class="num"><b>${brl(p.c)}</b></td></tr>
        <tr class="cmdet oculto" data-d="${p.id}"><td colspan="5"><div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Loja</th><th class="num">Valor pago</th><th class="num">%</th><th class="num">Comissão</th></tr></thead><tbody>
          ${p.vendas.map(v => `<tr><td>${v.id}</td><td>${dataBR(v.data)}</td><td>${esc(loja(v.loja_id).nome)}</td><td class="num">${brl(v.valor_total)}</td><td class="num">${decBR(Number(v.comissao_pct || 0))}%</td><td class="num">${brl(v.comissao_valor)}</td></tr>`).join("")}
        </tbody></table></div></td></tr>`).join("")
        + `<tr><td><b>Total</b></td><td class="num"><b>${n(doMes.length)}</b></td><td class="num"><b>${brl(totT)}</b></td><td></td><td class="num"><b>${brl(totC)}</b></td></tr>`
      : '<tr><td colspan="5" class="mut">Nenhuma venda neste mês.</td></tr>'}
    </tbody></table></div>
    <div class="mut" style="margin-top:6px">Clique na pessoa para ver as vendas. Comissão = o % da pessoa no dia da venda sobre o valor pago. Vendas canceladas não entram; trocas não mudam a comissão.</div></div>
    <div class="card"><h2>Últimos 12 meses</h2><div class="tw"><table id="cm12"><thead><tr><th>Quem vendeu</th>${meses.map(m => `<th class="num">${mesTxt(m)}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>
      ${lista.length ? lista.map(p => `<tr><td>${esc(p.nome)}</td>${meses.map(m => `<td class="num">${p.meses[m] ? brl(p.meses[m]) : '<span class="mut">—</span>'}</td>`).join("")}<td class="num"><b>${brl(Object.values(p.meses).reduce((s, x) => s + x, 0))}</b></td></tr>`).join("")
        + `<tr><td><b>Total</b></td>${meses.map(m => `<td class="num"><b>${brl(lista.reduce((s, p) => s + (p.meses[m] || 0), 0))}</b></td>`).join("")}<td class="num"><b>${brl(vs.reduce((s, v) => s + Number(v.comissao_valor || 0), 0))}</b></td></tr>`
      : `<tr><td colspan="14" class="mut">Nenhuma venda nos 12 meses até ${mesTxt(FCM.mes)}.</td></tr>`}
    </tbody></table></div></div>`;
  const ir = m => { FCM.mes = m > hoje().slice(0, 7) ? hoje().slice(0, 7) : m; telaComissoes(); };
  $("cmant").onclick = () => ir(somaMes(FCM.mes, -1));
  $("cmprox").onclick = () => ir(somaMes(FCM.mes, 1));
  $("cmmes").onchange = e => { if (e.target.value) ir(e.target.value); };
  $("cmloja").onchange = e => { FCM.loja = e.target.value; telaComissoes(); };
  $("cmimp").onclick = () => { document.querySelectorAll(".cmdet").forEach(r => r.classList.remove("oculto")); window.print(); };
  document.querySelectorAll(".cmrow").forEach(r => r.onclick = () => document.querySelector(`.cmdet[data-d="${r.dataset.p}"]`).classList.toggle("oculto"));
  $("cmcsv").onclick = () => {
    const c = x => `"${String(x).replace(/"/g, '""')}"`, num = x => Number(x || 0).toFixed(2).replace(".", ",");
    const linhas = [["Mês", "Quem vendeu", "Venda nº", "Data", "Loja", "Valor pago", "Comissão %", "Comissão"].map(c).join(";"),
      ...doMesL.flatMap(p => p.vendas.map(v => [mesTxt(FCM.mes), p.nome, v.id, dataBR(v.data), loja(v.loja_id).nome, num(v.valor_total), num(v.comissao_pct), num(v.comissao_valor)].map(c).join(";")))];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" }));
    a.download = `comissoes-linum-${FCM.mes}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}

// ---------------------------------------------------------------- equipe (só a equipe Nervia)
async function telaEquipe() {
  $("tela").innerHTML = '<div class="card">Carregando…</div>';
  try { EQUIPE = checar(await sb.rpc("lin_equipe")) || []; } catch (e) { $("tela").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  const opLoja = sel => `<option value="">—</option>` + LOJAS.map(l => `<option value="${l.id}" ${l.id === sel ? "selected" : ""}>${esc(l.nome)}</option>`).join("");
  $("tela").innerHTML = `<div class="card"><h2>Equipe da Linum</h2>
    <p class="mut">Aparecem aqui os logins com o app <b>Sistema Linum</b> liberado na Área do Cliente (Administração → Logins). Dono: tudo, inclusive preço de custo. Estoque: cadastra peças, altera o preço de venda e movimenta o estoque, sem ver nem alterar custo. Vendedora: consulta o estoque, sem preço de custo. <b>Todos vendem</b>, em qualquer loja (a loja principal vem marcada na venda), e cada um vê só as próprias vendas; o Dono vê as de todos. <b>Comissão (%)</b>: sobre o valor pago de cada venda da pessoa; 0 = sem comissão. Mudar o % não altera as vendas já feitas. <b>Permissões</b> somam ao papel: <b>Produção</b> opera rolos, fichas e etapas; <b>Valores da produção</b> mostra também o valor pago no linho, o preço por peça dos parceiros e o custo das peças (o Dono já tem as duas). Todas as ações ficam na auditoria. Sem papel: o login não entra no app.</p>
    ${EQUIPE.length ? `<div class="tw"><table><thead><tr><th>Login</th><th>Papel</th><th>Loja principal</th><th>Comissão (%)</th><th>Permissões</th><th></th></tr></thead><tbody>
      ${EQUIPE.map((u, i) => `<tr><td><b>${esc(u.nome || u.email)}</b><br><span class="mut">${esc(u.email)}</span></td>
        <td><select data-i="${i}" class="eq-papel"><option value="">Sem papel</option><option value="dono" ${u.papel === "dono" ? "selected" : ""}>Dono</option><option value="estoque" ${u.papel === "estoque" ? "selected" : ""}>Estoque</option><option value="vendedora" ${u.papel === "vendedora" ? "selected" : ""}>Vendedora</option></select></td>
        <td><select data-i="${i}" class="eq-loja">${opLoja(u.loja_id)}</select></td>
        <td><input data-i="${i}" class="eq-comissao" inputmode="decimal" value="${esc(u.comissao_pct != null ? decBR(Number(u.comissao_pct)) : "0")}" style="width:80px" aria-label="Comissão em %"></td>
        <td>${u.papel === "dono" ? '<span class="mut">todas</span>' : `<label class="chk"><input type="checkbox" class="eq-prod" data-i="${i}" ${(u.permissoes || []).includes("producao") ? "checked" : ""}> Produção</label>
          <label class="chk"><input type="checkbox" class="eq-val" data-i="${i}" ${(u.permissoes || []).includes("producao_valores") ? "checked" : ""}> Valores da produção</label>`}</td>
        <td><button class="bt pri eq-salvar" data-i="${i}">Salvar</button></td></tr>`).join("")}
      </tbody></table></div>` : '<div class="vazio">Nenhum login com o app liberado ainda.</div>'}</div>`;
  document.querySelectorAll(".eq-salvar").forEach(b => b.onclick = async () => {
    const i = b.dataset.i, u = EQUIPE[i];
    const papel = document.querySelector(`.eq-papel[data-i="${i}"]`).value, lj = document.querySelector(`.eq-loja[data-i="${i}"]`).value || null;
    const cm = numBR(document.querySelector(`.eq-comissao[data-i="${i}"]`).value) || 0;
    b.disabled = true;
    const prod = document.querySelector(`.eq-prod[data-i="${i}"]`), val = document.querySelector(`.eq-val[data-i="${i}"]`);
    const perms = [prod && prod.checked ? "producao" : "", val && val.checked ? "producao_valores" : ""].filter(Boolean);
    try {
      checar(await sb.rpc("lin_membro_salvar", { p_user: u.user_id, p_papel: papel, p_loja: lj, p_comissao: Number(cm) }));
      if (papel && papel !== "dono" && prod && perms.join() !== [...(u.permissoes || [])].sort().join()) checar(await sb.rpc("lin_membro_permissoes", { p_user: u.user_id, p_permissoes: perms }));
      msg("ok", `Papel de ${u.nome || u.email} salvo.`); await telaEquipe();
    }
    catch (e) { msg("err", e.message); b.disabled = false; }
  });
}

$("dlg").addEventListener("close", () => { if (VISTA === "produtos" && $("plista")) listaProdutos(); });
iniciar();
