<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contratos | Nervia</title>
<script src="/config.js"></script>
<script src="/versoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="arquivos.js"></script>
<link rel="stylesheet" href="/fichario.css">
<style>
/* Contratos (app "contratos", tabelas ctr_): contratos de prestação de serviço da Nervia, do Word ao recebimento.
   Só a equipe Nervia (admin). A tela só lê as tabelas; toda gravação é por função (ctr_*) e vai para a auditoria.
   O Word é preenchido no navegador (arquivos.js) a partir do modelo de mala direta guardado no bucket ctr-arquivos. */
[hidden]{display:none!important}
:root{--bg:#f4f7f9;--surface:#fff;--surface-2:#eaf1f4;--border:#dde6ec;--line:#dde6ec;--ink:#0f1b2d;--ink-soft:#4f5f73;--muted:#6b7a8c;
  --accent:#107d9a;--accent-soft:#e1f1f5;--ok:#1d7a46;--ok-soft:#e2f4e9;--warn:#9a5b00;--warn-soft:#fbebd2;--crit:#b3261e;--crit-soft:#f9e0de;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 48px}
.topo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.marca{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.04em}
.topo b{font-size:16px}.topo span{color:var(--muted);font-size:12.5px}
.embutido .topo{display:none}
h1{font-size:20px;margin:6px 0 4px}h2{font-size:15px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.painel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:21px;margin-top:4px}
.kpi .h{color:var(--muted);font-size:12px}
.kpi.alerta .v{color:var(--crit)}.kpi.atencao .v{color:var(--warn)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font-size:12px;color:var(--ink-soft);font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=search],select,textarea{background:#fff;border:1px solid #c5d2db;border-radius:8px;padding:7px 9px;min-height:36px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;border:1px solid transparent;font-weight:600;cursor:pointer;min-height:34px;background:var(--accent);color:#fff;white-space:nowrap}
.btn.sec{background:#fff;border-color:#c5d2db;color:var(--ink-soft)}
.btn.sec:hover{background:var(--surface-2)}
.btn.perigo{background:var(--crit-soft);color:var(--crit)}
.btn.lnk{background:none;border:0;padding:2px 4px;min-height:0;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:12.5px;font-weight:600;color:var(--ok)}.msg.erro{color:var(--crit)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.tab td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.tab td.n,.tab th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.tab tr.clica{cursor:pointer}.tab tr.clica:hover td{background:var(--surface-2)}
.tab tfoot td{font-weight:700;border-top:2px solid var(--border)}
.rolar{overflow:auto;max-height:70vh}
.rolar thead th{position:sticky;top:0;z-index:1}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-soft)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.atencao{background:var(--warn-soft);color:var(--warn)}.pill.alerta{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.mut{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono)}
.aviso{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500;margin-bottom:12px}
.etapas{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}
.etapas span{padding:4px 10px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600}
.etapas span.feito{background:var(--accent-soft);color:var(--accent)}.etapas span.atual{background:var(--accent);color:#fff}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form .dois{grid-column:span 2}.form .tudo{grid-column:1/-1}
dialog{border:0;border-radius:14px;padding:18px;width:min(980px,calc(100% - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink)}
dialog.peq{width:min(520px,calc(100% - 24px))}
dialog::backdrop{background:#0008}
.dlgtopo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.fechar{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.lista-ev{list-style:none;margin:0;padding:0;font-size:13px}
.lista-ev li{padding:5px 0;border-bottom:1px dashed var(--border)}
.escolha{max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:8px}
.escolha label{display:grid;grid-template-columns:22px 70px minmax(0,1fr) 110px 90px;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer}
.escolha label:hover{background:var(--surface-2)}
.sug{font-size:12.5px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 6px 24px #0004}
@media (max-width:860px){.grade2{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .dois{grid-column:auto}.escolha label{grid-template-columns:22px 60px minmax(0,1fr) 90px}.escolha label .opc{display:none}}
@media print{.barra,.filtros,.acoes,button{display:none!important}body{background:#fff}.painel{border:0;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><div class="marca">CT</div><div><b>Contratos</b><br><span>Contratos de prestação de serviço da Nervia: do Word ao recebimento</span><br><span data-versao="contratos"></span></div></div>
  <div id="aviso" class="painel">Carregando…</div>
  <div id="app" hidden>
    <div class="barra fichario">
      <div class="orelhas">
        <button class="aba on" data-v="painel" title="Painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Painel</span></button>
        <button class="aba" data-v="cobrancas" title="Cobranças"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Cobranças</span></button>
        <button class="aba" data-v="contratos" title="Contratos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg><span>Contratos</span></button>
        <button class="aba" data-v="clientes" title="Clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 21V5l8-2v18M12 7l8 3v11M3 21h18"/></svg><span>Clientes</span></button>
        <button class="aba" data-v="extrato" title="Extrato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m15 17 2 2 4-4"/></svg><span>Extrato</span></button>
        <button class="aba" data-v="config" title="Configuração"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Configuração</span></button>
      </div>
      <div class="ficha"></div>
    </div>
    <div id="conteudo"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>
<dialog id="dlg2" class="peq"></dialog>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "value") n.value = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const A = window.CTR_ARQ;
const CFG = window.NERVIA_CONFIG || {};
const EMBUTIDO = window.self !== window.top;
if (EMBUTIDO) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const checar = r => { if (r.error) throw r.error; return r.data; };
async function todos(mk) { const out = []; for (let i = 0; ; i += 1000) { const d = checar(await mk().range(i, i + 999)); out.push(...d); if (d.length < 1000) return out; } }
const rpc = async (f, args) => checar(await sb.rpc(f, args));

const hoje = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());
const R = v => "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const N = v => Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const br = A.dataBR;
const semAc = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmtDoc = d => !d ? "" : d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5") : d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
const compLabel = c => c.endsWith("/13") ? "extra " + c.slice(0, 4) : c.slice(5, 7) + "/" + c.slice(0, 4);
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const erroTxt = e => { if (e && e.mostrado) e = e.erro; return (e && (e.message || e.error_description)) || String(e); };
function baixar(nome, dados, tipo) {
  const url = URL.createObjectURL(dados instanceof Blob ? dados : new Blob([dados], { type: tipo }));
  const a = el("a", { href: url, download: nome }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function csv(nome, cab, linhas) {
  const q = v => { const s = v == null ? "" : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  baixar(nome, "﻿" + [cab, ...linhas].map(l => l.map(q).join(";")).join("\r\n"), "text/csv;charset=utf-8");
}

// UF → "Estado do/da/de …" (para montar o foro do cliente)
const UF_ESTADO = { AC: "do Acre", AL: "de Alagoas", AP: "do Amapá", AM: "do Amazonas", BA: "da Bahia", CE: "do Ceará", DF: "do Distrito Federal", ES: "do Espírito Santo",
  GO: "de Goiás", MA: "do Maranhão", MT: "de Mato Grosso", MS: "de Mato Grosso do Sul", MG: "de Minas Gerais", PA: "do Pará", PB: "da Paraíba", PR: "do Paraná",
  PE: "de Pernambuco", PI: "do Piauí", RJ: "do Rio de Janeiro", RN: "do Rio Grande do Norte", RS: "do Rio Grande do Sul", RO: "de Rondônia", RR: "de Roraima",
  SC: "de Santa Catarina", SP: "de São Paulo", SE: "de Sergipe", TO: "do Tocantins" };
const SIT_COB = { a_vencer: ["A vencer", "info"], atrasada: ["Atrasada", "alerta"], paga: ["Paga", "ok"], paga_atraso: ["Paga com atraso", "atencao"], diferenca: ["Diferença", "atencao"] };
const SIT_NF = { emitida: ["NF emitida", "ok"], pendente: ["NF a emitir", ""], atrasada: ["NF atrasada", "alerta"] };
const SIT_K = { rascunho: ["Rascunho", ""], gerado: ["Gerado", "info"], enviado: ["Enviado p/ assinatura", "atencao"], assinado: ["Assinado", "ok"], encerrado: ["Encerrado", ""], rescindido: ["Rescindido", "alerta"] };
const pill = (m, k) => { const [t, c] = m[k] || [k, ""]; return el("span", { class: "pill " + c }, t); };

const S = { cfg: {}, impostos: [], clientes: new Map(), contratos: new Map(), modelos: [], eventos: [], cob: [], extrato: [], imps: [],
  view: "painel", sel: new Set(), selK: new Set(),
  fp: { ano: hoje().slice(0, 4) },
  fc: { ano: hoje().slice(0, 4), mes: "", cli: "", sit: "", nf: "", q: "" },
  fk: { sit: "andamento", cli: "" }, fe: { sit: "pendentes" } };

async function carregar() {
  const [cfg, imp, cli, mod, kon, ev, cob, ext, imps] = await Promise.all([
    sb.from("ctr_config").select("*").maybeSingle().then(checar),
    todos(() => sb.from("ctr_impostos").select("*").order("vale_desde")),
    todos(() => sb.from("ctr_clientes").select("*").order("apelido")),
    todos(() => sb.from("ctr_modelos").select("*").order("id")),
    todos(() => sb.from("ctr_contratos").select("*").order("id")),
    todos(() => sb.from("ctr_eventos").select("*").order("id")),
    todos(() => sb.from("ctr_cobrancas_v").select("*").order("id")),
    todos(() => sb.from("ctr_extrato").select("*").order("data", { ascending: false })),
    todos(() => sb.from("ctr_importacoes").select("*").order("id", { ascending: false }))]);
  S.cfg = cfg || {}; S.impostos = imp; S.modelos = mod; S.eventos = ev; S.cob = cob; S.extrato = ext; S.imps = imps;
  S.clientes = new Map(cli.map(c => [c.id, c])); S.contratos = new Map(kon.map(k => [k.id, k]));
  for (const id of [...S.sel]) if (!S.cob.some(c => c.id === id)) S.sel.delete(id);
}
const cliNome = id => (S.clientes.get(id) || {}).apelido || "?";
const kNome = k => cliNome(k.cliente_id) + " · " + br(k.inicio) + (k.fim ? " a " + br(k.fim) : " (indeterminado)");
const aliquota = d => { let p = 0; for (const i of S.impostos) if (i.vale_desde <= d) p = Number(i.pct); return p; };

// ---------------------------------------------------------------- navegação
document.querySelector(".orelhas").addEventListener("click", e => { const b = e.target.closest(".aba"); if (b) ir(b.dataset.v); });
function ir(v) { S.view = v; for (const b of document.querySelectorAll(".orelhas .aba")) b.classList.toggle("on", b.dataset.v === v); render(); }
function render() {
  const c = $("#conteudo"); c.replaceChildren();
  ({ painel: vPainel, cobrancas: vCobrancas, contratos: vContratos, clientes: vClientes, extrato: vExtrato, config: vConfig })[S.view](c);
}
let toastT;
function toast(txt) { const t = $("#toast"); t.textContent = txt; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5000); }
async function salvar(fn, msgEl, okTxt) {
  try { if (msgEl) { msgEl.className = "msg"; msgEl.textContent = "Gravando…"; } const r = await fn(); await carregar(); render();
    if (msgEl && msgEl.isConnected) msgEl.textContent = typeof okTxt === "function" ? okTxt(r) : okTxt || "Gravado."; else toast(typeof okTxt === "function" ? okTxt(r) : okTxt || "Gravado."); return r; }
  catch (e) { if (msgEl && msgEl.isConnected) { msgEl.className = "msg erro"; msgEl.textContent = erroTxt(e); } else alert(erroTxt(e)); throw { mostrado: true, erro: e }; }
}
// erro já mostrado na tela: interrompe quem chamou (não fecha a janela nem segue) sem virar erro solto no console
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.mostrado) e.preventDefault(); });
function dialogo(titulo, corpo, { peq = false } = {}) {
  const d = peq ? $("#dlg2") : $("#dlg");
  d.replaceChildren(el("div", { class: "dlgtopo" }, el("h2", {}, titulo), el("button", { class: "fechar", type: "button", "aria-label": "Fechar", onclick: () => d.close() }, "×")), corpo);
  if (!d.open) d.showModal();
  return d;
}
const campo = (rot, inp, cls) => el("div", { class: "campo " + (cls || "") }, el("label", {}, rot), inp);
const sel = (opcoes, valor, attrs = {}) => { const s = el("select", attrs); for (const [v, t] of opcoes) s.append(el("option", { value: v, selected: String(v) === String(valor) }, t)); return s; };
function pedir(titulo, rotulo, { obrigatorio = 5, valor = "" } = {}) {
  return new Promise(res => {
    const t = el("textarea", { value: valor }), m = el("span", { class: "msg erro" });
    const d = dialogo(titulo, el("div", {}, campo(rotulo, t), el("div", { class: "acoes", style: "margin-top:10px" },
      el("button", { class: "btn", type: "button", onclick: () => { const v = t.value.trim(); if (v.length < obrigatorio) { m.textContent = "Escreva pelo menos " + obrigatorio + " letras."; return; } d.close(); res(v); } }, "Confirmar"),
      el("button", { class: "btn sec", type: "button", onclick: () => { d.close(); res(null); } }, "Cancelar"), m)), { peq: true });
    d.addEventListener("close", () => res(null), { once: true });
  });
}

// ---------------------------------------------------------------- Painel
function vPainel(c) {
  const anos = [...new Set(S.cob.map(x => x.competencia.slice(0, 4)).concat(hoje().slice(0, 4)))].sort().reverse();
  const ano = S.fp.ano, doAno = S.cob.filter(x => x.competencia.startsWith(ano + "/"));
  const soma = (l, f) => l.reduce((s, x) => s + Number(f(x) || 0), 0);
  const atras = S.cob.filter(x => x.situacao === "atrasada"), aVencer = doAno.filter(x => x.situacao === "a_vencer");
  const mesAtual = hoje().slice(0, 7).replace("-", "/");
  const nfPend = S.cob.filter(x => x.nf_situacao !== "emitida" && !x.pago_em && x.competencia.replace(/\/13$/, "/12") <= mesAtual);
  const semAss = [...S.contratos.values()].filter(k => ["gerado", "enviado"].includes(k.situacao));
  const lim = addDias(hoje(), 60);
