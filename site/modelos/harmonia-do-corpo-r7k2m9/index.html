<!DOCTYPE html>
<!-- Apresentação da proposta da Harmonia do Corpo (pedido do Marco em 11/11/2026: a proposta tem de mostrar como vão ficar
     o site E o aplicativo). Abas: Site (site.html) e Aplicativo (app.html); botão Computador/Celular muda a largura.
     Endereço com sufixo aleatório, fora dos buscadores; aberta dentro da página da proposta (/proposta/#…). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Harmonia do Corpo — apresentação (modelo para aprovação)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#12232B;background:#EEF2F3;display:flex;flex-direction:column}
.barra{background:#fff;border-bottom:1px solid #DDE5E8;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.abas{display:flex;gap:6px;flex-wrap:wrap}
.abas button,.tam button{min-height:44px;padding:0 16px;border:1px solid #C8D5DA;border-radius:10px;background:#fff;color:#2C3F46;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.abas button[aria-pressed="true"]{background:#0B6F78;border-color:#0B6F78;color:#fff}
.tam{display:flex;gap:6px;margin-left:auto}
.tam button{font-size:14px;padding:0 12px}
.tam button[aria-pressed="true"]{background:#DFF1F2;border-color:#0B6F78;color:#084E55}
.dica{width:100%;font-size:13px;color:#56696F}
.palco{flex:1;min-height:0;display:flex;justify-content:center;padding:12px}
iframe{width:100%;height:100%;min-height:640px;border:1px solid #C8D5DA;border-radius:12px;background:#fff;transition:max-width .2s}
.celular iframe{max-width:390px;border-radius:28px;border-width:8px;border-color:#12232B}
a.cheia{font-size:14px;font-weight:600;color:#0B6F78}
</style>
</head>
<body>
<div class="barra">
  <div class="abas" role="group" aria-label="O que ver">
    <button type="button" data-ver="site" aria-pressed="true">Site</button>
    <button type="button" data-ver="app" aria-pressed="false">Aplicativo (Nervia Studio)</button>
  </div>
  <div class="tam" role="group" aria-label="Tamanho da tela">
    <button type="button" data-tam="pc" aria-pressed="true">Computador</button>
    <button type="button" data-tam="cel" aria-pressed="false">Celular</button>
  </div>
  <a class="cheia" id="cheia" href="site.html" target="_blank" rel="noopener">Abrir em tela cheia ↗</a>
  <div class="dica" id="dica"></div>
</div>
<div class="palco" id="palco"><iframe id="quadro" title="Modelo" src="site.html"></iframe></div>
<script>
(function () {
  var PAG = { site: ["site.html", "Site público do studio: os visitantes conhecem os serviços e agendam a aula (o agendamento já funciona no modelo)."],
    app: ["app.html", "Aplicativo do studio dentro da Área do Cliente Nervia: agenda, pedidos que chegam do site, alunos, mensalidades e edição do próprio site."] };
  var ver = location.hash === "#app" ? "app" : "site", tam = "pc";
  function mostrar() {
    document.getElementById("quadro").src = PAG[ver][0];
    document.getElementById("cheia").href = PAG[ver][0];
    document.getElementById("dica").textContent = PAG[ver][1];
    document.getElementById("palco").className = "palco" + (tam === "cel" ? " celular" : "");
    document.querySelectorAll("[data-ver]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-ver") === ver); });
    document.querySelectorAll("[data-tam]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-tam") === tam); });
  }
  document.querySelector(".abas").addEventListener("click", function (e) { var b = e.target.closest("[data-ver]"); if (b) { ver = b.getAttribute("data-ver"); history.replaceState(null, "", "#" + ver); mostrar(); } });
  document.querySelector(".tam").addEventListener("click", function (e) { var b = e.target.closest("[data-tam]"); if (b) { tam = b.getAttribute("data-tam"); mostrar(); } });
  mostrar();
})();
</script>
<script src="/marca-dagua.js" data-tipo="modelo"></script>
</body>
</html>
