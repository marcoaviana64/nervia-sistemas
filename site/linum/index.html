<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINUM · 100% linho feito à mão</title>
<meta name="description" content="LINUM: roupas 100% linho feitas à mão. Lojas em Ipanema e na Gávea.">
<meta name="theme-color" content="#cfb3aa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@600;700&family=Allura&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Página de links da LINUM (pedido do Marco em 28/10/2026): é para onde levam os QR codes da Linum (vitrine,
   sacola, cartão…). Visual igual ao da página da LINUM no Trakto (fundo rosé, foto da coleção, botões com subtítulo).
   Cada QR tem a origem no endereço (/linum/?o=ipanema) e cada abertura e cada toque num botão são contados pelo
   /acesso.js (tabela site_acessos, páginas /linum/ e /linum/clique/<botão>). Links, foto e logo no bloco LINUM. */
:root{--bg:#cfb3aa;--bg2:#c6a89f;--card:rgba(255,255,255,.34);--card-b:rgba(255,255,255,.5);--ink:#352d29;--soft:#5a4d47;--line:rgba(53,45,41,.16);--accent:#4a3f3a;--accent-ink:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.pagina{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr;align-items:start}
.foto{display:none;position:relative}
.foto img{display:block;width:100%;height:56vh;max-height:520px;object-fit:cover;object-position:50% 8%}
.foto::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(180deg,transparent,var(--bg))}
.tem-foto .foto{display:block}
main{max-width:460px;width:100%;margin:0 auto;text-align:center;
  padding:max(30px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.tem-foto main{padding-top:6px}
@media (min-width:860px){
  .tem-foto .pagina{grid-template-columns:1fr 1fr;min-height:100vh;align-items:center}
  .tem-foto .foto{order:2;align-self:stretch;position:sticky;top:0;height:100vh}
  .tem-foto .foto img{height:100vh;max-height:none;object-position:50% 15%}
  .foto::after{display:none}
  .tem-foto main{padding-top:40px}
}
.marca{margin:14px 0 0;line-height:1}
.marca img{max-width:260px;width:70%;height:auto}
.marca span{font-family:"Josefin Sans",Inter,sans-serif;font-weight:700;font-size:64px;letter-spacing:.04em;color:#3a3330}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;letter-spacing:.06em;color:var(--soft);margin:2px 0 22px}
.intro{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.45;color:var(--ink);margin:0 0 14px}
.conecte{font-family:Allura,"Cormorant Garamond",cursive;font-size:36px;color:var(--ink);margin:0 0 18px;line-height:1.1}
.botoes{display:flex;flex-direction:column;gap:12px;margin:0 0 28px}
.botoes a{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;border-radius:18px;text-align:left;
  background:var(--card);border:1px solid var(--card-b);color:var(--ink);text-decoration:none;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .08s ease,background .15s ease}
.botoes a:active{transform:scale(.985)}
.botoes a:hover{background:rgba(255,255,255,.45)}
.botoes .ic{width:40px;height:40px;flex:none;display:grid;place-items:center}
.botoes svg{width:30px;height:30px}
.botoes .tx{flex:1;min-width:0}
.botoes .tx b{display:block;font-family:"Josefin Sans",Inter,sans-serif;font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.botoes .tx small{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;color:var(--soft)}
.botoes .seta{font-size:22px;color:var(--soft);flex:none}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:26px;margin:8px 0 10px}
.lojas{display:grid;gap:10px;text-align:left;margin-bottom:24px}
.loja{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:14px 16px}
.loja b{display:block;font-size:16px}
.loja span{color:var(--soft);font-size:14.5px}
.loja a{display:inline-block;margin-top:6px;color:var(--accent);font-weight:600;font-size:14.5px}
.vazio{color:var(--soft);font-style:italic}
.cad{background:rgba(255,255,255,.42);border:1px solid var(--card-b);border-radius:20px;padding:20px 16px;text-align:left;margin:0 0 26px}
.cad h2{text-align:center;margin-top:0}
.cad p.int{color:var(--soft);font-size:14.5px;margin:-4px 0 12px;text-align:center}
.cad label{display:block;font-size:13.5px;font-weight:600;margin:10px 0 4px}
.cad input[type=text],.cad input[type=tel],.cad select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fffaf8;color:var(--ink)}
.cad .niver{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.cad .aceite{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13.5px;color:var(--soft);margin-top:14px}
.cad .aceite input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.cad button{width:100%;margin-top:14px;min-height:50px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:"Josefin Sans",Inter,sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:15px;cursor:pointer}
.cad button:disabled{opacity:.6}
.cad .msg{margin-top:12px;font-size:14.5px;text-align:center}
.cad .msg.err{color:#8e2b1d}.cad .msg.ok{color:#2e5b34;font-weight:600}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:24px;font-size:12px;color:var(--soft)}
footer a{color:var(--soft)}
</style>
</head>
<body>
<div class="pagina">
<div class="foto" id="foto"></div>
<main>
  <h1 class="marca" id="marca"><span>LINUM</span></h1>
  <p class="sub">roupas de linho</p>
  <p class="intro">Peças feitas à mão em puro linho.<br>Uma a uma, com arte e com essência.</p>
  <p class="intro">Bem-vinda ao nosso universo.</p>
  <p class="conecte">Conecte com a gente</p>
  <nav class="botoes" id="botoes" aria-label="Contatos da LINUM"></nav>
  <section class="cad" id="cad">
    <h2>Receba novidades</h2>
    <p class="int">Coleções novas, peças especiais e convites da LINUM no seu WhatsApp.</p>
    <form id="fcad" novalidate>
      <label for="cnome">Nome</label><input id="cnome" type="text" autocomplete="name" maxlength="80" required>
      <label for="ctel">WhatsApp com DDD</label><input id="ctel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" maxlength="20" required>
      <label>Aniversário (opcional)</label>
      <div class="niver"><select id="cdia" aria-label="Dia"><option value="">Dia</option></select><select id="cmes" aria-label="Mês"><option value="">Mês</option></select></div>
      <div class="hp" aria-hidden="true"><label for="csite">Não preencha</label><input id="csite" type="text" tabindex="-1" autocomplete="off"></div>
      <label class="aceite"><input id="caceite" type="checkbox"> <span>Autorizo a LINUM a guardar meu nome, WhatsApp e aniversário e a me enviar novidades pelo WhatsApp. Para sair, é só pedir por lá.</span></label>
      <button type="submit" id="cenviar">Quero receber</button>
      <div class="msg" id="cmsg" role="status"></div>
    </form>
  </section>
  <section id="secLojas" hidden><h2>Nossas lojas</h2><div class="lojas" id="lojas"></div></section>
  <footer>LINUM · Rio de Janeiro · <a href="/privacidade.html">Privacidade</a></footer>
</main>
</div>
<script>
// ===== LINKS DA LINUM (preencher com os do Trakto; link vazio = o botão não aparece) =====
const LINUM = {
  foto: "",   // ex.: "/linum/foto.jpg" (foto da coleção, como no Trakto); vazio = sem foto
  logo: "",   // ex.: "/linum/logo.png" (logo LINUM); vazio = nome escrito
  botoes: [
    { id: "instagram", texto: "Instagram", sub: "Acompanhe nosso dia a dia",  url: "https://www.instagram.com/linumipanema" },
    { id: "facebook",  texto: "Facebook",  sub: "Novidades e inspirações",    url: "https://www.facebook.com/linummm" },
    { id: "whatsapp",  texto: "WhatsApp",  sub: "Fale conosco",               url: "https://wa.me/5521974374263" },
    { id: "site",      texto: "Site",      sub: "Conheça a coleção",          url: "" },
  ],
  lojas: [
    { nome: "Ipanema", endereco: "", mapa: "" },
    { nome: "Gávea",   endereco: "", mapa: "" },
  ],
};
// =========================================================================================
const ICONES = {
  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1.1 2.7 11.5 11.5 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3Z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.9.3-1.5 1.6-1.5h1.7V4.4c-.3 0-1.3-.1-2.5-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.5V14h2.7v8h3.3Z"/></svg>',
  site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const seguro = u => /^https:\/\//i.test(u || "") ? u : "";
const ORIGEM = (new URLSearchParams(location.search).get("o") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 30);
const ONDE = { ipanema: "da vitrine de Ipanema", gavea: "da vitrine da Gávea", sacola: "da sacola", cartao: "do cartão", etiqueta: "da etiqueta da peça" }[ORIGEM] || "";
// WhatsApp já com a mensagem dizendo de onde a pessoa veio (a vendedora sabe na hora)
const urlBotao = b => {
  if (b.id !== "whatsapp") return b.url;
  if (/[?&]text=/.test(b.url)) return b.url;
  return b.url + (b.url.includes("?") ? "&" : "?") + "text=" + encodeURIComponent(`Olá! Vim pelo QR code${ONDE ? " " + ONDE : ""} 😊`);
};
const botoes = LINUM.botoes.filter(b => seguro(b.url)).map(b => ({ ...b, url: urlBotao(b) }));
document.getElementById("botoes").innerHTML = botoes.length
  ? botoes.map(b => `<a href="${esc(b.url)}" target="_blank" rel="noopener" data-clique="${esc(b.id)}"><span class="ic">${ICONES[b.id] || ""}</span>
      <span class="tx"><b>${esc(b.texto)}</b>${b.sub ? `<small>${esc(b.sub)}</small>` : ""}</span><span class="seta" aria-hidden="true">›</span></a>`).join("")
  : '<p class="vazio">Em breve.</p>';
if (LINUM.foto) { document.body.classList.add("tem-foto"); document.getElementById("foto").innerHTML = `<img src="${esc(LINUM.foto)}" alt="Coleção LINUM" fetchpriority="high">`; }
if (LINUM.logo) document.getElementById("marca").innerHTML = `<img src="${esc(LINUM.logo)}" alt="LINUM">`;
const lojas = LINUM.lojas.filter(l => l.endereco);
if (lojas.length) {
  document.getElementById("secLojas").hidden = false;
  document.getElementById("lojas").innerHTML = lojas.map(l => `<div class="loja"><b>${esc(l.nome)}</b><span>${esc(l.endereco)}</span>
    ${seguro(l.mapa) ? `<br><a href="${esc(l.mapa)}" target="_blank" rel="noopener" data-clique="mapa-${esc(l.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""))}">Ver no mapa →</a>` : ""}</div>`).join("");
}
// ===== cadastro: vira "possível cliente" no CRM do Sistema Linum (rpc lin_qr_cadastrar, sem login) =====
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
document.getElementById("cdia").insertAdjacentHTML("beforeend", Array.from({ length: 31 }, (_, i) => `<option>${i + 1}</option>`).join(""));
document.getElementById("cmes").insertAdjacentHTML("beforeend", MESES.map((m, i) => `<option value="${i + 1}">${m}</option>`).join(""));
document.getElementById("fcad").addEventListener("submit", async e => {
  e.preventDefault();
  const $ = id => document.getElementById(id), msg = $("cmsg"), bt = $("cenviar");
  const erro = t => { msg.className = "msg err"; msg.textContent = t; };
  const nome = $("cnome").value.trim(), tel = $("ctel").value.replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "");
  if (nome.length < 2) return erro("Informe o seu nome.");
  if (!/^[1-9]\d{9,10}$/.test(tel)) return erro("Informe o WhatsApp com DDD, ex.: (21) 99999-9999.");
  if (!!$("cdia").value !== !!$("cmes").value) return erro("Para o aniversário, escolha o dia e o mês.");
  if (!$("caceite").checked) return erro("Marque a autorização para podermos falar com você.");
  bt.disabled = true; bt.textContent = "Enviando…"; msg.textContent = "";
  try {
    const C = window.NERVIA_CONFIG;
    const r = await fetch(`${C.SUPABASE_URL}/rest/v1/rpc/lin_qr_cadastrar`, { method: "POST",
      headers: { apikey: C.SUPABASE_ANON_KEY, "content-type": "application/json" },
      body: JSON.stringify({ p: { nome, telefone: tel, aniversario_dia: $("cdia").value, aniversario_mes: $("cmes").value,
        origem: ORIGEM, aceite: true, site: $("csite").value } }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || "Não foi possível enviar agora. Tente de novo em instantes."); }
    $("fcad").innerHTML = `<p class="msg ok">Obrigada, ${esc(nome.split(" ")[0])}! Em breve a LINUM fala com você pelo WhatsApp.</p>`;
    if (window.NERVIA_REGISTRAR) window.NERVIA_REGISTRAR("/linum/clique/cadastro");
  } catch (err) { erro(err.message); bt.disabled = false; bt.textContent = "Quero receber"; }
});
// cada toque num botão conta como /linum/clique/<botão>, com a origem do QR (acesso.js)
document.addEventListener("click", e => {
  const a = e.target.closest("[data-clique]");
  if (a && window.NERVIA_REGISTRAR) window.NERVIA_REGISTRAR("/linum/clique/" + a.dataset.clique);
});
</script>
<script src="/config.js"></script>
<script src="/acesso.js" defer></script>
</body>
</html>
