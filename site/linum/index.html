<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINUM · 100% linho feito à mão</title>
<meta name="description" content="LINUM: roupas 100% linho feitas à mão. Lojas em Ipanema e na Gávea.">
<meta name="theme-color" content="#f4efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Página de links da LINUM (pedido do Marco em 28/10/2026): é para onde levam os QR codes da Linum (vitrine,
   sacola, cartão…). Cada QR tem a origem no endereço (/linum/?o=ipanema) e cada abertura e cada toque num botão
   são contados pelo /acesso.js (tabela site_acessos, páginas /linum/ e /linum/clique/<botão>).
   Os links ficam no bloco LINUM, no fim do arquivo. */
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#2b2622;--soft:#6f6458;--line:#e4dccf;--accent:#5b4a6b;--accent-ink:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
  padding:max(28px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
main{max-width:460px;margin:0 auto;text-align:center}
.marca{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:52px;letter-spacing:.32em;margin:18px 0 0;padding-left:.32em;color:var(--accent)}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;color:var(--soft);margin:2px 0 26px}
.botoes{display:flex;flex-direction:column;gap:12px;margin:0 0 26px}
.botoes a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 18px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;
  box-shadow:0 1px 2px rgba(60,45,30,.06);transition:transform .08s ease,box-shadow .15s ease}
.botoes a:active{transform:scale(.985)}
.botoes a.destaque{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.botoes svg{width:22px;height:22px;flex:none}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:24px;margin:8px 0 10px}
.lojas{display:grid;gap:10px;text-align:left}
.loja{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.loja b{display:block;font-size:16px}
.loja span{color:var(--soft);font-size:14.5px}
.loja a{display:inline-block;margin-top:6px;color:var(--accent);font-weight:600;font-size:14.5px;text-decoration:none}
.vazio{color:var(--soft);font-style:italic}
footer{margin-top:30px;font-size:12px;color:var(--soft)}
footer a{color:var(--soft)}
</style>
</head>
<body>
<main>
  <h1 class="marca">LINUM</h1>
  <p class="sub">100% linho feito à mão</p>
  <nav class="botoes" id="botoes" aria-label="Contatos da LINUM"></nav>
  <section id="secLojas" hidden><h2>Nossas lojas</h2><div class="lojas" id="lojas"></div></section>
  <footer>LINUM · Rio de Janeiro · <a href="/privacidade.html">Privacidade</a></footer>
</main>
<script>
// ===== LINKS DA LINUM (preencher com os do Trakto; link vazio = o botão não aparece) =====
const LINUM = {
  botoes: [
    { id: "whatsapp",  texto: "Fale com a gente no WhatsApp", url: "", destaque: true },
    { id: "instagram", texto: "Instagram",                     url: "" },
    { id: "site",      texto: "Nosso site",                    url: "" },
  ],
  lojas: [
    { nome: "Ipanema", endereco: "", mapa: "" },
    { nome: "Gávea",   endereco: "", mapa: "" },
  ],
};
// =========================================================================================
const ICONES = {
  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1.1 2.7 11.5 11.5 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3Z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const seguro = u => /^https:\/\//i.test(u || "") ? u : "";
const botoes = LINUM.botoes.filter(b => seguro(b.url));
document.getElementById("botoes").innerHTML = botoes.length
  ? botoes.map(b => `<a href="${esc(b.url)}" target="_blank" rel="noopener" data-clique="${esc(b.id)}" class="${b.destaque ? "destaque" : ""}">${ICONES[b.id] || ""}${esc(b.texto)}</a>`).join("")
  : '<p class="vazio">Em breve.</p>';
const lojas = LINUM.lojas.filter(l => l.endereco);
if (lojas.length) {
  document.getElementById("secLojas").hidden = false;
  document.getElementById("lojas").innerHTML = lojas.map(l => `<div class="loja"><b>${esc(l.nome)}</b><span>${esc(l.endereco)}</span>
    ${seguro(l.mapa) ? `<br><a href="${esc(l.mapa)}" target="_blank" rel="noopener" data-clique="mapa-${esc(l.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""))}">Ver no mapa →</a>` : ""}</div>`).join("");
}
// cada toque num botão conta como /linum/clique/<botão>, com a origem do QR (acesso.js)
document.addEventListener("click", e => {
  const a = e.target.closest("[data-clique]");
  if (a && window.NERVIA_REGISTRAR) window.NERVIA_REGISTRAR("/linum/clique/" + a.dataset.clique);
});
</script>
<script src="/acesso.js" defer></script>
</body>
</html>
