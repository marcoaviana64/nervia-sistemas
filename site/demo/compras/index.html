<style>
/* Orçamentos de Compras (app "compras", tabelas cmp_). Regras de negócio ficam no servidor (funções cmp_*);
   esta tela só mostra e chama as funções. Papéis por unidade: solicitante, comprador, gerente, diretor. */
:root{
  --bg:#f3f6f8;--surface:#fff;--surface-2:#eaf1f4;--border:#dde6ec;--ink:#0f1b2d;--ink-soft:#4f5f73;--ink-faint:#8796a8;
  --accent:#107e99;--accent-soft:#e3f3f7;--primary:#0b2545;
  --ok:#1d7f46;--ok-bg:#e6f4ec;--crit:#b3261e;--crit-bg:#fbeaea;--warn:#a86400;--warn-bg:#fff3e0;--info:#2568a8;--info-bg:#e7f1fa;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620;--surface:#122130;--surface-2:#18293a;--border:#24394e;--ink:#eef4f8;--ink-soft:#b3c3d1;--ink-faint:#7f93a6;
  --accent:#3fc1dd;--accent-soft:rgba(63,193,221,.15);--primary:#cfe3f0;
  --ok:#43c07e;--ok-bg:rgba(67,192,126,.14);--crit:#f07a72;--crit-bg:rgba(240,122,114,.14);--warn:#e3ad57;--warn-bg:rgba(227,173,87,.14);--info:#5eabe8;--info-bg:rgba(94,171,232,.14);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.oculto{display:none!important}
.casca{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.topo{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.topo .marca{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,#107e99,#0b2545);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.topo span{color:var(--ink-soft);font-size:.8rem}
.embutido .topo{display:none}
.barra{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 8px;margin-bottom:12px}
.barra .aba{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink-soft)}
.barra .aba.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.barra .dir{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft)}
.papeis{font-size:12px;color:var(--ink-soft);margin:-6px 0 10px}
select,input,textarea{font:inherit;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.barra select{width:auto}
textarea{min-height:60px}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px}
.bt{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ink-soft)}.bt.pri{background:var(--accent);border-color:var(--accent);color:#fff}.bt.perigo{color:var(--crit);border-color:var(--crit)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.msg{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:13px;white-space:pre-line}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--crit-bg);color:var(--crit)}.msg.info{background:var(--info-bg);color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--ink-soft)}.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:var(--ink-faint)}
.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card h2 .dir{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
th div{text-transform:none;letter-spacing:0;font-weight:400}
tr.clica{cursor:pointer}tr.clica:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.melhor{background:var(--ok-bg);font-weight:600}
th.escolhida,td.escolhida{box-shadow:inset 0 0 0 2px var(--accent)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.t-crit{background:var(--crit-bg);color:var(--crit)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-info{background:var(--info-bg);color:var(--info)}.t-mut{background:var(--surface-2);color:var(--ink-soft)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.mut{color:var(--ink-soft);font-size:12.5px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grade .tudo{grid-column:1/-1}
.passos{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.passos span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft)}
.passos span.feito{background:var(--accent-soft);color:var(--accent)}.passos span.agora{background:var(--accent);color:#fff}
.aviso{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.aviso.crit{background:var(--crit-bg);color:var(--crit)}.aviso.ok{background:var(--ok-bg);color:var(--ok)}.aviso.info{background:var(--info-bg);color:var(--info)}.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.barrinha{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:3px}.barrinha i{display:block;height:100%;background:var(--accent)}
.hist div{padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}.hist div:last-child{border:0}
dialog{border:0;border-radius:14px;padding:18px;max-width:620px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px}
.chk{display:inline-flex;gap:5px;align-items:center;margin:3px 10px 3px 0;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.chk input{width:auto}
.centro{padding:60px 16px;text-align:center;color:var(--ink-soft)}
@media print{.barra,.acoes,.topo,.papeis{display:none!important}body{background:#fff}}
</style>

  <div class="topo"><div class="marca">OC</div><div><b>Orçamentos de Compras</b><br><span>Requisição, 3 orçamentos, aprovação e avaliação de fornecedores</span></div></div>
  <div id="aviso" class="centro">Carregando…</div>
  <div id="app" class="oculto">
    <div class="barra">
      <button class="aba on" data-v="painel">Painel</button>
      <button class="aba" data-v="reqs">Requisições</button>
      <button class="aba" data-v="forn">Fornecedores</button>
      <button class="aba" data-v="hist">Histórico</button>
      <button class="aba" data-v="config" id="abaConfig">Configuração</button>
      <div class="dir"><span>Unidade</span><select id="unidade"></select></div>
    </div>
    <div class="papeis" id="papeis"></div>
    <div id="msg" class="msg oculto"></div>
    <div id="tela"></div>
  </div>
</div>

<script>
const CFG = window.NERVIA_CONFIG || {};
const EMBUTIDO = window.self !== window.top;
if (EMBUTIDO) document.documentElement.classList.add("embutido");
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const checar = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const brl = v => (v == null || v === "" ? "—" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }));
const num = v => Number(v || 0);
const dataBR = v => v ? new Date(v.length === 10 ? v + "T12:00:00" : v).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" }) : "—";
const dataHora = v => v ? new Date(v).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const hojeISO = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
const tag = (t, c) => `<span class="tag ${c}">${esc(t)}</span>`;
function msg(tipo, texto) { const m = $("msg"); m.className = "msg " + tipo; m.textContent = texto; m.scrollIntoView({ block: "nearest" }); if (tipo === "ok") setTimeout(() => m.classList.add("oculto"), 6000); }
function limparMsg() { $("msg").className = "msg oculto"; }

const STATUS = {
  nova: ["Nova", "t-mut"], cotacao: ["Em cotação", "t-info"], aprovacao: ["Aguardando aprovação", "t-warn"], aprovada: ["Aprovada", "t-ok"],
  reprovada: ["Reprovada", "t-crit"], pedido: ["Pedido emitido", "t-acc"], entregue: ["Entregue · avaliar", "t-warn"], concluida: ["Concluída", "t-ok"], cancelada: ["Cancelada", "t-mut"],
};
const PASSOS = [["nova", "Requisição"], ["cotacao", "Cotação"], ["aprovacao", "Aprovação"], ["aprovada", "Aprovada"], ["pedido", "Pedido"], ["entregue", "Entregue"], ["concluida", "Avaliada"]];
const PAGAMENTOS = [["À vista", 0], ["15 dias", 15], ["28 dias", 28], ["30 dias", 30], ["30/60", 45], ["30/60/90", 60], ["Outro", null]];
const PAPEL_NOME = { solicitante: "Solicitante", comprador: "Comprador", gerente: "Gerente", diretor: "Diretor" };

let EU = null, ADMIN = false, MEMBROS = [], UNIDADES = [], GRUPOS = [], FORN = [], REQS = [], UNID = null, VISTA = "painel", SEL = null, DET = null, FILTRO = { st: "abertas", g: "", q: "" };

// ---------------------------------------------------------------- papéis
const papeis = () => ADMIN ? new Set(["solicitante", "comprador", "gerente", "diretor"]) : new Set(MEMBROS.filter(m => m.unidade_id === UNID).map(m => m.papel));
const tem = p => papeis().has(p);
const unidade = () => UNIDADES.find(u => u.id === UNID) || {};
const fornecedor = id => FORN.find(f => f.id === id) || { nome: "?", avais: [] };
const temAval = (f, uid) => (f.avais || []).some(a => a.unidade_id === uid);

// ---------------------------------------------------------------- carga
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("aviso").innerHTML = 'Entre na <a href="/demo/" target="_top">Área do Cliente</a> para usar o app.'; return; }
  EU = session.user;
  try {
    const p = checar(await sb.from("perfis").select("admin, nome, email").eq("user_id", EU.id).maybeSingle());
    ADMIN = !!(p && p.admin);
    MEMBROS = checar(await sb.from("cmp_membros").select("unidade_id, papel").eq("user_id", EU.id));
    UNIDADES = checar(await sb.from("cmp_unidades").select("*").order("nome"));
    if (!ADMIN) UNIDADES = UNIDADES.filter(u => u.ativo);
    if (!UNIDADES.length) { $("aviso").textContent = "Seu login ainda não tem papel em nenhuma unidade de Compras. Peça à Nervia para liberar (solicitante, comprador, gerente ou diretor)."; return; }
    await carregarGrupos();
    const salva = localStorage.getItem("cmp-unidade");
    UNID = UNIDADES.some(u => u.id === salva) ? salva : UNIDADES[0].id;
    $("unidade").innerHTML = UNIDADES.map(u => `<option value="${u.id}">${esc(u.nome)}${u.ativo ? "" : " (inativa)"}</option>`).join("");
    $("unidade").value = UNID;
    $("abaConfig").classList.toggle("oculto", !ADMIN);
    $("aviso").classList.add("oculto"); $("app").classList.remove("oculto");
    await carregar();
  } catch (e) { $("aviso").textContent = "Não foi possível carregar: " + e.message; }
}
// grupos de compra (nome + descrição do que entra em cada um)
let GRUPO_DESC = {};
async function carregarGrupos() {
  const gs = checar(await sb.from("cmp_grupos").select("nome, descricao").order("ordem"));
  GRUPOS = gs.map(g => g.nome); GRUPO_DESC = Object.fromEntries(gs.map(g => [g.nome, g.descricao || ""]));
}
const dicaGrupo = g => GRUPO_DESC[g] ? esc(GRUPO_DESC[g]) : "";
async function carregar() {
  FORN = checar(await sb.rpc("cmp_fornecedores_lista"));
  REQS = checar(await sb.from("cmp_requisicoes").select("*").eq("unidade_id", UNID).order("id", { ascending: false }));
  if (SEL) DET = await carregarDetalhe(SEL);
  render();
}
async function carregarDetalhe(id) {
  const [props, aprovs, hist, aval, convs] = await Promise.all([
    sb.from("cmp_propostas").select("*").eq("requisicao_id", id).order("id"),
    sb.from("cmp_aprovacoes").select("*").eq("requisicao_id", id).order("id"),
    sb.from("cmp_historico").select("*").eq("requisicao_id", id).order("id"),
    sb.from("cmp_avaliacoes").select("*").eq("requisicao_id", id).maybeSingle(),
    sb.from("cmp_convites").select("*").eq("requisicao_id", id).order("id"),
  ]);
  return { props: checar(props), aprovs: checar(aprovs), hist: checar(hist), aval: checar(aval), convs: checar(convs) };
}
$("unidade").onchange = async () => { UNID = $("unidade").value; try { localStorage.setItem("cmp-unidade", UNID); } catch {} SEL = null; limparMsg(); await carregar(); };
document.querySelectorAll(".barra .aba").forEach(b => b.onclick = () => { VISTA = b.dataset.v; SEL = null; limparMsg(); render(); });

// chama uma função do servidor e recarrega; erro vira mensagem
async function acao(fn, args, ok) {
  limparMsg();
  const r = await sb.rpc(fn, args);
  if (r.error) { msg("err", r.error.message); return null; }
  await carregar();
  if (ok) msg("ok", typeof ok === "function" ? ok(r.data) : ok);
  return r.data ?? true;
}

// ---------------------------------------------------------------- render
function render() {
  document.querySelectorAll(".barra .aba").forEach(b => b.classList.toggle("on", b.dataset.v === VISTA));
  const ps = [...papeis()].map(p => PAPEL_NOME[p]);
  $("papeis").textContent = ADMIN ? "Equipe Nervia: todos os papéis em todas as unidades." : `Seu papel em ${unidade().nome}: ${ps.join(", ") || "nenhum"}.`;
  $("tela").innerHTML = SEL && DET ? vDetalhe() : ({ painel: vPainel, reqs: vReqs, forn: vForn, hist: vHist, config: vConfig }[VISTA] || vPainel)();
  if (VISTA === "hist" && !SEL) carregarHist();
  if (VISTA === "config" && !SEL) carregarConfig();
}

// ---------------------------------------------------------------- detalhe / mapa comparativo
function notaF(f) { return f.nota == null ? null : Number(f.nota); }
function pontuar(r, props) {
  if (!props.length) return [];
  const P = unidade().pesos || { preco: 40, prazo: 30, pagamento: 20, qualidade: 10 };
  const mT = Math.min(...props.map(p => tcoProp(p, r))), mZ = Math.min(...props.map(p => p.prazo_dias)), mG = Math.max(...props.map(p => p.pagamento_dias));
  return props.map(p => {
    const s = { preco: tcoProp(p, r) > 0 ? mT / tcoProp(p, r) * 100 : 100, prazo: (mZ + 1) / (p.prazo_dias + 1) * 100,
      pagamento: mG > 0 ? p.pagamento_dias / mG * 100 : 100, qualidade: (notaF(fornecedor(p.fornecedor_id)) ?? 3) / 5 * 100 };
    s.total = (s.preco * P.preco + s.prazo * P.prazo + s.pagamento * P.pagamento + s.qualidade * P.qualidade) / 100;
    return s;
  });
}

  if (FILTRO.q) { const q = FILTRO.q.toLowerCase(); l = l.filter(f => (f.nome + " " + f.documento).toLowerCase().includes(q)); }
  const pode = tem("comprador") || tem("gerente") || tem("diretor"), ger = tem("gerente"), hoje = hojeISO();
  return `<div class="card"><h2>Fornecedores <span class="mut">base única de todas as unidades</span><span class="dir">
    <select id="fG"><option value="">Todos os grupos</option>${GRUPOS.map(g => `<option ${g === FILTRO.g ? "selected" : ""}>${esc(g)}</option>`).join("")}</select>

    ${pode ? '<button class="bt pri" data-acao="novoForn">+ Novo fornecedor</button>' : ""}</span></h2>
  <div class="tw"><table><tr><th>Fornecedor</th><th>Grupos</th><th>Certidões</th><th>Cadastro / homologação</th><th>Aval do Gerente</th><th>Nota</th><th></th></tr>
  ${l.map(f => {
    const venc = f.certidoes_validade && f.certidoes_validade < hoje, perto = f.certidoes_validade && !venc && (new Date(f.certidoes_validade) - new Date(hoje)) / 864e5 < 30;
    return `<tr><td><b>${esc(f.nome)}</b><div class="mut">${f.tipo === "PF" ? "CPF" : "CNPJ"} ${esc(fmtDoc(f))}</div>${f.contato || f.telefone || f.email ? `<div class="mut">${esc([f.contato, f.telefone, f.email].filter(Boolean).join(" · "))}</div>` : ""}</td>
    <td>${f.grupos.map(g => tag(g, "t-acc")).join("")}</td>
    <td>${!f.certidoes_validade ? tag("não informada", "t-warn") : venc ? tag("vencidas em " + dataBR(f.certidoes_validade), "t-crit") : perto ? tag("vencem " + dataBR(f.certidoes_validade), "t-warn") : tag("ok até " + dataBR(f.certidoes_validade), "t-ok")}</td>
    <td>${esc(f.cadastrado_nome)}<div class="mut">${dataBR(f.cadastrado_em)} · homologado por quem cadastrou</div></td>
    <td>${(f.avais || []).map(a => tag(a.unidade + " ✓", "t-ok")).join("")}${temAval(f, UNID) ? "" : tag(unidade().nome + ": pendente", "t-warn")}
      ${ger ? `<div><button class="lnk" data-acao="aval" data-id="${f.id}" data-dar="${temAval(f, UNID) ? 0 : 1}">${temAval(f, UNID) ? "retirar aval" : "dar aval"}</button></div>` : ""}</td>
    <td>${f.nota == null ? tag("sem avaliação", "t-mut") : `${Number(f.nota).toFixed(1).replace(".", ",")} ★<div class="mut">${f.avaliacoes} aval. · ${f.unidades_avaliacao.map(esc).join(", ")}</div>`}<div class="mut">${f.compras} compra(s)</div></td>
    <td>${ADMIN || f.cadastrado_por === EU.id ? `<button class="lnk" data-acao="editForn" data-id="${f.id}">editar</button>` : ""}</td></tr>`;
  }).join("") || '<tr><td colspan="7" class="mut">Nenhum fornecedor.</td></tr>'}</table></div>
  <p class="mut">O aval do Gerente é por unidade e não impede cotação: só gera o aviso. A nota é a média das avaliações feitas pelos Gerentes após cada entrega, em todas as unidades. O CPF aparece completo só para quem cadastrou.</p></div>`;
}
const fmtDoc = f => f.tipo === "PF" ? (/^\d{11}$/.test(f.documento) ? f.documento.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : f.documento.replace(/^\*\*\*(\d{3})(\d{3})\*\*$/, "***.$1.$2-**"))
  : f.documento.replace(/^(\w{2})(\w{3})(\w{3})(\w{4})(\d{2})$/, "$1.$2.$3/$4-$5");

function dProposta(r, p) {
  const lista = FORN.filter(f => f.ativo && (p ? f.id === p.fornecedor_id : !DET.props.some(x => x.fornecedor_id === f.id)));
  const doGrupo = lista.filter(f => f.grupos.includes(r.grupo)), outros = lista.filter(f => !f.grupos.includes(r.grupo));
  const opt = f => `<option value="${f.id}">${esc(f.nome)}${f.certidoes_validade && f.certidoes_validade < hojeISO() ? " (certidões vencidas)" : ""}</option>`;
  const pg = p ? PAGAMENTOS.find(x => x[0] === p.pagamento) : null;
  abrir(`<h3>${p ? "Editar / re-cotar proposta" : "Registrar proposta"}</h3>
    <p class="mut">Quantidade: ${Number(r.quantidade).toLocaleString("pt-BR")} ${esc(r.unidade_medida)}. ${p ? "Mudar o preço conta como nova rodada (re-cotação) e guarda o preço anterior." : "Não achou o fornecedor? Cadastre em Fornecedores."}</p>
    <div class="grade"><div class="tudo"><label>Fornecedor</label><select name="f" ${p ? "disabled" : ""} required>${doGrupo.length ? `<optgroup label="${esc(r.grupo)}">${doGrupo.map(opt).join("")}</optgroup>` : ""}${outros.length ? `<optgroup label="Outros grupos">${outros.map(opt).join("")}</optgroup>` : ""}</select></div>
    <div><label>Preço unitário (R$)</label><input name="preco" type="number" min="0" step="0.01" required value="${p ? p.preco_unitario : ""}"></div>
    <div><label>Frete (R$)</label><input name="frete" type="number" min="0" step="0.01" value="${p ? p.frete : 0}"></div>

    <div><label>Pagamento</label><select name="pag">${PAGAMENTOS.map(([t]) => `<option ${p && (pg ? pg[0] === t : t === "Outro") ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div><label>Se "Outro": prazo médio (dias)</label><input name="pagdias" type="number" min="0" value="${p && !pg ? p.pagamento_dias : ""}"></div>
    <div><label>Custos extras 12 meses (R$)</label><input name="extras" type="number" min="0" step="0.01" value="${p ? p.custos_extras : 0}" title="manutenção, insumos — entra no custo total (TCO)"></div>
    <div><label>Proposta válida até</label><input name="val" type="date" value="${p && p.validade ? p.validade : ""}"></div>
    <div class="tudo"><label>Observações</label><input name="obs" value="${p ? esc(p.obs) : ""}" placeholder="garantia, marca, condições"></div></div>`,
  async f => {
    const pag = f.get("pag"), dias = pag === "Outro" ? Number(f.get("pagdias") || 0) : PAGAMENTOS.find(x => x[0] === pag)[1];
    await acao("cmp_salvar_proposta", { p_req: r.id, p_fornecedor: p ? p.fornecedor_id : f.get("f"), p_preco: Number(f.get("preco")), p_frete: Number(f.get("frete") || 0),
      p_extras: Number(f.get("extras") || 0), p_prazo: Number(f.get("prazo")), p_pagamento: pag === "Outro" ? `Outro (${dias} dias)` : pag, p_pagamento_dias: dias,
      p_validade: f.get("val") || null, p_obs: f.get("obs") }, p ? "Proposta atualizada." : "Proposta registrada.");
  }, "Salvar proposta");

// ---------------------------------------------------------------- cliques
document.addEventListener("change", e => {
  if (e.target.id === "fSt") { FILTRO.st = e.target.value; render(); }
  if (e.target.id === "fG") { FILTRO.g = e.target.value; render(); }
  if (e.target.id === "fQ") { FILTRO.q = e.target.value; render(); }
});
document.addEventListener("click", async e => {
  const linha = e.target.closest("[data-req]");
  if (linha && !e.target.closest("[data-acao]")) { SEL = Number(linha.dataset.req); limparMsg(); DET = await carregarDetalhe(SEL); render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-acao]"); if (!b) return;
  const a = b.dataset.acao, r = SEL ? REQS.find(x => x.id === SEL) : null, id = b.dataset.id;
  if (a === "voltar") { SEL = null; DET = null; render(); }
  else if (a === "novaReq") dNovaReq();
  else if (a === "novaProp") dProposta(r);
  else if (a === "editProp") dProposta(r, DET.props.find(p => p.id === Number(id)));
  else if (a === "delProp") {
    const p = DET.props.find(x => x.id === Number(id)), doForn = p.origem === "fornecedor";
    abrir(`<h3>Excluir a proposta de ${esc(fornecedor(p.fornecedor_id).nome)}?</h3><p class="mut">Fica registrado no histórico.${doForn ? " A proposta foi enviada pelo próprio fornecedor: escreva o motivo." : ""}</p>
      ${doForn ? '<label>Motivo</label><textarea name="m" required minlength="5"></textarea>' : ""}`,
      f => acao("cmp_excluir_proposta", { p_proposta: p.id, p_motivo: doForn ? f.get("m") : null }, "Proposta excluída."), "Excluir");
  }
  else if (a === "pdf") {
    const p = DET.props.find(x => x.id === Number(id)), jan = window.open("", "_blank");
    const res = await sb.storage.from("cmp-propostas").createSignedUrl(p.anexo, 300);
    if (res.error) { if (jan) jan.close(); return msg("err", "Não foi possível abrir o PDF: " + res.error.message); }
    if (jan) jan.location = res.data.signedUrl; else location.href = res.data.signedUrl;
  }
  else if (a === "convidar") dConvite(r);
  else if (["whats", "emailConvite", "copiarLink"].includes(a)) {
    const c = DET.convs.find(x => x.id === Number(id)), texto = textoConvite(c, r);
    if (a === "whats") {
      const tel = telWhats(c.telefone || (c.fornecedor_id ? fornecedor(c.fornecedor_id).telefone : ""));
      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`, "_blank", "noopener");
    } else if (a === "emailConvite") {
      const para = c.email || (c.fornecedor_id ? fornecedor(c.fornecedor_id).email : "");
      window.open(`mailto:${encodeURIComponent(para)}?subject=${encodeURIComponent(`Pedido de cotação #${r.id} — ${unidade().nome}`)}&body=${encodeURIComponent(texto)}`, "_blank");
    } else {
      try { await navigator.clipboard.writeText(linkConvite(c)); msg("ok", "Link copiado. Cole no WhatsApp ou e-mail do fornecedor."); }
      catch { abrir(`<h3>Link do convite</h3><p class="mut">Copie o endereço abaixo:</p><input readonly value="${esc(linkConvite(c))}" onfocus="this.select()">`, () => {}, "Fechar"); }
    }
  }
  else if (a === "cancelarConvite") {
    const c = DET.convs.find(x => x.id === Number(id));
    abrir(`<h3>Cancelar o convite?</h3><p class="mut">O link para de funcionar na hora. Uma proposta que o fornecedor já enviou continua no mapa (exclua à parte, se for o caso).</p>`,
      () => acao("cmp_convite_cancelar", { p_convite: c.id }, "Convite cancelado."), "Cancelar convite");
  }
  else if (a === "prazoConvite") {
    const c = DET.convs.find(x => x.id === Number(id));
    abrir(`<h3>Mudar o prazo do convite</h3><label>Propostas até</label><input name="prazo" type="date" required value="${c.prazo}" min="${hojeISO()}">
      <p class="mut">O link é o mesmo; avise o fornecedor do novo prazo.</p>`,
      f => acao("cmp_convite_prazo", { p_convite: c.id, p_prazo: f.get("prazo") }, "Prazo alterado."), "Salvar prazo");
  }
  else if (a === "escolher") {
    const p = DET.props.find(x => x.id === Number(id)), minT = Math.min(...DET.props.map(x => totalProp(x, r)));
    if (totalProp(p, r) <= minT) return acao("cmp_escolher", { p_req: r.id, p_proposta: p.id, p_justificativa: "" }, "Escolhido (menor preço).");
    abrir(`<h3>Justificativa</h3><div class="aviso info">${esc(fornecedor(p.fornecedor_id).nome)} não é o menor preço (${brl(totalProp(p, r))} contra ${brl(minT)}). Explique por que, para seguir à aprovação.</div>
      <textarea name="j" required minlength="10" placeholder="ex.: prazo do menor preço não atende; menor custo total com manutenção"></textarea>`,
      f => acao("cmp_escolher", { p_req: r.id, p_proposta: p.id, p_justificativa: f.get("j") }, "Escolha registrada com justificativa."), "Escolher");
  }
  else if (a === "excecao") abrir(`<h3>Exceção: fornecedor exclusivo</h3><p class="mut">Permite seguir com menos de ${unidade().minimo_propostas} propostas. Fica no histórico e o aprovador vê. Guarde a carta de exclusividade do fabricante.</p>
      <textarea name="t" required minlength="15" placeholder="ex.: peça original só vendida pelo fabricante (carta de exclusividade recebida em …)"></textarea>`,
      f => acao("cmp_excecao", { p_req: r.id, p_texto: f.get("t") }, "Exceção registrada."), "Registrar exceção");
  else if (a === "enviar") acao("cmp_enviar_aprovacao", { p_req: r.id }, al => al === "automatica" ? "Aprovada automaticamente (até a alçada, menor preço, fornecedor já usado)." : `Enviada para aprovação do ${al === "gerente" ? "Gerente" : "Gerente e depois do Diretor"}.`);
  else if (a === "aprovar" || a === "reprovar") {
    const ok = a === "aprovar", etapa = b.dataset.etapa, p = DET.props.find(x => x.id === r.proposta_escolhida), f = p ? fornecedor(p.fornecedor_id) : null;
    const semAval = ok && etapa === "gerente" && f && !temAval(f, UNID);
    abrir(`<h3>${ok ? "Aprovar" : "Reprovar"} como ${PAPEL_NOME[etapa]}</h3>
      ${semAval ? `<label class="chk"><input type="checkbox" name="aval" checked> Dar também o aval do Gerente a ${esc(f.nome)} para ${esc(unidade().nome)}</label>` : ""}
      <label style="margin-top:8px">Comentário ${ok ? "(opcional)" : "(obrigatório)"}</label><textarea name="c" ${ok ? "" : 'required minlength="5"'}></textarea>
      <p class="mut">Fica registrado com seu login, data e hora.</p>`,
      fd => acao("cmp_decidir", { p_req: r.id, p_aprovar: ok, p_comentario: fd.get("c"), p_dar_aval: !!fd.get("aval") },
        st => st === "reprovada" ? "Reprovada." : st === "aprovacao" ? "Aprovada pelo Gerente. Segue para o Diretor." : "Aprovada."), ok ? "Aprovar" : "Reprovar");
  }
  else if (a === "pedido") acao("cmp_emitir_pedido", { p_req: r.id }, `Pedido de compra PC-${r.id} emitido.`);
  else if (a === "entregue") acao("cmp_marcar_entregue", { p_req: r.id }, "Marcado como entregue. O Gerente avalia o fornecedor.");
  else if (a === "avaliar") {
    const p = DET.props.find(x => x.id === r.proposta_escolhida), f = fornecedor(p.fornecedor_id);
    const C = [["prazo", "Prazo cumprido"], ["qualidade", "Qualidade do produto/serviço"], ["conformidade", "Conforme a proposta"], ["atendimento", "Atendimento"]];
    abrir(`<h3>Avaliar ${esc(f.nome)}</h3><p class="mut">Compra #${r.id}. A nota vale para todas as unidades e não pode ser alterada depois.</p><div class="grade">
      ${C.map(([k, t]) => `<div><label>${t}</label><select name="${k}">${[5, 4, 3, 2, 1].map(n => `<option value="${n}">${n} — ${["", "Péssimo", "Ruim", "Regular", "Bom", "Ótimo"][n]}</option>`).join("")}</select></div>`).join("")}
      <div class="tudo"><label>Comentário</label><textarea name="c"></textarea></div></div>`,
      fd => acao("cmp_avaliar", { p_req: r.id, p_prazo: Number(fd.get("prazo")), p_qualidade: Number(fd.get("qualidade")), p_conformidade: Number(fd.get("conformidade")), p_atendimento: Number(fd.get("atendimento")), p_comentario: fd.get("c") }, "Avaliação registrada. Compra concluída."), "Registrar avaliação");
  }
  else if (a === "reabrir") acao("cmp_reabrir", { p_req: r.id }, "Reaberta para nova cotação.");
  else if (a === "cancelar") abrir(`<h3>Cancelar a requisição #${r.id}?</h3><label>Motivo</label><textarea name="m" required minlength="5"></textarea>`, f => acao("cmp_cancelar", { p_req: r.id, p_motivo: f.get("m") }, "Requisição cancelada."), "Cancelar requisição");
  else if (a === "imprimir") window.print();
  else if (a === "novoForn") dFornecedor();
  else if (a === "editForn") dFornecedor(FORN.find(f => f.id === id));
  else if (a === "aval") { const f = FORN.find(x => x.id === id), dar = b.dataset.dar === "1"; acao("cmp_aval", { p_fornecedor: id, p_unidade: UNID, p_dar: dar }, dar ? `Aval dado a ${f.nome}.` : `Aval retirado de ${f.nome}.`); }
  else if (a === "salvarUnidade") {
    const u = { nome: $("cNome").value.trim(), cnpj: $("cCnpj").value.replace(/\D/g, "") || null, minimo_propostas: Number($("cMin").value), alcada_automatica: Number($("cAuto").value),
      alcada_gerente: Number($("cGer").value), ativo: $("cAtivo").value === "1",
      pesos: { preco: Number($("pPreco").value), prazo: Number($("pPrazo").value), pagamento: Number($("pPag").value), qualidade: Number($("pQual").value) } };
    if (u.pesos.preco + u.pesos.prazo + u.pesos.pagamento + u.pesos.qualidade !== 100) return msg("err", "Os quatro pesos precisam somar 100.");
    const res = await sb.from("cmp_unidades").update(u).eq("id", UNID);
    if (res.error) return msg("err", res.error.message);
    UNIDADES = checar(await sb.from("cmp_unidades").select("*").order("nome")); render(); msg("ok", "Regras salvas.");
  }
  else if (a === "novaUnidade") abrir(`<h3>Nova unidade</h3><label>Nome</label><input name="n" required placeholder="ex.: Filial Campinas">`, async f => {
    const res = await sb.from("cmp_unidades").insert({ nome: f.get("n").trim() }).select().single();
    if (res.error) return msg("err", res.error.message);
    UNIDADES = checar(await sb.from("cmp_unidades").select("*").order("nome")); UNID = res.data.id;
    $("unidade").innerHTML = UNIDADES.map(u => `<option value="${u.id}">${esc(u.nome)}</option>`).join(""); $("unidade").value = UNID; await carregar(); msg("ok", "Unidade criada.");
  }, "Criar");
  else if (a === "addMembro") { const res = await sb.from("cmp_membros").insert({ user_id: $("mUser").value, unidade_id: UNID, papel: $("mPapel").value }); if (res.error) return msg("err", res.error.message.includes("duplicate") ? "Esse login já tem esse papel." : res.error.message); carregarConfig(); msg("ok", "Papel concedido."); }
  else if (a === "delMembro") { const res = await sb.from("cmp_membros").delete().match({ user_id: b.dataset.user, unidade_id: UNID, papel: b.dataset.papel }); if (res.error) return msg("err", res.error.message); carregarConfig(); msg("ok", "Papel retirado."); }
  else if (a === "addGrupo") { const n = $("gNovo").value.trim(); if (!n) return; const res = await sb.from("cmp_grupos").insert({ nome: n, ordem: 900, descricao: ($("gDesc") || {}).value?.trim() || "" }); if (res.error) return msg("err", res.error.message); await carregarGrupos(); render(); msg("ok", "Grupo incluído."); }
});

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") location.reload(); });
iniciar();
</script>
<script src="/marca-dagua.js" data-tipo="demo"></script>
<script src="/acesso.js" defer></script>
</body>
</html>
